    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap');
        :root {
            --color-primary: #6366f1;
            --color-surface: #f8fafc;
            --color-sidebar: #ffffff;
            --color-card: #ffffff;
            --color-text: #1e293b;
            --color-input: #f1f5f9;
        }
        body { font-family: 'Noto Sans TC', sans-serif; background-color: var(--color-surface); color: var(--color-text); transition: background-color 0.25s ease, color 0.25s ease; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        input[type="text"], input[type="email"], input[type="date"], input[type="datetime-local"], select, textarea {
            transition: all 0.2s ease-in-out; border: 1px solid transparent; background-color: var(--color-input); color: var(--color-text);
        }
        input:focus, select:focus, textarea:focus {
            background-color: var(--color-card); border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15); outline: none;
        }
        input:disabled, textarea:disabled { opacity: 0.7; cursor: not-allowed; }

        /* 動態主題面板色彩覆寫 */
        .theme-sidebar { background-color: var(--color-sidebar) !important; transition: background-color 0.25s ease; }
        .theme-app .bg-white { background-color: var(--color-card) !important; transition: background-color 0.25s ease; }
        .theme-app .text-slate-800, .theme-app .text-slate-700 { color: var(--color-text) !important; }
        .theme-app .bg-indigo-50 { background-color: color-mix(in srgb, var(--color-primary) 12%, var(--color-card)) !important; }
        .theme-app .text-indigo-600, .theme-app .text-indigo-700 { color: var(--color-primary) !important; }
        .theme-app .border-indigo-100, .theme-app .border-indigo-200 { border-color: color-mix(in srgb, var(--color-primary) 28%, transparent) !important; }

        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .urgent-row { animation: pulse-red 2s infinite; }
        @keyframes pulse-red {
            0% { background-color: rgba(254, 226, 226, 0.4); }
            50% { background-color: rgba(254, 226, 226, 0.8); }
            100% { background-color: rgba(254, 226, 226, 0.4); }
        }
        .warning-row { background-color: rgba(254, 243, 199, 0.7); transition: background-color 0.3s; }
        .warning-row:hover { background-color: rgba(254, 243, 199, 1); }

        .leaflet-tooltip {
            background: rgba(255, 255, 255, 0.95); border: 1px solid #f1f5f9; box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.1);
            border-radius: 0.75rem; padding: 0.5rem 0.75rem; font-family: 'Noto Sans TC', sans-serif;
        }
        .leaflet-tooltip-top:before { border-top-color: rgba(255, 255, 255, 0.95); }
        .leaflet-control-attribution { display: none; }
        
        .custom-cluster-icon {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); color: white; font-weight: 900;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4); border: 3px solid white; font-size: 15px; transition: transform 0.2s ease;
        }
        .custom-cluster-icon:hover { transform: scale(1.1); }
        
        /* 隱藏原生 datetime-local 圖示，使用自訂樣式 */
        input[type="datetime-local"]::-webkit-calendar-picker-indicator { cursor: pointer; opacity: 0.6; transition: 0.2s; }
        input[type="datetime-local"]::-webkit-calendar-picker-indicator:hover { opacity: 1; }
    </style>

    <script>
        Promise.all([
            import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js"),
            import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js"),
            import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js")
        ]).then(([app, auth, firestore]) => {
            window.FirebaseModules = {
                initializeApp: app.initializeApp, getAuth: auth.getAuth, signInAnonymously: auth.signInAnonymously,
                initializeFirestore: firestore.initializeFirestore, persistentLocalCache: firestore.persistentLocalCache,
                getFirestore: firestore.getFirestore, collection: firestore.collection, doc: firestore.doc,
                setDoc: firestore.setDoc, deleteDoc: firestore.deleteDoc, onSnapshot: firestore.onSnapshot, getDoc: firestore.getDoc
            };
        }).catch(err => console.error("Firebase SDK 載入失敗:", err));
    </script>

        const getLocalISODate = (date = new Date()) => {
            if (!date || isNaN(new Date(date).getTime())) return '';
            const d = new Date(date);
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        };
        
        const getDatetimeLocal = (dateStr) => {
            if(!dateStr) return '';
            return dateStr.substring(0, 16);
        };
        
        const formatDateTime = (dateStr) => {
            if(!dateStr) return '-';
            const d = new Date(dateStr);
            if(isNaN(d.getTime())) return dateStr;
            const isTimeIncluded = dateStr.includes('T') || dateStr.includes(' ');
            if (isTimeIncluded) {
                return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
            }
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        };

        const calculateWorkingDays = (dateStr, addDays = 3) => {
            if (!dateStr) return '';
            const d = new Date(dateStr.substring(0, 10)); // 只取日期部分
            if (isNaN(d.getTime())) return '';
            let daysAdded = 0;
            while (daysAdded < addDays) {
                d.setDate(d.getDate() + 1);
                if (d.getDay() !== 0 && d.getDay() !== 6) daysAdded++;
            }
            return getLocalISODate(d);
        };

        const calculateMonthsDeadline = (dateStr, addMonths = 2) => {
            if (!dateStr) return '';
            const d = new Date(dateStr.substring(0, 10));
            if (isNaN(d.getTime())) return '';
            d.setMonth(d.getMonth() + addMonths);
            return getLocalISODate(d);
        };

        const sortCases = (casesList) => {
            if (!Array.isArray(casesList)) return [];
            return [...casesList].sort((a, b) => {
                const getSortDate = (c) => c.caseType === 'SPECIAL' ? (c.extData?.assignDate || c.extData?.receiveDate || c.createdAt) : (c.extData?.surveyDate || c.extData?.replyDate || c.extData?.receiveDate || c.createdAt);
                return new Date(getSortDate(b) || 0) - new Date(getSortDate(a) || 0);
            });
        };

        const getDeadlineStatus = (c) => {
            if (c.status === 'CLOSED' || c.status === 'MERGED') return 'SAFE';
            if (!c.extData?.completionDeadline) return 'SAFE';
            const today = new Date(); today.setHours(0,0,0,0);
            const deadline = new Date(c.extData.completionDeadline); deadline.setHours(0,0,0,0);
            const diffDays = Math.ceil((deadline.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
            
            if (diffDays < 0) return 'OVERDUE';
            if (diffDays <= 15) return 'WARNING';
            return 'SAFE';
        };

        const advancedGeocode = async (district, address) => {
            if (!address) return null;
            const tryFetch = async (query) => {
                const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`;
                try {
                    const response = await fetch(url, { headers: { 'Accept-Language': 'zh-TW' } });
                    const data = await response.json();
                    if (data && data.length > 0) return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
                } catch (error) { console.error("Geocoding Error:", error); }
                return null;
            };

            let res = await tryFetch(`桃園市${district}${address}`);
            if (res) return res;

            let cleanAddr = address.replace(/與.*[路街]口/g, '').replace(/[前後旁]|附近|交叉口/g, '').trim();
            if (cleanAddr !== address && cleanAddr.length > 0) {
                res = await tryFetch(`桃園市${district}${cleanAddr}`);
                if (res) return res;
            }

            const roadMatch = address.match(/^.*?[路街大道巷]/);
            if (roadMatch && roadMatch[0] !== address) {
                res = await tryFetch(`桃園市${district}${roadMatch[0]}`);
                if (res) return res;
            }

            return null;
        };

            MapIcon: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon><line x1="8" y1="2" x2="8" y2="18"></line><line x1="16" y1="6" x2="16" y2="22"></line></svg>,
            Calendar: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>,
            ChevronLeft: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>,
            ChevronRight: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>,
            Cloud: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path></svg>,
            Palette: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="13.5" cy="6.5" r="0.5" fill="currentColor"></circle><circle cx="17.5" cy="10.5" r="0.5" fill="currentColor"></circle><circle cx="8.5" cy="7.5" r="0.5" fill="currentColor"></circle><circle cx="6.5" cy="12.5" r="0.5" fill="currentColor"></circle><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"></path></svg>,
        };

        const Modal = ({ isOpen, title, content, actions }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4 animate-fade-in">
                    <div className="bg-white rounded-3xl shadow-float max-w-md w-full overflow-hidden">
                        <div className="p-8">
                            <h3 className="text-xl font-bold text-slate-800 mb-3">{title}</h3>
                            <div className="text-slate-500 text-base mb-8 whitespace-pre-wrap leading-relaxed">{content}</div>
                            <div className="flex flex-col gap-3">{actions}</div>
                        </div>
                    </div>
                </div>
            );
        };

        // 雲端設定專用視窗組件
        const FirebaseConfigModal = ({ isOpen, onClose, currentConfig, onSave, onClear }) => {
            const [formData, setFormData] = useState({
                apiKey: '', authDomain: '', projectId: '', collectionName: 'my_cases'
            });

            useEffect(() => {
                if (isOpen) {
                    setFormData({
                        apiKey: currentConfig?.apiKey || '',
                        authDomain: currentConfig?.authDomain || '',
                        projectId: currentConfig?.projectId || '',
                        collectionName: currentConfig?.collectionName || 'my_cases'
                    });
                }
            }, [isOpen, currentConfig]);

            if (!isOpen) return null;

            const handleSubmit = (e) => {
                e.preventDefault();
                onSave({
                    apiKey: formData.apiKey.trim(),
                    authDomain: formData.authDomain.trim() || `${formData.projectId.trim()}.firebaseapp.com`,
                    projectId: formData.projectId.trim(),
                    collectionName: formData.collectionName.trim() || 'my_cases'
                });
            };

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4 animate-fade-in">
                    <div className="bg-white rounded-3xl shadow-float max-w-lg w-full overflow-hidden border border-slate-100">
                        <div className="p-6 md:p-8">
                            <div className="flex justify-between items-center mb-4">
                                <h3 className="text-xl font-black text-slate-800 flex items-center gap-2">
                                    <span className="p-2 rounded-xl bg-indigo-50 text-primary"><Icons.Cloud /></span>
                                    雲端資料庫設定 (Firebase)
                                </h3>
                                <button onClick={onClose} className="text-slate-400 hover:text-slate-600 p-1 font-bold">✕</button>
                            </div>
                            <p className="text-xs text-slate-500 mb-6 leading-relaxed bg-slate-50 p-3.5 rounded-2xl border border-slate-100">
                                💡 填入您個人的 Firebase 專案金鑰即可啟用跨裝置雲端即時同步。請確保您的 Firestore 規則已開啟讀寫權限，且 Authentication 已啟用「匿名登入 (Anonymous)」。若留空則以「單機模式」儲存在瀏覽器中。
                            </p>
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div>
                                    <label className="text-xs font-bold text-slate-600 block mb-1.5 px-1">API Key <span className="text-rose-500">*</span></label>
                                    <input required type="text" placeholder="例如：AIzaSyDIF96erTBV..." className="w-full rounded-xl px-4 py-3 text-sm font-mono border border-slate-200 bg-slate-50 focus:bg-white" value={formData.apiKey} onChange={e => setFormData({...formData, apiKey: e.target.value})} />
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-slate-600 block mb-1.5 px-1">Project ID (專案 ID) <span className="text-rose-500">*</span></label>
                                    <input required type="text" placeholder="例如：my-case-system-123" className="w-full rounded-xl px-4 py-3 text-sm font-mono border border-slate-200 bg-slate-50 focus:bg-white" value={formData.projectId} onChange={e => setFormData({...formData, projectId: e.target.value})} />
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label className="text-xs font-bold text-slate-600 block mb-1.5 px-1">Auth Domain (選填)</label>
                                        <input type="text" placeholder="預設由 Project ID 自動推算" className="w-full rounded-xl px-4 py-3 text-sm font-mono border border-slate-200 bg-slate-50 focus:bg-white" value={formData.authDomain} onChange={e => setFormData({...formData, authDomain: e.target.value})} />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-slate-600 block mb-1.5 px-1">集合名稱 (Collection)</label>
                                        <input type="text" placeholder="預設：my_cases" className="w-full rounded-xl px-4 py-3 text-sm font-mono border border-slate-200 bg-slate-50 focus:bg-white" value={formData.collectionName} onChange={e => setFormData({...formData, collectionName: e.target.value})} />
                                    </div>
                                </div>
                                <div className="flex flex-col sm:flex-row gap-2.5 pt-4 border-t border-slate-100 mt-6">
                                    {currentConfig?.apiKey && (
                                        <button type="button" onClick={onClear} className="px-4 py-3 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-xl font-bold text-sm transition-colors">
                                            切換回單機模式
                                        </button>
                                    )}
                                    <button type="button" onClick={onClose} className="flex-1 px-4 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl font-bold text-sm transition-colors">
                                        取消
                                    </button>
                                    <button type="submit" className="flex-1 px-4 py-3 bg-primary hover:opacity-90 text-white rounded-xl font-bold text-sm shadow-md transition-colors">
                                        儲存並連線
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            );
        };

        // 面板風格與自訂色彩設定視窗組件
        const ThemeSettingsModal = ({ isOpen, onClose, themeConfig, onUpdateTheme, onResetTheme }) => {
            if (!isOpen) return null;

            const colorFields = [
                { key: 'primary', label: '主題強調色 (按鈕/標籤/選取)' },
                { key: 'surface', label: '系統背景底色 (主畫面背景)' },
                { key: 'sidebar', label: '側邊導覽列背景色' },
                { key: 'card', label: '卡片與面板背景色 (表格/區塊)' },
                { key: 'text', label: '主要文字顏色' },
                { key: 'input', label: '輸入框與次要區塊底色' }
            ];

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4 animate-fade-in">
                    <div className="bg-white rounded-3xl shadow-float max-w-2xl w-full max-h-[90vh] flex flex-col overflow-hidden border border-slate-100">
                        <div className="p-6 md:p-8 overflow-y-auto space-y-6">
                            <div className="flex justify-between items-center">
                                <h3 className="text-xl font-black text-slate-800 flex items-center gap-2">
                                    <span className="p-2 rounded-xl bg-indigo-50 text-primary"><Icons.Palette /></span>
                                    面板風格與自訂色彩設定
                                </h3>
                                <button onClick={onClose} className="text-slate-400 hover:text-slate-600 p-1 font-bold text-lg">✕</button>
                            </div>

                            {/* 10 種預設主題風格 */}
                            <div>
                                <div className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 px-1">快速切換 10 種預設風格</div>
                                <div className="grid grid-cols-2 sm:grid-cols-5 gap-2.5">
                                    {THEME_PRESETS.map(preset => {
                                        const isSelected = themeConfig.id === preset.id;
                                        return (
                                            <button
                                                key={preset.id}
                                                type="button"
                                                onClick={() => onUpdateTheme({ ...preset })}
                                                className={`p-3 rounded-2xl border text-left transition-all flex flex-col gap-2 hover:scale-[1.02] ${isSelected ? 'border-primary ring-2 ring-primary/30 shadow-sm' : 'border-slate-200 hover:border-slate-300'}`}
                                                style={{ backgroundColor: preset.surface }}
                                            >
                                                <div className="flex items-center gap-1.5">
                                                    <span className="w-5 h-5 rounded-full shadow-sm border border-white/50" style={{ backgroundColor: preset.primary }}></span>
                                                    <span className="w-4 h-4 rounded-full border border-slate-300/60" style={{ backgroundColor: preset.card }}></span>
                                                    <span className="w-4 h-4 rounded-full border border-slate-300/60" style={{ backgroundColor: preset.sidebar }}></span>
                                                </div>
                                                <div className="text-xs font-bold truncate" style={{ color: preset.text }}>{preset.name}</div>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* 自訂各介面顏色 */}
                            <div className="border-t border-slate-100 pt-5">
                                <div className="flex justify-between items-center mb-3 px-1">
                                    <span className="text-xs font-bold text-slate-400 uppercase tracking-wider">自訂各介面區域顏色 (即時預覽)</span>
                                    {themeConfig.id === 'custom' && <span className="text-xs font-bold text-primary bg-indigo-50 px-2.5 py-0.5 rounded-full">目前使用：自訂配色</span>}
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                                    {colorFields.map(field => (
                                        <div key={field.key} className="flex items-center justify-between p-3 rounded-2xl border border-slate-200 bg-slate-50/60">
                                            <label className="text-xs font-bold text-slate-700">{field.label}</label>
                                            <div className="flex items-center gap-2">
                                                <span className="text-xs font-mono text-slate-400 uppercase">{themeConfig[field.key]}</span>
                                                <input
                                                    type="color"
                                                    value={themeConfig[field.key]}
                                                    onChange={(e) => onUpdateTheme({ ...themeConfig, id: 'custom', name: '自訂風格', [field.key]: e.target.value })}
                                                    className="w-8 h-8 rounded-lg cursor-pointer border-0 bg-transparent p-0"
                                                />
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="flex flex-col sm:flex-row gap-3 pt-4 border-t border-slate-100">
                                <button type="button" onClick={onResetTheme} className="px-5 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl font-bold text-sm transition-colors">
                                    恢復預設風格
                                </button>
                                <button type="button" onClick={onClose} className="flex-1 px-5 py-3 bg-primary hover:opacity-90 text-white rounded-xl font-bold text-sm shadow-md transition-all">
                                    完成設定
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const StatusBadge = ({ status }) => {
            const config = {
                PENDING: { color: 'bg-amber-50 text-amber-700 border border-amber-200', label: '辦理中' },
                CLOSED: { color: 'bg-emerald-50 text-emerald-700 border border-emerald-200', label: '已結案' },
                MERGED: { color: 'bg-slate-100 text-slate-500 border border-slate-300', label: '已併案' }
            }[status] || { color: 'bg-slate-100 text-slate-600', label: status };
            return <span className={`px-3 py-1.5 rounded-full text-xs font-bold tracking-wide shadow-sm ${config.color}`}>{config.label}</span>;
        };

        const CategoryBadge = ({ category, customName }) => {
            const config = {
                SURVEY: { color: 'bg-indigo-50 text-indigo-700', label: '會勘' },
                REPLY: { color: 'bg-cyan-50 text-cyan-700', label: '回復' },
                A1: { color: 'bg-rose-50 text-rose-700', label: 'A1事故' },
                FORWARD: { color: 'bg-purple-50 text-purple-700', label: '函轉' },
                SELF: { color: 'bg-teal-50 text-teal-700', label: '自辦' },
                OTHER_UNIT: { color: 'bg-blue-50 text-blue-700', label: '其他單位辦理' },
                DIRECTOR: { color: 'bg-red-100 text-red-700', label: '局長案' },
                TEMP: { color: 'bg-orange-100 text-orange-700', label: '臨時交辦' },
                OTHER_SPECIAL: { color: 'bg-stone-100 text-stone-700', label: '其他(特殊)' },
                OTHER: { color: 'bg-slate-200 text-slate-700', label: customName || '其他' },
            }[category] || { color: 'bg-slate-100 text-slate-600', label: '未分類' };
            return <span className={`px-3 py-1.5 rounded-full text-xs font-bold tracking-wide ${config.color} whitespace-nowrap`}>{config.label}</span>;
        };

        const WarningBadge = ({ caseData }) => {
            if (caseData.status === 'CLOSED' || caseData.status === 'MERGED') return <span className="text-slate-400 font-bold text-xs bg-slate-100 px-2 py-1 rounded-md border border-slate-200">無</span>;
            
            const status = getDeadlineStatus(caseData);
            if (status === 'OVERDUE') {
                return <span className="bg-rose-100 text-rose-700 px-2 py-1 rounded-md font-bold text-xs shadow-sm flex items-center w-fit gap-1 whitespace-nowrap border border-rose-200"><Icons.Alert /> 已逾期</span>;
            } else if (status === 'WARNING') {
                const today = new Date(); today.setHours(0,0,0,0);
                const deadline = new Date(caseData.extData.completionDeadline); deadline.setHours(0,0,0,0);
                const diffDays = Math.ceil((deadline.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
                return <span className="bg-amber-100 text-amber-700 px-2 py-1 rounded-md font-bold text-xs shadow-sm flex items-center w-fit gap-1 whitespace-nowrap border border-amber-200"><Icons.Clock /> 剩 {diffDays} 天</span>;
            }
            
            return <span className="bg-emerald-50 text-emerald-600 px-2 py-1 rounded-md font-bold text-xs border border-emerald-100 w-fit whitespace-nowrap flex items-center gap-1">安全期</span>;
        };

        const getRowStatusClass = (c) => {
            if (c.status === 'CLOSED' || c.status === 'MERGED') return 'hover:bg-slate-50/80 transition-colors';
            const status = getDeadlineStatus(c);
            if (status === 'OVERDUE') return 'urgent-row hover:bg-rose-50';
            if (status === 'WARNING') return 'warning-row';
            return 'hover:bg-slate-50/80 transition-colors';
        };

        const getDeadlineColor = (c) => {
             if (c.status === 'CLOSED' || c.status === 'MERGED') return 'text-slate-500';
             const status = getDeadlineStatus(c);
             if (status === 'OVERDUE') return 'text-red-600 font-bold';
             if (status === 'WARNING') return 'text-amber-600 font-bold';
             return 'text-slate-600';
        };

        const LocationPicker = ({ lat, lng, onChange }) => {
            const mapRef = useRef(null);
            const mapInstanceRef = useRef(null);
            const markerRef = useRef(null);

            useEffect(() => {
                if (!mapRef.current) return;
                if (!mapInstanceRef.current) {
                    const map = L.map(mapRef.current).setView([lat, lng], 16);
                    L.tileLayer('https://mt1.google.com/vt/lyrs=m&hl=zh-TW&x={x}&y={y}&z={z}', { maxZoom: 20, attribution: '&copy; Google Maps' }).addTo(map);

                    const iconHtml = `<div style="width: 24px; height: 24px; background-color: #ef4444; border-radius: 50%; border: 4px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.4);"></div>`;
                    const icon = L.divIcon({ html: iconHtml, className: '', iconSize: [24, 24], iconAnchor: [12, 12] });

                    const marker = L.marker([lat, lng], { draggable: true, icon }).addTo(map);
                    marker.on('dragend', () => { const pos = marker.getLatLng(); onChange(pos.lat, pos.lng); });

                    mapInstanceRef.current = map;
                    markerRef.current = marker;

                    setTimeout(() => map.invalidateSize(), 300);
                } else {
                    mapInstanceRef.current.setView([lat, lng], 16);
                    markerRef.current.setLatLng([lat, lng]);
                }
            }, [lat, lng]);

            return <div ref={mapRef} className="w-full h-full z-0"></div>;
        };

        const CaseMap = ({ cases, onSelectCase }) => {
            const mapRef = useRef(null);
            const mapInstanceRef = useRef(null);
            const markersLayerRef = useRef(null);
            const searchMarkerRef = useRef(null);
            const [searchInput, setSearchInput] = useState('');
            const [isSearching, setIsSearching] = useState(false);
            const [searchError, setSearchError] = useState('');

            const activeCases = useMemo(() => {
                return cases.filter(c => c.caseType !== 'SPECIAL').map(c => {
                    if (!c.location?.lat || !c.location?.lng) {
                        const fallback = DISTRICT_COORDS[c.location?.district];
                        if (fallback) {
                            let hash = 0; const idStr = c.id || '';
                            for (let i = 0; i < idStr.length; i++) hash = idStr.charCodeAt(i) + ((hash << 5) - hash);
                            const offsetLat = (Math.abs(Math.sin(hash)) - 0.5) * 0.025;
                            const offsetLng = (Math.abs(Math.cos(hash)) - 0.5) * 0.025;
                            return { ...c, location: { ...c.location, lat: fallback.lat + offsetLat, lng: fallback.lng + offsetLng, isFallback: true } };
                        }
                    }
                    return c;
                }).filter(c => c.location?.lat && c.location?.lng);
            }, [cases]);

            useEffect(() => {
                if (!mapRef.current) return;
                if (!mapInstanceRef.current) {
                    const map = L.map(mapRef.current).setView([24.9631, 121.2238], 12);
                    L.tileLayer('https://mt1.google.com/vt/lyrs=m&hl=zh-TW&x={x}&y={y}&z={z}', { maxZoom: 20, attribution: '&copy; Google Maps' }).addTo(map);
                    mapInstanceRef.current = map;
                    
                    markersLayerRef.current = L.markerClusterGroup({
                        maxClusterRadius: 40, spiderfyOnMaxZoom: true, disableClusteringAtZoom: 15,
                        iconCreateFunction: function(cluster) {
                            return L.divIcon({
                                html: `<div style="background: linear-gradient(135deg, #6366f1, #4f46e5); color: white; font-weight: 900; border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(99,102,241,0.4); border: 3px solid white; font-size: 16px; text-shadow: 0 1px 2px rgba(0,0,0,0.2); transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'">${cluster.getChildCount()}</div>`,
                                className: 'custom-cluster-icon', iconSize: [44, 44]
                            });
                        }
                    }).addTo(map);
                }

                markersLayerRef.current.clearLayers();
                const newMarkers = [];

                activeCases.forEach(c => {
                    let color = '#6366f1';
                    if (c.status === 'CLOSED' || c.status === 'MERGED') color = '#94a3b8';
                    else {
                        if (c.category === 'A1') color = '#ef4444'; else if (c.category === 'REPLY') color = '#06b6d4';
                        else if (c.category === 'TEMP') color = '#f97316'; else if (c.category === 'OTHER_UNIT') color = '#3b82f6';
                    }

                    const markerHtml = `<div style="width: 24px; height: 24px; background: ${color}; border-radius: 50%; border: 3px solid white; box-shadow: 0 4px 8px rgba(0,0,0,0.3); transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.2)'" onmouseout="this.style.transform='scale(1)'"></div>`;
                    const icon = L.divIcon({ html: markerHtml, className: '', iconSize: [24, 24], iconAnchor: [12, 12] });
                    const marker = L.marker([c.location.lat, c.location.lng], { icon });
                    
                    const isClosed = c.status === 'CLOSED' || c.status === 'MERGED';
                    const tooltipContent = `
                        <div style="min-width: 200px;">
                            <div style="font-size: 11px; font-weight: 900; color: ${color}; margin-bottom: 4px; display: flex; align-items: center; gap: 4px;">
                                <div style="width:8px; height:8px; border-radius:50%; background-color:${color};"></div>
                                ${isClosed ? '<span style="background: #e2e8f0; color: #475569; padding: 2px 6px; border-radius: 4px;">已結案</span>' : ''}
                                ${c.category === 'SURVEY' ? '會勘' : c.category === 'A1' ? 'A1事故' : '一般案件'}
                                ${c.location.isFallback ? '<span style="background: #fef08a; color: #854d0e; padding: 2px 6px; border-radius: 6px; margin-left: auto; font-size: 10px;">概略位置</span>' : ''}
                            </div>
                            <div style="font-size: 15px; font-weight: 800; color: ${isClosed ? '#64748b' : '#1e293b'}; text-decoration: ${isClosed ? 'line-through' : 'none'}; margin-bottom: 6px; line-height: 1.3;">${c.location.address}</div>
                            <div style="font-size: 13px; color: #64748b; max-width: 240px; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.5; background: #f8fafc; padding: 6px; border-radius: 8px;">${c.content}</div>
                            <div style="margin-top: 8px; font-size: 12px; color: ${color}; font-weight: bold; background: ${color}15; padding: 6px 8px; border-radius: 8px; text-align: center;">點擊查看詳情 👉</div>
                        </div>
                    `;

                    marker.bindTooltip(tooltipContent, { direction: 'top', offset: [0, -12], opacity: 1, className: 'custom-tooltip shadow-float border-0 rounded-xl' });
                    marker.on('click', () => onSelectCase(c));
                    newMarkers.push(marker);
                });
                
                markersLayerRef.current.addLayers(newMarkers);
                setTimeout(() => mapInstanceRef.current.invalidateSize(), 300);
            }, [activeCases, onSelectCase]);

            const handleSearch = async (e) => {
                if (e) e.preventDefault();
                if (!searchInput.trim()) return;
                setIsSearching(true); setSearchError('');
                try {
                    const query = searchInput.includes('桃園') ? searchInput : `桃園市${searchInput}`;
                    const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`;
                    const response = await fetch(url, { headers: { 'Accept-Language': 'zh-TW' } });
                    const data = await response.json();
                    if (data && data.length > 0) {
                        const lat = parseFloat(data[0].lat); const lng = parseFloat(data[0].lon);
                        if (mapInstanceRef.current) {
                            mapInstanceRef.current.flyTo([lat, lng], 17, { duration: 1.5 });
                            if (searchMarkerRef.current) mapInstanceRef.current.removeLayer(searchMarkerRef.current);
                            const iconHtml = `<div style="width: 32px; height: 32px; background: linear-gradient(135deg, #10b981, #059669); border-radius: 50% 50% 0 50%; transform: rotate(45deg); border: 3px solid white; box-shadow: 2px 2px 8px rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center;"><div style="width: 8px; height: 8px; background: white; border-radius: 50%;"></div></div>`;
                            const searchIcon = L.divIcon({ html: iconHtml, className: '', iconSize: [32, 32], iconAnchor: [16, 32] });
                            const newMarker = L.marker([lat, lng], { icon: searchIcon }).addTo(mapInstanceRef.current);
                            newMarker.bindTooltip(`<div style="min-width: 120px; text-align: center;"><div style="font-size: 12px; font-weight: 900; color: #059669; margin-bottom: 4px;">📍 搜尋定位點</div><div style="font-size: 14px; font-weight: bold; color: #1e293b;">${searchInput}</div></div>`, { direction: 'top', offset: [0, -30], className: 'custom-tooltip shadow-float border-0 rounded-xl', opacity: 0.95 }).openTooltip();
                            searchMarkerRef.current = newMarker;
                        }
                    } else {
                        setSearchError('找不到該地址，請嘗試加上更完整的行政區或路段名。');
                        setTimeout(() => setSearchError(''), 3500);
                    }
                } catch (err) {
                    setSearchError('定位服務暫時無法使用，請稍後再試。'); setTimeout(() => setSearchError(''), 3500);
                } finally { setIsSearching(false); }
            };

            return (
                <div className="h-full flex flex-col animate-fade-in bg-white rounded-3xl shadow-soft p-4 md:p-6 border border-slate-100">
                    <div className="flex flex-col xl:flex-row justify-between items-start xl:items-center mb-4 pl-2 gap-4">
                        <div>
                            <h3 className="text-xl font-black text-slate-800 flex items-center gap-2"><Icons.MapIcon /> 案件空間分布</h3>
                            <p className="text-sm text-slate-400 mt-1 font-medium">包含已結案歷史案件 (灰色標記)</p>
                        </div>
                        <div className="flex flex-col sm:flex-row items-center gap-3 w-full xl:w-auto">
                            <form onSubmit={handleSearch} className="relative w-full sm:w-72 xl:w-80">
                                <div className="absolute inset-y-0 left-3 flex items-center pointer-events-none text-slate-400"><Icons.Search /></div>
                                <input type="text" placeholder="在地圖上搜尋地址或路口..." className="w-full pl-10 pr-16 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:ring-2 focus:ring-indigo-500/30 transition-all font-bold text-slate-700 placeholder-slate-400" value={searchInput} onChange={(e) => setSearchInput(e.target.value)} />
                                <button type="submit" disabled={isSearching} className="absolute inset-y-1.5 right-1.5 px-3 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 border border-indigo-200 text-xs font-bold rounded-lg transition-colors disabled:opacity-50">{isSearching ? '尋找中' : '定位'}</button>
                                {searchError && <div className="absolute top-full left-0 mt-2 bg-rose-50 text-rose-600 text-xs font-bold px-3 py-2 rounded-lg border border-rose-200 shadow-sm z-10 flex items-center gap-1 animate-fade-in"><Icons.Alert /> {searchError}</div>}
                            </form>
                            <span className="text-sm bg-indigo-50 text-indigo-600 px-4 py-2.5 rounded-xl font-bold border border-indigo-100 whitespace-nowrap hidden sm:block">地圖案件數：{activeCases.length}</span>
                        </div>
                    </div>
                    <div ref={mapRef} className="w-full flex-1 rounded-2xl overflow-hidden shadow-inner border border-slate-200 z-0 relative"></div>
                </div>
            );
        };

        const CalendarView = ({ cases, onSelectCase }) => {
            const [currentDate, setCurrentDate] = useState(new Date());
            const [viewMode, setViewMode] = useState('WEEK');

            const surveyCases = useMemo(() => {
                return cases.filter(c => c.status !== 'MERGED' && c.caseType !== 'SPECIAL' && ['SURVEY', 'A1', 'SELF', 'OTHER_UNIT'].includes(c.category) && c.extData?.surveyDate);
            }, [cases]);

            const handlePrev = () => {
                const d = new Date(currentDate);
                if (viewMode === 'MONTH') d.setMonth(d.getMonth() - 1);
                else if (viewMode === 'WEEK') d.setDate(d.getDate() - 7);
                else d.setDate(d.getDate() - 1);
                setCurrentDate(d);
            };

            const handleNext = () => {
                const d = new Date(currentDate);
                if (viewMode === 'MONTH') d.setMonth(d.getMonth() + 1);
                else if (viewMode === 'WEEK') d.setDate(d.getDate() + 7);
                else d.setDate(d.getDate() + 1);
                setCurrentDate(d);
            };

            const getDisplayTitle = () => {
                if (viewMode === 'MONTH') return `${currentDate.getFullYear()}年 ${currentDate.getMonth() + 1}月`;
                if (viewMode === 'WEEK') {
                    const start = new Date(currentDate); start.setDate(currentDate.getDate() - currentDate.getDay());
                    const end = new Date(start); end.setDate(start.getDate() + 6);
                    return `${start.getMonth() + 1}/${start.getDate()} - ${end.getMonth() + 1}/${end.getDate()}`;
                }
                return `${currentDate.getFullYear()}年 ${currentDate.getMonth() + 1}月 ${currentDate.getDate()}日`;
            };

            const renderTimeline = () => {
                let days = [];
                if (viewMode === 'DAY') {
                    days = [new Date(currentDate)];
                } else {
                    const start = new Date(currentDate); start.setDate(currentDate.getDate() - currentDate.getDay());
                    for (let i = 0; i < 7; i++) {
                        const d = new Date(start); d.setDate(start.getDate() + i); days.push(d);
                    }
                }

                const dayCases = days.map(day => {
                    const dateStr = getLocalISODate(day);
                    return {
                        date: day,
                        cases: surveyCases.filter(c => c.extData.surveyDate.startsWith(dateStr)).sort((a,b) => {
                            const timeA = a.extData.surveyDate.includes('T') ? a.extData.surveyDate.split('T')[1] : '00:00';
                            const timeB = b.extData.surveyDate.includes('T') ? b.extData.surveyDate.split('T')[1] : '00:00';
                            return timeA.localeCompare(timeB);
                        })
                    };
                });

                const HOURS = Array.from({length: 12}, (_, i) => i + 8);
                const MIN_HOUR = 8;
                const PIXELS_PER_HOUR = 120;

                const getPositionStyle = (timeStr, concurrentIndex = 0, totalConcurrent = 1) => {
                    if(!timeStr.includes('T') && !timeStr.includes(' ')) return { top: 0, height: 40, position: 'relative' };
                    
                    const timePart = timeStr.includes('T') ? timeStr.split('T')[1] : timeStr.split(' ')[1];
                    const [hh, mm] = timePart.split(':').map(Number);
                    
                    const hourDiff = hh - MIN_HOUR;
                    const topPixels = (hourDiff * PIXELS_PER_HOUR) + ((mm / 60) * PIXELS_PER_HOUR);
                    
                    const width = `calc(${100 / totalConcurrent}% - 4px)`;
                    const left = `calc(${100 / totalConcurrent * concurrentIndex}%)`;

                    return { position: 'absolute', top: `${topPixels}px`, height: `${PIXELS_PER_HOUR - 10}px`, width: width, left: left, zIndex: 10 + concurrentIndex };
                };

                return (
                    <div className="flex-1 flex flex-col bg-slate-50 rounded-2xl border border-slate-200 overflow-hidden relative">
                        <div className="flex bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
                            <div className="w-16 shrink-0 border-r border-slate-200 flex items-center justify-center bg-slate-50"><Icons.Clock /></div>
                            {dayCases.map((dc, i) => {
                                const isToday = getLocalISODate(dc.date) === getLocalISODate(new Date());
                                return (
                                    <div key={i} className={`flex-1 text-center py-3 border-r border-slate-100 ${isToday ? 'bg-indigo-50/50' : ''}`}>
                                        <div className={`text-xs font-bold mb-1 ${isToday ? 'text-indigo-500' : 'text-slate-400'}`}>
                                            {['日','一','二','三','四','五','六'][dc.date.getDay()]}
                                        </div>
                                        <div className={`text-lg font-black ${isToday ? 'text-indigo-700 bg-indigo-100 w-8 h-8 rounded-full flex items-center justify-center mx-auto' : 'text-slate-700'}`}>
                                            {dc.date.getDate()}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                        
                        <div className="flex-1 overflow-y-auto relative bg-white">
                            <div className="flex border-b-2 border-slate-200 bg-amber-50/30">
                                <div className="w-16 shrink-0 border-r border-slate-200 p-2 text-xs font-bold text-slate-500 flex flex-col justify-center items-center bg-slate-50">全天</div>
                                {dayCases.map((dc, i) => {
                                    const allDayCases = dc.cases.filter(c => !c.extData.surveyDate.includes('T') && !c.extData.surveyDate.includes(' '));
                                    return (
                                        <div key={i} className="flex-1 border-r border-slate-100 p-1 min-h-[40px]">
                                            {allDayCases.map((c, j) => (
                                                <div key={j} onClick={() => onSelectCase(c)} className="bg-indigo-100 text-indigo-700 p-1.5 mb-1 rounded text-xs font-bold truncate cursor-pointer hover:bg-indigo-200 transition-colors border border-indigo-200">
                                                    {c.location?.address}
                                                </div>
                                            ))}
                                        </div>
                                    );
                                })}
                            </div>

                            <div className="flex relative" style={{ height: `${HOURS.length * PIXELS_PER_HOUR}px` }}>
                                <div className="w-16 shrink-0 border-r border-slate-200 bg-slate-50 sticky left-0 z-20">
                                    {HOURS.map(h => (
                                        <div key={h} className="text-xs font-bold text-slate-400 text-center relative" style={{ height: `${PIXELS_PER_HOUR}px` }}>
                                            <span className="absolute top-0 left-0 w-full -mt-2 bg-slate-50">{String(h).padStart(2, '0')}:00</span>
                                        </div>
                                    ))}
                                </div>
                                
                                {dayCases.map((dc, colIndex) => {
                                    const timedCases = dc.cases.filter(c => c.extData.surveyDate.includes('T') || c.extData.surveyDate.includes(' '));
                                    
                                    const grouped = {};
                                    timedCases.forEach(c => {
                                        const t = c.extData.surveyDate;
                                        if(!grouped[t]) grouped[t] = [];
                                        grouped[t].push(c);
                                    });

                                    return (
                                        <div key={colIndex} className="flex-1 border-r border-slate-100 relative">
                                            {HOURS.map(h => (
                                                <Fragment key={`grid-${h}`}>
                                                    <div className="absolute w-full border-t border-slate-200" style={{ top: `${(h - MIN_HOUR) * PIXELS_PER_HOUR}px` }}></div>
                                                    <div className="absolute w-full border-t border-slate-100 border-dashed" style={{ top: `${(h - MIN_HOUR + 0.5) * PIXELS_PER_HOUR}px` }}></div>
                                                </Fragment>
                                            ))}
                                            
                                            {Object.entries(grouped).map(([timeStr, groupCases]) => {
                                                return groupCases.map((c, index) => {
                                                    const style = getPositionStyle(timeStr, index, groupCases.length);
                                                    const isClosed = c.status === 'CLOSED';
                                                    return (
                                                        <div key={c.id} onClick={() => onSelectCase(c)} style={style} className={`absolute m-[2px] p-2 rounded-lg cursor-pointer transition-all hover:scale-[1.02] hover:z-30 shadow-sm border overflow-hidden ${isClosed ? 'bg-slate-100 border-slate-300' : 'bg-white border-indigo-300'}`}>
                                                            <div className={`w-1 h-full absolute left-0 top-0 ${isClosed ? 'bg-slate-400' : 'bg-primary'}`}></div>
                                                            <div className={`text-xs font-bold mb-0.5 flex items-center gap-1 ${isClosed ? 'text-slate-500' : 'text-indigo-600'}`}>
                                                                {timeStr.includes('T') ? timeStr.split('T')[1] : timeStr.split(' ')[1]} {isClosed && <Icons.Check/>}
                                                            </div>
                                                            <div className={`font-black text-sm mb-1 leading-tight line-clamp-2 ${isClosed ? 'text-slate-600 line-through' : 'text-slate-800'}`}>{c.location?.address}</div>
                                                            <div className="text-xs text-slate-500 line-clamp-1">{c.extData?.assignee || '未指派'}</div>
                                                            {viewMode === 'DAY' && (
                                                                <div className="text-xs text-slate-400 mt-2 line-clamp-2 bg-slate-50 p-1.5 rounded">{c.content}</div>
                                                            )}
                                                        </div>
                                                    );
                                                });
                                            })}
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                );
            };

            const renderMonth = () => {
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();
                const firstDay = new Date(year, month, 1);
                const lastDay = new Date(year, month + 1, 0);
                const startOffset = firstDay.getDay();
                const totalDays = lastDay.getDate();
                
                const days = [];
                for(let i=0; i<startOffset; i++) days.push(null);
                for(let i=1; i<=totalDays; i++) days.push(new Date(year, month, i));

                return (
                    <div className="flex-1 flex flex-col bg-white rounded-2xl border border-slate-200 overflow-hidden">
                        <div className="grid grid-cols-7 border-b border-slate-200 bg-slate-50">
                            {['日','一','二','三','四','五','六'].map(d => <div key={d} className="py-2 text-center text-xs font-bold text-slate-500">{d}</div>)}
                        </div>
                        <div className="flex-1 grid grid-cols-7 auto-rows-fr">
                            {days.map((date, idx) => {
                                if(!date) return <div key={idx} className="border-b border-r border-slate-100 bg-slate-50/50 p-1"></div>;
                                const dateStr = getLocalISODate(date);
                                const dayCases = surveyCases.filter(c => c.extData.surveyDate.startsWith(dateStr));
                                const isToday = dateStr === getLocalISODate(new Date());

                                return (
                                    <div key={idx} className={`border-b border-r border-slate-100 p-1 md:p-2 hover:bg-slate-50 flex flex-col min-h-[100px] ${isToday ? 'bg-indigo-50/20' : ''}`}>
                                        <div className={`text-xs font-bold w-6 h-6 flex items-center justify-center rounded-full mb-1 ${isToday ? 'bg-primary text-white' : 'text-slate-600'}`}>{date.getDate()}</div>
                                        <div className="flex-1 overflow-y-auto space-y-1 pr-1 custom-scrollbar">
                                            {dayCases.map(c => {
                                                const time = formatDateTime(c.extData.surveyDate).split(' ')[1] || '';
                                                return (
                                                    <div key={c.id} onClick={() => onSelectCase(c)} className={`text-[10px] md:text-xs p-1 md:p-1.5 rounded truncate cursor-pointer transition-colors border ${c.status==='CLOSED' ? 'bg-slate-100 text-slate-500 border-slate-200' : 'bg-indigo-50 text-indigo-700 border-indigo-100 hover:bg-indigo-100 hover:border-indigo-300 font-bold'}`}>
                                                        {time && <span className="mr-1 opacity-70">{time}</span>}
                                                        {c.location?.district} {c.location?.address}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            };

            return (
                <div className="h-full flex flex-col animate-fade-in bg-white rounded-3xl shadow-soft p-4 border border-slate-100">
                    <div className="flex flex-col sm:flex-row justify-between items-center mb-4 gap-4 px-2">
                        <div className="flex items-center gap-4">
                            <h3 className="text-xl font-black text-slate-800 flex items-center gap-2"><Icons.Calendar /> 會勘行事曆</h3>
                            <div className="flex bg-slate-100 p-1 rounded-xl">
                                {['MONTH', 'WEEK', 'DAY'].map(mode => (
                                    <button key={mode} onClick={() => setViewMode(mode)} className={`px-4 py-1.5 text-xs font-bold rounded-lg transition-all ${viewMode === mode ? 'bg-white text-primary shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>
                                        {mode === 'MONTH' ? '月' : mode === 'WEEK' ? '周' : '日'}
                                    </button>
                                ))}
                            </div>
                        </div>
                        <div className="flex items-center gap-3 bg-slate-50 px-2 py-1 rounded-xl border border-slate-200">
                            <button onClick={handlePrev} className="p-2 hover:bg-white rounded-lg text-slate-500 transition-colors"><Icons.ChevronLeft /></button>
                            <span className="font-bold text-slate-700 min-w-[120px] text-center">{getDisplayTitle()}</span>
                            <button onClick={handleNext} className="p-2 hover:bg-white rounded-lg text-slate-500 transition-colors"><Icons.ChevronRight /></button>
                            <button onClick={() => setCurrentDate(new Date())} className="px-3 py-1.5 text-xs font-bold text-primary hover:bg-indigo-50 rounded-lg ml-2">今天</button>
                        </div>
                    </div>
                    {viewMode === 'MONTH' ? renderMonth() : renderTimeline()}
                </div>
            );
        };

        const CaseList = ({ cases, onSelectCase, activeTab, onTabChange, config, isSpecialMode }) => {
            const [filter, setFilter] = useState('');
            const [subTab, setSubTab] = useState('ALL');

            const modeFilteredCases = cases.filter(c => isSpecialMode ? c.caseType === 'SPECIAL' : c.caseType !== 'SPECIAL');
            
            const counts = {
                PROCESSING: modeFilteredCases.filter(c => c.status !== 'CLOSED' && c.status !== 'MERGED').length,
                CLOSED: modeFilteredCases.filter(c => c.status === 'CLOSED' || c.status === 'MERGED').length,
                CALENDAR: modeFilteredCases.filter(c => c.status !== 'MERGED' && ['SURVEY', 'A1', 'SELF', 'OTHER_UNIT'].includes(c.category) && c.extData?.surveyDate).length
            };

            useEffect(() => {
                if (activeTab !== 'PROCESSING') setSubTab('ALL');
            }, [activeTab]);

            let tabFilteredCases = modeFilteredCases.filter(c => {
                if (activeTab === 'PROCESSING') return c.status !== 'CLOSED' && c.status !== 'MERGED';
                if (activeTab === 'CLOSED') return c.status === 'CLOSED' || c.status === 'MERGED';
                return true;
            });

            if (activeTab === 'PROCESSING') {
                if (subTab === 'WARNING') {
                    tabFilteredCases = tabFilteredCases.filter(c => getDeadlineStatus(c) === 'WARNING');
                } else if (subTab === 'OVERDUE') {
                    tabFilteredCases = tabFilteredCases.filter(c => getDeadlineStatus(c) === 'OVERDUE');
                }
            }
            
            const processingCases = modeFilteredCases.filter(c => c.status !== 'CLOSED' && c.status !== 'MERGED');
            const subCounts = {
                ALL: processingCases.length,
                WARNING: processingCases.filter(c => getDeadlineStatus(c) === 'WARNING').length,
                OVERDUE: processingCases.filter(c => getDeadlineStatus(c) === 'OVERDUE').length
            };

            const filteredCases = tabFilteredCases.filter(c => {
                const keyword = filter.toLowerCase();
                return (c.caseNumber && c.caseNumber.toLowerCase().includes(keyword)) ||
                       (c.location?.address?.toLowerCase().includes(keyword)) ||
                       (c.location?.district?.toLowerCase().includes(keyword)) ||
                       (c.petitioner?.name?.toLowerCase().includes(keyword)) ||
                       (c.extData?.assignee?.toLowerCase().includes(keyword)) ||
                       (c.content?.toLowerCase().includes(keyword)) ||
                       (c.extData?.note?.toLowerCase().includes(keyword)) ||
                       (c.extData?.surveyDocNo?.toLowerCase().includes(keyword)) ||
                       (c.extData?.replyDocNo?.toLowerCase().includes(keyword)) ||
                       (c.extData?.recordDocNo?.toLowerCase().includes(keyword));
            });

            const activeColor = isSpecialMode ? 'bg-red-500 text-white shadow-md' : 'bg-primary text-white shadow-md';

            return (
                <div className="h-full flex flex-col animate-fade-in">
                    {/* 頂部切換按鈕區塊 (永遠顯示) */}
                    <div className="flex flex-wrap p-1.5 bg-white shadow-soft rounded-2xl w-fit mb-4 mx-auto md:mx-0">
                        {config.tabs.map(tab => {
                            const isActive = activeTab === tab.id;
                            return (
                                <button key={tab.id} className={`flex items-center gap-2 px-6 py-2.5 rounded-xl text-sm font-bold transition-all duration-300 ${isActive ? activeColor : 'text-slate-500 hover:text-slate-800 hover:bg-slate-50'}`} onClick={() => onTabChange(tab.id)}>
                                    <tab.icon /> {tab.label} <span className={`ml-1 px-2 py-0.5 rounded-full text-xs font-black ${isActive ? 'bg-white/20 text-white' : 'bg-slate-200 text-slate-600'}`}>{counts[tab.id] || 0}</span>
                                </button>
                            );
                        })}
                    </div>

                    {/* 依據當前 activeTab 決定下方顯示「行事曆」或「清單」 */}
                    {activeTab === 'CALENDAR' ? (
                        <div className="flex-1 min-h-0 relative animate-fade-in">
                            <CalendarView cases={cases} onSelectCase={onSelectCase} />
                        </div>
                    ) : (
                        <>
                            {activeTab === 'PROCESSING' && (
                                <div className="flex flex-wrap gap-2 mb-6 mx-auto md:mx-0 animate-fade-in">
                                    <button onClick={() => setSubTab('ALL')} className={`px-4 py-1.5 rounded-full text-xs font-bold transition-colors ${subTab === 'ALL' ? 'bg-slate-800 text-white' : 'bg-white text-slate-500 border border-slate-200 hover:bg-slate-50'}`}>
                                        全部辦理中 ({subCounts.ALL})
                                    </button>
                                    <button onClick={() => setSubTab('WARNING')} className={`px-4 py-1.5 rounded-full text-xs font-bold transition-colors ${subTab === 'WARNING' ? 'bg-amber-500 text-white' : 'bg-amber-50 text-amber-600 border border-amber-200 hover:bg-amber-100'}`}>
                                        即將逾期 ({subCounts.WARNING})
                                    </button>
                                    <button onClick={() => setSubTab('OVERDUE')} className={`px-4 py-1.5 rounded-full text-xs font-bold transition-colors ${subTab === 'OVERDUE' ? 'bg-rose-500 text-white' : 'bg-rose-50 text-rose-600 border border-rose-200 hover:bg-rose-100'}`}>
                                        已逾期 ({subCounts.OVERDUE})
                                    </button>
                                </div>
                            )}

                            <div className="relative mb-6">
                                <div className="absolute inset-y-0 left-4 flex items-center pointer-events-none text-slate-400"><Icons.Search /></div>
                                <input type="text" placeholder={`輸入關鍵字 (如：${isSpecialMode ? '交辦內容、承辦人、備註' : '地點、陳情人、文號、內容、備註'})...`}
                                    className={`w-full pl-12 pr-4 py-4 bg-white shadow-soft rounded-2xl text-slate-700 placeholder-slate-400 focus:ring-4 border-none transition-all ${isSpecialMode ? 'focus:ring-red-500/20' : 'focus:ring-indigo-500/20'}`}
                                    value={filter} onChange={(e) => setFilter(e.target.value)} />
                            </div>
                            
                            <div className="hidden md:block flex-1 overflow-y-auto bg-white rounded-3xl shadow-soft">
                                <table className="w-full text-sm text-left">
                                    <thead className="text-xs text-slate-400 uppercase tracking-wider sticky top-0 bg-white/90 backdrop-blur-md z-10 border-b border-slate-100">
                                        <tr>
                                            <th className="px-4 py-5 font-bold whitespace-nowrap">狀態 / 類別</th>
                                            <th className="px-4 py-5 font-bold whitespace-nowrap">預警狀態</th>
                                            <th className="px-4 py-5 font-bold whitespace-nowrap">{isSpecialMode ? '收件日期' : '收文/會勘時間'}</th>
                                            <th className="px-4 py-5 font-bold">{isSpecialMode ? '負責承辦人' : '地點資訊'}</th>
                                            <th className="px-4 py-5 font-bold whitespace-nowrap">{isSpecialMode ? '交辦時間' : '陳情人/主政單位'}</th>
                                            {!isSpecialMode && <th className="px-4 py-5 font-bold whitespace-nowrap">承辦人</th>}
                                            <th className="px-4 py-5 font-bold w-1/4">{isSpecialMode ? '交辦內容' : '陳情內容'}</th>
                                            <th className="px-4 py-5 font-bold whitespace-nowrap">派工日期</th>
                                            <th className="px-4 py-5 font-bold whitespace-nowrap">結案日期<br/><span className="text-[10px] text-slate-400 font-normal">(結案期限)</span></th>
                                            <th className="px-4 py-5 font-bold text-center whitespace-nowrap">操作</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {filteredCases.map((c) => (
                                            <tr key={c.id} className={`${getRowStatusClass(c)} group`}>
                                                <td className="px-4 py-4"><div className="flex flex-col gap-2 items-start"><StatusBadge status={c.status} /><CategoryBadge category={c.category} customName={c.extData?.customCategory} />{c.mergedInto && <span className="text-[10px] bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full flex items-center gap-1"><Icons.Link/> 已併案</span>}</div></td>
                                                <td className="px-4 py-4 whitespace-nowrap"><WarningBadge caseData={c} /></td>
                                                <td className="px-4 py-4 whitespace-nowrap text-slate-600 font-medium">
                                                    {isSpecialMode ? (c.extData?.receiveDate || '-') : formatDateTime(c.extData?.surveyDate || c.extData?.replyDate || c.extData?.receiveDate)}
                                                </td>
                                                {isSpecialMode ? (
                                                    <>
                                                        <td className="px-4 py-4 font-bold text-slate-700 whitespace-nowrap">{c.extData?.assignee || '未指派'}</td>
                                                        <td className="px-4 py-4 text-slate-500 whitespace-nowrap">{c.extData?.assignDate || '-'}</td>
                                                    </>
                                                ) : (
                                                    <>
                                                        <td className="px-4 py-4">
                                                            <div className="font-bold text-slate-700">{c.location?.district || '-'}</div>
                                                            <div className="text-slate-500 text-xs mt-1 truncate max-w-[140px]" title={c.location?.address}>{c.location?.address || '-'}</div>
                                                        </td>
                                                        <td className="px-4 py-4 font-medium text-slate-600 whitespace-nowrap">
                                                            {c.category === 'SELF' ? <span className="text-slate-400 italic">無</span> : c.petitioner?.name || '-'}
                                                        </td>
                                                        <td className="px-4 py-4 font-bold text-slate-700 whitespace-nowrap">{c.extData?.assignee || '未指派'}</td>
                                                    </>
                                                )}
                                                <td className="px-4 py-4"><div className="text-slate-600 line-clamp-2 leading-relaxed">{c.content}</div></td>
                                                <td className="px-4 py-4 whitespace-nowrap text-slate-600">{c.extData?.dispatchDate || '-'}</td>
                                                <td className="px-4 py-4 whitespace-nowrap">
                                                    <div className="text-slate-800 font-bold">{c.extData?.completionDate || '-'}</div>
                                                    {c.status !== 'CLOSED' && c.status !== 'MERGED' && (
                                                        <div className={`text-xs mt-1 ${getDeadlineColor(c)}`}>({c.extData?.completionDeadline || '無期限'})</div>
                                                    )}
                                                </td>
                                                <td className="px-4 py-4 text-center">
                                                    <button onClick={() => onSelectCase(c)} className={`font-bold px-4 py-2 rounded-xl transition-all whitespace-nowrap shadow-sm border ${isSpecialMode ? 'text-red-700 bg-white border-red-200 hover:bg-red-50' : 'text-indigo-700 bg-white border-indigo-200 hover:bg-indigo-50'}`}>查看詳情</button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                                {filteredCases.length === 0 && (
                                    <div className="flex flex-col items-center justify-center py-20 text-slate-400"><Icons.Archive /><p className="mt-4 font-medium tracking-wide">目前沒有符合條件的案件</p></div>
                                )}
                            </div>

                            <div className="md:hidden flex-1 overflow-y-auto space-y-4 pb-20">
                                {filteredCases.map(c => (
                                    <div key={c.id} className={`${getRowStatusClass(c)} bg-white p-5 rounded-3xl shadow-soft cursor-pointer active:scale-95 transition-transform border-l-4 ${isSpecialMode ? 'border-red-400' : 'border-indigo-400'}`} onClick={() => onSelectCase(c)}>
                                        <div className="flex justify-between items-start mb-4">
                                            <div className="flex flex-col gap-2"><StatusBadge status={c.status} /><CategoryBadge category={c.category} customName={c.extData?.customCategory} />{c.mergedInto && <span className="text-[10px] bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full flex items-center gap-1 w-fit"><Icons.Link/> 已併案</span>}</div>
                                            <div className="flex flex-col items-end gap-2"><WarningBadge caseData={c} />{!isSpecialMode && c.location?.district && <span className="bg-indigo-50 text-indigo-600 px-3 py-1 rounded-lg text-xs font-bold whitespace-nowrap ml-2">{c.location.district}</span>}</div>
                                        </div>
                                        <div className="flex flex-wrap gap-2 text-xs font-bold text-slate-500 mb-3">
                                            <span className="bg-slate-100 px-2 py-1 rounded-md">{isSpecialMode ? '收件' : '收文/會勘'}: {isSpecialMode ? (c.extData?.receiveDate || '-') : formatDateTime(c.extData?.surveyDate || c.extData?.replyDate || c.extData?.receiveDate)}</span>
                                            <span className="bg-slate-100 px-2 py-1 rounded-md">派工: {c.extData?.dispatchDate || '-'}</span>
                                            <span className={`px-2 py-1 rounded-md bg-slate-100`}>結案: {c.extData?.completionDate || <span className={getDeadlineColor(c)}>{c.extData?.completionDeadline || '-'}</span>}</span>
                                        </div>
                                        {isSpecialMode ? (
                                            <><div className="font-bold text-slate-800 mb-1 leading-snug">承辦人：{c.extData?.assignee || '未指派'}</div><div className="text-sm text-slate-400 mb-3">交辦日期：{c.extData?.assignDate || '-'}</div></>
                                        ) : (
                                            <><div className="font-bold text-slate-800 mb-1 leading-snug">{c.location?.address}</div><div className="flex flex-wrap gap-x-4 gap-y-1 text-sm text-slate-400 mb-3">{c.category !== 'SELF' && <span>{c.category === 'OTHER_UNIT' ? '主政單位' : '陳情人'}：{c.petitioner?.name || '-'}</span>}<span>承辦人：<span className="font-bold text-slate-600">{c.extData?.assignee || '未指派'}</span></span></div></>
                                        )}
                                        <div className="text-sm text-slate-600 line-clamp-2 bg-slate-50/80 p-3 rounded-2xl leading-relaxed">{c.content}</div>
                                    </div>
                                ))}
                                {filteredCases.length === 0 && <div className="text-center py-16 text-slate-400 font-medium">目前沒有符合條件的案件</div>}
                            </div>
                        </>
                    )}
                </div>
            );
        };

        const CaseForm = ({ onSubmit, onCancel, isSpecialMode }) => {
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [formData, setFormData] = useState({
                caseType: isSpecialMode ? 'SPECIAL' : 'NORMAL',
                category: isSpecialMode ? 'DIRECTOR' : 'SURVEY', 
                name: '', district: '桃園區', address: '', content: '',
                extData: { 
                    receiveDate: '', surveyDate: '', surveyDocNo: '', assignee: '', recordDeadline: '', recordActualDate: '', recordDocNo: '', surveyResolution: '', dispatchDate: '', completionDate: '', completionDeadline: '', noDispatchRequired: false,
                    assignDate: '', handlingStatus: '', replyDate: '', replyDocNo: '', replyContent: '', note: '', forwardUnit: '', customCategory: ''
                }
            });

            const [coords, setCoords] = useState(DISTRICT_COORDS['桃園區']);
            const [isLocating, setIsLocating] = useState(false);
            const [userDragged, setUserDragged] = useState(false);

            useEffect(() => {
                if (isSpecialMode || !formData.address) return;
                if (userDragged) return;
                
                const timer = setTimeout(async () => {
                    setIsLocating(true);
                    const newCoords = await advancedGeocode(formData.district, formData.address);
                    if (newCoords) setCoords(newCoords);
                    else if (!userDragged) setCoords(DISTRICT_COORDS[formData.district] || DISTRICT_COORDS['桃園區']);
                    setIsLocating(false);
                }, 800);
                return () => clearTimeout(timer);
            }, [formData.address, formData.district, isSpecialMode, userDragged]);

            const handleExtData = (f, v) => setFormData(p => ({ ...p, extData: { ...p.extData, [f]: v } }));
            
            const handleSubmit = async (e) => {
                e.preventDefault(); setIsSubmitting(true);
                try { 
                    let submitData = { ...formData };
                    if (!isSpecialMode && formData.category === 'FORWARD') {
                         submitData.status = 'CLOSED';
                         submitData.extData.completionDate = getLocalISODate();
                    }
                    if (!isSpecialMode) {
                        submitData.location = { 
                            district: submitData.district, address: submitData.address, lat: coords.lat, lng: coords.lng,
                            isFallback: !userDragged && coords.lat === DISTRICT_COORDS[submitData.district]?.lat 
                        };
                    }
                    await onSubmit(submitData); 
                } catch (err) { console.warn(err); } finally { setIsSubmitting(false); }
            };

            const themeColor = isSpecialMode ? 'text-red-500' : 'text-primary';
            const themeBg = isSpecialMode ? 'bg-red-50' : 'bg-indigo-50';
            const themeBtn = isSpecialMode ? 'bg-red-500 hover:bg-red-600' : 'bg-primary hover:bg-indigo-600';
            const themeRing = isSpecialMode ? 'focus:ring-red-500/20' : 'focus:ring-indigo-500/20';

            return (
                <div className="h-full flex justify-center animate-fade-in overflow-y-auto pb-20 md:pb-0">
                    <div className="w-full max-w-4xl bg-white p-6 md:p-10 rounded-3xl shadow-soft h-fit border border-slate-100">
