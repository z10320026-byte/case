    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap');
        :root {
            --theme-primary: #6366f1;
            --theme-primary-soft: rgba(99, 102, 241, 0.1);
            --theme-primary-border: rgba(99, 102, 241, 0.28);
            --theme-surface: #f8fafc;
            --theme-sidebar: #ffffff;
            --theme-card: #ffffff;
            --theme-text: #334155;

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--theme-surface);
            color: var(--theme-text);
            transition: background-color 0.25s ease, color 0.25s ease;

        .theme-app { background-color: var(--theme-surface) !important; color: var(--theme-text); }
        .theme-sidebar { background-color: var(--theme-sidebar) !important; }
        .theme-app .bg-white { background-color: var(--theme-card) !important; }

        .theme-app .text-indigo-600, .theme-app .text-indigo-700 { color: var(--theme-primary) !important; }
        .theme-app .border-indigo-100, .theme-app .border-indigo-200 { border-color: var(--theme-primary-border) !important; }

        body.theme-dark .theme-app .border-slate-100,
        body.theme-dark .theme-app .border-slate-200,
        body.theme-dark .theme-app .border-slate-300 { border-color: rgba(255, 255, 255, 0.1) !important; }
        body.theme-dark .theme-app .bg-slate-50,
        body.theme-dark .theme-app .bg-slate-50\/70,
        body.theme-dark .theme-app .bg-slate-100 { background-color: rgba(255, 255, 255, 0.06) !important; }
        body.theme-dark .theme-app .text-slate-600,
        body.theme-dark .theme-app .text-slate-500,
        body.theme-dark .theme-app .text-slate-400 { color: #94a3b8 !important; }
        body.theme-dark .theme-app .divide-slate-100 > :not([hidden]) ~ :not([hidden]) { border-color: rgba(255, 255, 255, 0.08) !important; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }

        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        input[type="text"], input[type="email"], input[type="date"], input[type="datetime-local"], select, textarea {
            transition: all 0.2s ease-in-out; border: 1px solid transparent; background-color: var(--theme-input); color: var(--theme-text);

        input:focus, select:focus, textarea:focus {
            background-color: var(--theme-card); border-color: var(--theme-primary-border); box-shadow: 0 0 0 3px var(--theme-primary-soft); outline: none;
        }
        input:disabled, textarea:disabled { opacity: 0.7; cursor: not-allowed; }

        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .urgent-row { animation: pulse-red 2s infinite; }
        @keyframes pulse-red {
            0% { background-color: rgba(254, 226, 226, 0.4); }
            50% { background-color: rgba(254, 226, 226, 0.8); }

        .leaflet-tooltip {

<body>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, Fragment } = React;

        // ============================================================================
        // 【公版預設雲端設定區】
        // 說明：可在此處填入團隊共用的 Firebase 設定，或留空讓使用者於網頁右上角「雲端設定」自行填入。
        // ============================================================================
        const DEFAULT_FIREBASE_CONFIG = {
            apiKey: "AIzaSyCve66gk38Nx0IpiB6UXZx1alX1be4MZVY",
            authDomain: "zoe-case.firebaseapp.com",

        };

        // 10 種預設面板風格
        const THEME_PRESETS = [
            { id: 'indigo', name: '1. 經典靛藍', primary: '#6366f1', surface: '#f8fafc', sidebar: '#ffffff', card: '#ffffff', text: '#334155', input: '#f1f5f9', isDark: false },

            { id: 'ocean', name: '3. 海洋微風', primary: '#0284c7', surface: '#f0f9ff', sidebar: '#ffffff', card: '#ffffff', text: '#0f172a', input: '#e0f2fe', isDark: false },
            { id: 'sakura', name: '4. 櫻花粉韻', primary: '#ec4899', surface: '#fdf2f8', sidebar: '#ffffff', card: '#ffffff', text: '#334155', input: '#fce7f3', isDark: false },
            { id: 'amber', name: '5. 琥珀暖陽', primary: '#d97706', surface: '#fffbeb', sidebar: '#ffffff', card: '#ffffff', text: '#292524', input: '#fef3c7', isDark: false },
            { id: 'purple', name: '6. 皇家紫羅蘭', primary: '#8b5cf6', surface: '#f5f3ff', sidebar: '#ffffff', card: '#ffffff', text: '#1e1b4b', input: '#ede9fe', isDark: false },
            { id: 'slate', name: '7. 極簡商務灰', primary: '#475569', surface: '#f1f5f9', sidebar: '#f8fafc', card: '#ffffff', text: '#0f172a', input: '#e2e8f0', isDark: false },
            { id: 'teal', name: '8. 薄荷青瓷', primary: '#0d9488', surface: '#f0fdfa', sidebar: '#ffffff', card: '#ffffff', text: '#134e4a', input: '#ccfbf1', isDark: false },
            { id: 'crimson', name: '9. 勃根地酒紅', primary: '#be123c', surface: '#fff1f2', sidebar: '#ffffff', card: '#ffffff', text: '#31102f', input: '#ffe4e6', isDark: false },
            { id: 'dark', name: '10. 深邃暗夜', primary: '#818cf8', surface: '#0f172a', sidebar: '#1e293b', card: '#1e293b', text: '#f1f5f9', input: '#334155', isDark: true }
        ];

        const hexToRgba = (hex, alpha = 0.12) => {
            if (!hex || typeof hex !== 'string' || !hex.startsWith('#')) return `rgba(99, 102, 241, ${alpha})`;
            let c = hex.substring(1);
            if (c.length === 3) c = c.split('').map(ch => ch + ch).join('');
            const num = parseInt(c, 16);
            if (isNaN(num)) return `rgba(99, 102, 241, ${alpha})`;
            return `rgba(${(num >> 16) & 255}, ${(num >> 8) & 255}, ${num & 255}, ${alpha})`;
        };

        const TAOYUAN_DISTRICTS = ['桃園區', '中壢區', '平鎮區', '八德區', '楊梅區', '蘆竹區', '大溪區', '龜山區', '大園區', '觀音區', '新屋區', '龍潭區', '復興區'];
        const DISTRICT_COORDS = {
            '桃園區': { lat: 24.9936, lng: 121.3009 }, '中壢區': { lat: 24.9631, lng: 121.2238 }, '平鎮區': { lat: 24.9458, lng: 121.2183 },
            '八德區': { lat: 24.9295, lng: 121.2826 }, '楊梅區': { lat: 24.9150, lng: 121.1462 }, '蘆竹區': { lat: 25.0454, lng: 121.2882 },
            '大溪區': { lat: 24.8805, lng: 121.2868 }, '龜山區': { lat: 24.9958, lng: 121.3389 }, '大園區': { lat: 25.0645, lng: 121.1973 },
            '觀音區': { lat: 25.0333, lng: 121.0789 }, '新屋區': { lat: 24.9722, lng: 121.1061 }, '龍潭區': { lat: 24.8638, lng: 121.2125 },
            '復興區': { lat: 24.8150, lng: 121.3475 }
        };

        const getLocalISODate = (date = new Date()) => {
            if (!date || isNaN(new Date(date).getTime())) return '';
            const d = new Date(date);
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        };
        
        const getDatetimeLocal = (dateStr) => {
            if(!dateStr) return '';
            return dateStr.substring(0, 16);
        };
        
        const formatDateTime = (dateStr) => {
            if(!dateStr) return '-';
            const d = new Date(dateStr);
            if(isNaN(d.getTime())) return dateStr;
            const isTimeIncluded = dateStr.includes('T') || dateStr.includes(' ');
            if (isTimeIncluded) {
                return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
            }
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        };

        const calculateWorkingDays = (dateStr, addDays = 3) => {
            if (!dateStr) return '';
            const d = new Date(dateStr.substring(0, 10));
            if (isNaN(d.getTime())) return '';
            let daysAdded = 0;
            while (daysAdded < addDays) {
                d.setDate(d.getDate() + 1);
                if (d.getDay() !== 0 && d.getDay() !== 6) daysAdded++;
            }
            return getLocalISODate(d);
        };

        const calculateMonthsDeadline = (dateStr, addMonths = 2) => {
            if (!dateStr) return '';
            const d = new Date(dateStr.substring(0, 10));
            if (isNaN(d.getTime())) return '';
            d.setMonth(d.getMonth() + addMonths);
            return getLocalISODate(d);
        };

        const sortCases = (casesList) => {
            if (!Array.isArray(casesList)) return [];
            return [...casesList].sort((a, b) => {
                const getSortDate = (c) => c.caseType === 'SPECIAL' ? (c.extData?.assignDate || c.extData?.receiveDate || c.createdAt) : (c.extData?.surveyDate || c.extData?.replyDate || c.extData?.receiveDate || c.createdAt);
                return new Date(getSortDate(b) || 0) - new Date(getSortDate(a) || 0);
            });
        };

        const getDeadlineStatus = (c) => {
            if (c.status === 'CLOSED' || c.status === 'MERGED') return 'SAFE';
            if (!c.extData?.completionDeadline) return 'SAFE';
            const today = new Date(); today.setHours(0,0,0,0);
            const deadline = new Date(c.extData.completionDeadline); deadline.setHours(0,0,0,0);
            const diffDays = Math.ceil((deadline.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
            if (diffDays < 0) return 'OVERDUE';
            if (diffDays <= 15) return 'WARNING';
            return 'SAFE';
        };

        const advancedGeocode = async (district, address) => {
            if (!address) return null;
            const tryFetch = async (query) => {
                const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`;
                try {
                    const response = await fetch(url, { headers: { 'Accept-Language': 'zh-TW' } });
                    const data = await response.json();
                    if (data && data.length > 0) return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
                } catch (error) { console.error("Geocoding Error:", error); }
                return null;
            };

            let res = await tryFetch(`桃園市${district}${address}`);
            if (res) return res;

            let cleanAddr = address.replace(/^本市/, '').replace(new RegExp(`^${district}`), '').replace(/與.*[路街]口/g, '').replace(/[前後旁]|附近|交叉口/g, '').trim();
            if (cleanAddr !== address && cleanAddr.length > 0) {
                res = await tryFetch(`桃園市${district}${cleanAddr}`);
                if (res) return res;
            }

            const roadMatch = cleanAddr.match(/^.*?[路街大道巷]/);
            if (roadMatch && roadMatch[0] !== cleanAddr) {
                res = await tryFetch(`桃園市${district}${roadMatch[0]}`);
                if (res) return res;
            }
            return null;
        };

        // ============================================================================
        // 【會勘通知單抄本 / OCR 文字智慧解析核心】
        // 針對「桃園市政府交通局會勘通知單」格式精準擷取：
        // a. 發文字號 -> 會勘通知文號 (surveyDocNo)
        // b. 會勘事由 -> 陳情內容 (content)
        // c. 會勘地點 -> 詳細地點 (address) + 自動識別行政區 (district)
        // d. 備註依據單位 -> 陳情人 (name)，無則空白
        // e. 聯絡人及電話 -> 僅取姓名作為承辦人 (assignee)
        // f. 會勘時間 -> 轉換民國日期與上下午時間為 YYYY-MM-DDTHH:mm (surveyDate)
        // ============================================================================
        const parseRocDateTimeString = (rawStr, includeTime = true) => {
            if (!rawStr) return '';
            const s = rawStr.replace(/\s+/g, '');
            const dateMatch = s.match(/(?:中華民國|民國)?(\d{2,4})年(\d{1,2})月(\d{1,2})日/);
            if (!dateMatch) {
                const isoMatch = rawStr.trim().match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})(?:\s*[T\s]\s*(\d{1,2}):(\d{1,2}))?/);
                if (isoMatch) {
                    const y = isoMatch[1];
                    const m = String(isoMatch[2]).padStart(2, '0');
                    const d = String(isoMatch[3]).padStart(2, '0');
                    if (includeTime && isoMatch[4] !== undefined) {
                        return `${y}-${m}-${d}T${String(isoMatch[4]).padStart(2, '0')}:${String(isoMatch[5] || '00').padStart(2, '0')}`;
                    }
                    return `${y}-${m}-${d}`;
                }
                return '';
            }
            let year = parseInt(dateMatch[1], 10);
            if (year < 1911) year += 1911;
            const month = String(parseInt(dateMatch[2], 10)).padStart(2, '0');
            const day = String(parseInt(dateMatch[3], 10)).padStart(2, '0');
            if (!includeTime) return `${year}-${month}-${day}`;

            const timeMatch = s.match(/(上午|早上|下午|晚上|中午)?(\d{1,2})[時點:](\d{1,2})?分?/);
            if (timeMatch) {
                const period = timeMatch[1] || '';
                let hh = parseInt(timeMatch[2], 10);
                const mm = timeMatch[3] ? parseInt(timeMatch[3], 10) : 0;
                if ((period === '下午' || period === '晚上') && hh < 12) hh += 12;
                if (period === '上午' && hh === 12) hh = 0;
                return `${year}-${month}-${day}T${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
            }
            return `${year}-${month}-${day}T09:00`;
        };

        const parseSurveyNoticeText = (rawText, sourceFileName = '會勘通知單') => {
            if (!rawText) return null;
            const text = rawText
                .replace(/\r\n/g, '\n')
                .replace(/[\u200B-\u200D\uFEFF]/g, '');

            // a. 發文字號 -> 會勘通知文號
            let surveyDocNo = '';
            const docNoMatch = text.match(/發\s*文\s*字\s*號\s*[:：]\s*([^\n]+)/);
            if (docNoMatch) {
                surveyDocNo = docNoMatch[1].replace(/\s+/g, '').trim();
            }

            // 發文日期 -> 收文日期
            let receiveDate = getLocalISODate();
            const issueDateMatch = text.match(/發\s*文\s*日\s*期\s*[:：]\s*([^\n]+)/);
            if (issueDateMatch) {
                const parsedIssue = parseRocDateTimeString(issueDateMatch[1], false);
                if (parsedIssue) receiveDate = parsedIssue;
            }

            // b. 會勘事由 -> 陳情內容
            let content = '';
            const subjectMatch = text.match(/會\s*勘\s*事\s*由\s*[:：]\s*([\s\S]*?)(?=\n\s*會\s*勘\s*時\s*間|\n\s*會\s*勘\s*地\s*點|$)/);
            if (subjectMatch) {
                content = subjectMatch[1].replace(/\s+/g, '').trim();
            }

            // f. 會勘時間 -> 會勘時間 (日期+時間)
            let surveyDate = '';
            const timeLineMatch = text.match(/會\s*勘\s*時\s*間\s*[:：]\s*([\s\S]*?)(?=\n\s*會\s*勘\s*地\s*點|\n\s*主\s*持\s*人|$)/);
            if (timeLineMatch) {
                surveyDate = parseRocDateTimeString(timeLineMatch[1], true);
            }

            // c. 會勘地點 -> 詳細地點 + 行政區
            let address = '';
            const locMatch = text.match(/會\s*勘\s*地\s*點\s*[:：]\s*([\s\S]*?)(?=\n\s*主\s*持\s*人|\n\s*聯\s*絡\s*人|$)/);
            if (locMatch) {
                address = locMatch[1].replace(/\s+/g, '').trim();
            }

            let district = '桃園區';
            const combinedForDistrict = `${address} ${content}`;
            for (const d of TAOYUAN_DISTRICTS) {
                if (combinedForDistrict.includes(d)) {
                    district = d;
                    break;
                }
            }

            // e. 聯絡人及電話 -> 僅辨識名字作為「承辦人」
            let assignee = '';
            const contactMatch = text.match(/聯\s*絡\s*人\s*(?:及\s*電\s*話)?\s*[:：]\s*([^\n]+)/);
            if (contactMatch) {
                let rawContact = contactMatch[1].trim();
                // 移除電話、分機與數字
                rawContact = rawContact.replace(/[\d\-\(\)#＃EXText分機轉\s:：/]+$/g, '').trim();
                rawContact = rawContact.split(/\s+/)[0] || '';
                // 移除常見職稱後綴
                rawContact = rawContact.replace(/(行政助理|專案助理|業務助理|約僱人員|約用人員|工程員|幫工程司|副工程司|正工程司|科員|技士|技佐|股長|科長|專員|視察|技正|主任|先生|小姐).*$/, '').trim();
                assignee = rawContact;
            }

            // d. 備註裡有依據單位 -> 陳情人 (沒有或無法辨識則空白)
            let petitionerName = '';
            const remarkSectionMatch = text.match(/備\s*註\s*[:：]([\s\S]*)$/);
            const searchScope = remarkSectionMatch ? remarkSectionMatch[1] : text;
            const basisMatch = searchScope.match(/依\s*據\s*([\s\S]*?)(?=(?:中華民國)?\s*\d{2,4}\s*年\s*\d{1,2}\s*月|[0-9]{2,4}年|辦理|函|$)/);
            if (basisMatch && basisMatch[1]) {
                let unit = basisMatch[1]
                    .replace(/[\n\r\s]+/g, '')
                    .replace(/^[一二三四五六七八九十]+、/, '')
                    .replace(/^本市/, '')
                    .replace(/^桃園市/, '')
                    .trim();
                if (unit && unit.length <= 35) {
                    petitionerName = unit;
                }
            }

            const recordDeadline = surveyDate ? calculateWorkingDays(surveyDate, 3) : '';
            const completionDeadline = surveyDate ? calculateMonthsDeadline(surveyDate, 2) : calculateMonthsDeadline(receiveDate, 2);

            return {
                _sourceFile: sourceFileName,
                caseType: 'NORMAL',
                category: 'SURVEY',
                status: 'PENDING',
                name: petitionerName,
                district,
                address: address || content,

                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                                    {customFields.map(field => (
                                        <div key={field.key} className="flex items-center justify-between p-3 rounded-2xl bg-slate-50 border border-slate-200">
                                            <div>
                                                <div className="text-xs font-bold text-slate-700">{field.label}</div>
                                                <div className="text-[11px] font-mono text-slate-400 uppercase">{themeConfig[field.key]}</div>
                                            </div>
                                            <input
                                                type="color"
                                                value={themeConfig[field.key] || '#ffffff'}
                                                onChange={e => onUpdateTheme({ ...themeConfig, id: 'custom', [field.key]: e.target.value })}
                                                className="w-9 h-9 rounded-xl cursor-pointer border-0 bg-transparent"
                                            />
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="flex justify-end gap-3 pt-4 border-t border-slate-100">
                                <button type="button" onClick={onResetTheme} className="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl font-bold text-sm transition-colors">恢復預設靛藍</button>
                                <button type="button" onClick={onClose} className="px-6 py-2.5 bg-primary text-white rounded-xl font-bold text-sm shadow-md hover:opacity-95 transition-all">完成設定</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // 智慧匯入中心 Modal (支援 PDF會勘通知單、螢幕截圖OCR、Excel、CSV)
        const SmartImportModal = ({ isOpen, onClose, onConfirmImport }) => {
            const [parsedItems, setParsedItems] = useState([]);
            const [isProcessing, setIsProcessing] = useState(false);
            const [statusText, setStatusText] = useState('');
            const [rawTextInput, setRawTextInput] = useState('');
            const [showRawTextBox, setShowRawTextBox] = useState(false);
            const fileInputRef = useRef(null);

            useEffect(() => {
                if (!isOpen) return;
                const handlePaste = async (e) => {
                    const items = e.clipboardData?.items;
                    if (!items) return;
                    for (const item of items) {
                        if (item.type.startsWith('image/')) {
                            const blob = item.getAsFile();
                            if (blob) await processFiles([new File([blob], `剪貼簿截圖_${Date.now()}.png`, { type: blob.type })]);
                        }
                    }
                };
                window.addEventListener('paste', handlePaste);
                return () => window.removeEventListener('paste', handlePaste);
            }, [isOpen]);

            if (!isOpen) return null;

            const extractTextFromPdf = async (file) => {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                let fullText = '';
                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const content = await page.getTextContent();
                    // 依 Y 座標分行重組文字，確保公文欄位順序正確
                    const linesMap = new Map();
                    content.items.forEach(item => {
                        const y = Math.round(item.transform[5] / 6) * 6;
                        if (!linesMap.has(y)) linesMap.set(y, []);
                        linesMap.get(y).push({ x: item.transform[4], str: item.str });
                    });
                    const sortedY = Array.from(linesMap.keys()).sort((a, b) => b - a);
                    const pageLines = sortedY.map(y => {
                        const row = linesMap.get(y).sort((a, b) => a.x - b.x);
                        return row.map(r => r.str).join(' ');
                    });
                    fullText += pageLines.join('\n') + '\n';
                }
                return fullText;
            };

            const extractTextFromImage = async (file) => {
                if (!window.Tesseract) throw new Error('OCR 引擎尚未載入完成');
                const result = await window.Tesseract.recognize(file, 'chi_tra+eng', {
                    logger: m => {
                        if (m.status === 'recognizing text') {
                            setStatusText(`正在辨識截圖文字 (${Math.round((m.progress || 0) * 100)}%)...`);
                        }
                    }
                });
                return result?.data?.text || '';
            };

            const parseSpreadsheetFile = async (file) => {
                const data = await file.arrayBuffer();
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(firstSheet, { defval: '' });
                const results = [];

                const categoryRevMap = {
                    '會勘': 'SURVEY', '回復': 'REPLY', 'A1事故': 'A1', 'A1': 'A1',
                    '函轉': 'FORWARD', '自辦': 'SELF', '其他單位辦理': 'OTHER_UNIT',
                    '局長案': 'DIRECTOR', '臨時交辦': 'TEMP', '其他(特殊)': 'OTHER_SPECIAL'
                };

                rows.forEach((row, idx) => {
                    const getVal = (keys) => {
                        for (const k of keys) {
                            if (row[k] !== undefined && String(row[k]).trim() !== '') return String(row[k]).trim();
                        }
                        return '';
                    };

                    const docNo = getVal(['發文字號(會勘通知文號)', '會勘通知文號', '發文字號', '通知文號', '文號']);
                    const content = getVal(['會勘事由(陳情內容)', '會勘事由', '陳情內容', '案件內容', '交辦內容', '事由']);
                    const address = getVal(['會勘地點(詳細地點)', '會勘地點', '詳細地點', '地點', '地址', '路口']);
                    const petitioner = getVal(['陳情人(依據單位)', '陳情人', '陳情人/主政單位', '依據單位', '主政單位']);
                    const rawAssignee = getVal(['承辦人(聯絡人)', '承辦人', '聯絡人', '聯絡人及電話', '負責承辦人']);
                    const assignee = rawAssignee.replace(/[\d\-\(\)#＃EXText分機轉\s:：/]+$/g, '').replace(/(行政助理|專案助理|業務助理|工程員|科員|技士|技佐|股長).*$/, '').trim();
                    const rawSurveyDate = getVal(['會勘時間', '會勘日期']);
                    const surveyDate = parseRocDateTimeString(rawSurveyDate, true) || rawSurveyDate.replace(' ', 'T').substring(0, 16);
                    const rawReceiveDate = getVal(['收文/收件日期', '收文日期', '收件日期', '發文日期']);
                    const receiveDate = parseRocDateTimeString(rawReceiveDate, false) || getLocalISODate();
                    const note = getVal(['備註', '備註事項']);

                    if (!content && !address && !docNo) return;

                    let district = getVal(['行政區', '區別']);
                    if (!district) {
                        const combined = `${address} ${content}`;
                        district = TAOYUAN_DISTRICTS.find(d => combined.includes(d)) || '桃園區';
                    }

                    const rawType = getVal(['案件類型']);
                    const caseType = rawType.includes('特殊') ? 'SPECIAL' : 'NORMAL';
                    const rawCat = getVal(['案件類別', '類別']);
                    const category = categoryRevMap[rawCat] || (caseType === 'SPECIAL' ? 'DIRECTOR' : 'SURVEY');

                    const recordDeadline = (surveyDate && category !== 'A1') ? calculateWorkingDays(surveyDate, 3) : '';
                    const completionDeadline = getVal(['結案期限']) || (surveyDate ? calculateMonthsDeadline(surveyDate, category === 'A1' ? 1 : 2) : calculateMonthsDeadline(receiveDate, category === 'A1' ? 1 : 2));

                    results.push({
                        _sourceFile: `${file.name} (第${idx + 1}列)`,
                        caseType,
                        category,
                        status: (getVal(['狀態']) === '已結案' || category === 'FORWARD') ? 'CLOSED' : 'PENDING',
                        name: category === 'A1' ? '' : petitioner,
                        district,
                        address: address || content,
                        content: category === 'A1' ? '' : (content || address),
                        extData: {
                            receiveDate,
                            surveyDocNo: docNo,
                            replyDocNo: category === 'REPLY' ? docNo : '',
                            surveyDate: ['REPLY', 'FORWARD'].includes(category) ? '' : surveyDate,
                            assignee,
                            hostUnit: getVal(['主政單位']) || (category === 'A1' ? petitioner : ''),
                            recordDeadline,
                            completionDeadline,
                            dispatchDate: getVal(['派工日期']),
                            completionDate: getVal(['實際結案日期', '結案日期']) || (category === 'FORWARD' ? getLocalISODate() : ''),
                            note
                        }
                    });
                });
                return results;
            };

            const processFiles = async (fileList) => {
                const files = Array.from(fileList || []);
                if (files.length === 0) return;
                setIsProcessing(true);
                const newItems = [];

                try {
                    for (const file of files) {
                        const lowerName = file.name.toLowerCase();
                        setStatusText(`正在解析：${file.name}...`);
                        if (lowerName.endsWith('.pdf') || file.type === 'application/pdf') {
                            const text = await extractTextFromPdf(file);
                            const parsed = parseSurveyNoticeText(text, file.name);
                            if (parsed) newItems.push(parsed);
                        } else if (lowerName.endsWith('.xlsx') || lowerName.endsWith('.xls') || lowerName.endsWith('.csv')) {
                            const rows = await parseSpreadsheetFile(file);
                            newItems.push(...rows);
                        } else if (file.type.startsWith('image/') || /\.(png|jpe?g|bmp|webp)$/i.test(lowerName)) {
                            const text = await extractTextFromImage(file);
                            const parsed = parseSurveyNoticeText(text, file.name);
                            if (parsed) newItems.push(parsed);
                        }
                    }
                    if (newItems.length > 0) {
                        setParsedItems(prev => [...prev, ...newItems]);
                    }
                } catch (err) {
                    console.error('檔案解析錯誤:', err);
                } finally {
                    setIsProcessing(false);
                    setStatusText('');
                    if (fileInputRef.current) fileInputRef.current.value = null;
                }
            };

            // 載入使用者提供的會勘通知單抄本範例進行即時測試
            const handleLoadSampleNotice = () => {
                const sampleText = `桃園市政府交通局會勘通知單
受文者:江股長宗彬等
發文日期:中華民國115年9月24日
發文字號:桃交工字第1150077774號
速別:普通件
會勘事由:本市龜山區民生北路一段395號交通改善一案
會勘時間:中華民國115年10月7日(星期三)下午3時30分
會勘地點:本市龜山區民生北路一段395號前
主持人:江股長宗彬
聯絡人及電話:劉瑞華行政助理 03-3322101#6870
備註:
一、依據本市市議員孫韻璇服務處115年9月15日桃議璇字第1150915003號函辦理。
二、為利公文時效,已先行電話(傳真)通知。`;
                const parsed = parseSurveyNoticeText(sampleText, '1D1150077774_34577301.pdf (會勘通知單抄本)');
                if (parsed) setParsedItems(prev => [parsed, ...prev]);
            };

            const handleParseRawText = () => {
                if (!rawTextInput.trim()) return;
                const parsed = parseSurveyNoticeText(rawTextInput, '文字貼上辨識');
                if (parsed) {
                    setParsedItems(prev => [parsed, ...prev]);
                    setRawTextInput('');
                    setShowRawTextBox(false);
                }
            };

            const updateItemField = (idx, field, value, isExt = false) => {
                setParsedItems(prev => prev.map((it, i) => {
                    if (i !== idx) return it;
                    if (isExt) {
                        const updatedExt = { ...it.extData, [field]: value };
                        if (field === 'surveyDate' && value) {
                            updatedExt.recordDeadline = calculateWorkingDays(value, 3);
                            updatedExt.completionDeadline = calculateMonthsDeadline(value, 2);
                        }
                        return { ...it, extData: updatedExt };
                    }
                    return { ...it, [field]: value };
                }));
            };

            const removeItem = (idx) => setParsedItems(prev => prev.filter((_, i) => i !== idx));

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/50 backdrop-blur-sm p-3 md:p-6 animate-fade-in">
                    <div className="bg-white rounded-3xl shadow-float max-w-5xl w-full max-h-[92vh] flex flex-col overflow-hidden border border-slate-100">
                        <div className="p-6 border-b border-slate-100 flex flex-wrap justify-between items-center gap-3">
                            <div>
                                <h3 className="text-xl font-black text-slate-800 flex items-center gap-2">
                                    <span className="p-2 rounded-xl bg-indigo-50 text-primary"><Icons.Sparkles /></span>
                                    智慧匯入中心 (支援 PDF會勘通知單 / 截圖OCR / Excel / CSV)
                                </h3>
                                <p className="text-xs text-slate-400 mt-1">
                                    上傳公文 PDF 或截圖將自動辨識：發文字號、會勘事由、會勘地點、備註依據單位(陳情人)、聯絡人姓名(承辦人)、會勘時間
                                </p>
                            </div>
                            <div className="flex items-center gap-2">
                                <button type="button" onClick={downloadStandardExcelTemplate} className="px-3.5 py-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-colors">
                                    <Icons.Download /> 下載 Excel 標準範本
                                </button>
                                <button type="button" onClick={handleLoadSampleNotice} className="px-3.5 py-2 bg-indigo-50 hover:bg-indigo-100 text-primary border border-indigo-200 rounded-xl text-xs font-bold transition-colors">
                                    載入範例公文測試
                                </button>
                                <button onClick={onClose} className="text-slate-400 hover:text-slate-600 p-1.5 font-bold">✕</button>
                            </div>
                        </div>

                        <div className="p-6 overflow-y-auto flex-1 space-y-6">
                            {/* 拖曳上傳與貼上區 */}
                            <div
                                onClick={() => !isProcessing && fileInputRef.current?.click()}
                                onDragOver={e => e.preventDefault()}
                                onDrop={e => { e.preventDefault(); if (!isProcessing) processFiles(e.dataTransfer.files); }}
                                className={`border-2 border-dashed rounded-3xl p-6 text-center cursor-pointer transition-all ${isProcessing ? 'border-indigo-300 bg-indigo-50/40' : 'border-slate-300 hover:border-primary hover:bg-slate-50/70'}`}
                            >
                                <input
                                    ref={fileInputRef}
                                    type="file"
                                    multiple
                                    accept=".pdf,.xlsx,.xls,.csv,image/*"
                                    className="hidden"
                                    onChange={e => processFiles(e.target.files)}
                                />
                                {isProcessing ? (
                                    <div className="py-4 space-y-2">
                                        <div className="w-8 h-8 border-4 border-primary border-t-transparent rounded-full animate-spin mx-auto"></div>
                                        <div className="text-sm font-bold text-primary">{statusText || '正在智慧解析檔案中...'}</div>
                                    </div>
                                ) : (
                                    <div className="space-y-2">
                                        <div className="w-12 h-12 rounded-2xl bg-indigo-50 text-primary flex items-center justify-center mx-auto">
                                            <Icons.Upload />
                                        </div>
                                        <div className="text-sm font-bold text-slate-700">
                                            點擊選擇檔案、拖曳檔案至此，或直接按 <kbd className="px-2 py-0.5 bg-slate-200 rounded text-xs">Ctrl + V</kbd> 貼上螢幕截圖
                                        </div>
                                        <div className="text-xs text-slate-400">
                                            支援格式：會勘通知單 PDF (.pdf)、圖片截圖 (.png/.jpg)、Excel (.xlsx/.xls)、CSV (.csv)
                                        </div>
                                    </div>
                                )}
                            </div>

                            {/* 手動貼上公文文字輔助區 */}
                            <div>
                                <button type="button" onClick={() => setShowRawTextBox(!showRawTextBox)} className="text-xs font-bold text-primary hover:underline flex items-center gap-1">
                                    <Icons.FileText /> {showRawTextBox ? '隱藏文字貼上區' : '或者直接貼上會勘通知單文字內容進行解析'}
                                </button>
                                {showRawTextBox && (
                                    <div className="mt-2 space-y-2 bg-slate-50 p-4 rounded-2xl border border-slate-200">
                                        <textarea
                                            rows="4"
                                            placeholder="請將公文或會勘通知單的文字複製貼上於此..."
                                            className="w-full rounded-xl p-3 text-xs bg-white border border-slate-200"
                                            value={rawTextInput}
                                            onChange={e => setRawTextInput(e.target.value)}
                                        />
                                        <div className="flex justify-end">
                                            <button type="button" onClick={handleParseRawText} className="px-4 py-2 bg-primary text-white rounded-xl text-xs font-bold">立即辨識文字</button>
                                        </div>
                                    </div>
                                )}
                            </div>

                            {/* 辨識結果預覽與微調表格 */}
                            {parsedItems.length > 0 && (
                                <div className="space-y-4">
                                    <div className="flex justify-between items-center">
                                        <h4 className="text-sm font-black text-slate-700">
                                            已辨識待匯入案件 ({parsedItems.length} 筆) — 可於下方直接確認或微調欄位：
                                        </h4>
                                        <button type="button" onClick={() => setParsedItems([])} className="text-xs font-bold text-rose-500 hover:underline">清空全部</button>
                                    </div>

                                    <div className="space-y-4">
                                        {parsedItems.map((item, idx) => (
                                            <div key={idx} className="p-5 rounded-2xl bg-slate-50 border border-slate-200 space-y-3 relative">
                                                <div className="flex justify-between items-center border-b border-slate-200 pb-2">
                                                    <span className="text-xs font-bold text-primary bg-indigo-50 px-2.5 py-1 rounded-lg">
                                                        來源：{item._sourceFile}
                                                    </span>
                                                    <button type="button" onClick={() => removeItem(idx)} className="text-xs font-bold text-rose-500 hover:bg-rose-50 px-2 py-1 rounded-lg">移除此筆</button>
                                                </div>

                                                <div className="grid grid-cols-1 md:grid-cols-3 gap-3 text-xs">
                                                    <div>
                                                        <label className="font-bold text-slate-500 block mb-1">a. 會勘通知文號 (發文字號)</label>
                                                        <input type="text" className="w-full rounded-xl px-3 py-2 bg-white border border-slate-200 font-bold" value={item.extData.surveyDocNo} onChange={e => updateItemField(idx, 'surveyDocNo', e.target.value, true)} />
                                                    </div>
                                                    <div>
                                                        <label className="font-bold text-slate-500 block mb-1">f. 會勘時間</label>
                                                        <input type="datetime-local" className="w-full rounded-xl px-3 py-2 bg-white border border-slate-200 font-bold" value={getDatetimeLocal(item.extData.surveyDate)} onChange={e => updateItemField(idx, 'surveyDate', e.target.value, true)} />
                                                    </div>
                                                    <div>
                                                        <label className="font-bold text-slate-500 block mb-1">e. 承辦人 (聯絡人姓名)</label>
                                                        <input type="text" className="w-full rounded-xl px-3 py-2 bg-white border border-slate-200 font-bold" value={item.extData.assignee} onChange={e => updateItemField(idx, 'assignee', e.target.value, true)} />
                                                    </div>
                                                    <div>
                                                        <label className="font-bold text-slate-500 block mb-1">d. 陳情人 (備註依據單位，無則空白)</label>
                                                        <input type="text" placeholder="無依據單位則留白" className="w-full rounded-xl px-3 py-2 bg-white border border-slate-200" value={item.name} onChange={e => updateItemField(idx, 'name', e.target.value, false)} />
                                                    </div>
                                                    <div>
                                                        <label className="font-bold text-slate-500 block mb-1">行政區</label>
                                                        <select className="w-full rounded-xl px-3 py-2 bg-white border border-slate-200 font-bold" value={item.district} onChange={e => updateItemField(idx, 'district', e.target.value, false)}>
                                                            {TAOYUAN_DISTRICTS.map(d => <option key={d} value={d}>{d}</option>)}
                                                        </select>
                                                    </div>
                                                    <div>
                                                        <label className="font-bold text-slate-500 block mb-1">c. 詳細地點 (會勘地點)</label>
                                                        <input type="text" className="w-full rounded-xl px-3 py-2 bg-white border border-slate-200 font-bold" value={item.address} onChange={e => updateItemField(idx, 'address', e.target.value, false)} />
                                                    </div>
                                                    <div className="md:col-span-3">
                                                        <label className="font-bold text-slate-500 block mb-1">b. 陳情內容 (會勘事由)</label>
                                                        <input type="text" className="w-full rounded-xl px-3 py-2 bg-white border border-slate-200 font-bold" value={item.content} onChange={e => updateItemField(idx, 'content', e.target.value, false)} />
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>

                        <div className="p-6 border-t border-slate-100 flex justify-end gap-3 bg-slate-50/50">
                            <button type="button" onClick={onClose} className="px-5 py-3 bg-white border border-slate-200 text-slate-600 rounded-xl font-bold text-sm hover:bg-slate-100">取消</button>
                            <button
                                type="button"
                                disabled={parsedItems.length === 0 || isProcessing}
                                onClick={async () => {
                                    await onConfirmImport(parsedItems);
                                    setParsedItems([]);
                                    onClose();
                                }}
                                className="px-6 py-3 bg-primary text-white rounded-xl font-bold text-sm shadow-md hover:opacity-95 disabled:opacity-40"
                            >
                                確認匯入 ({parsedItems.length} 筆案件)
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const StatusBadge = ({ status }) => {
            const config = {
                PENDING: { color: 'bg-amber-50 text-amber-700 border border-amber-200', label: '辦理中' },
                CLOSED: { color: 'bg-emerald-50 text-emerald-700 border border-emerald-200', label: '已結案' },
                MERGED: { color: 'bg-slate-100 text-slate-500 border border-slate-300', label: '已併案' }
            }[status] || { color: 'bg-slate-100 text-slate-600', label: status };
            return <span className={`px-3 py-1.5 rounded-full text-xs font-bold tracking-wide shadow-sm ${config.color}`}>{config.label}</span>;
        };

        const CategoryBadge = ({ category, customName }) => {
            const config = {
                SURVEY: { color: 'bg-indigo-50 text-indigo-700', label: '會勘' },
                REPLY: { color: 'bg-cyan-50 text-cyan-700', label: '回復' },
                A1: { color: 'bg-rose-50 text-rose-700', label: 'A1事故' },
                FORWARD: { color: 'bg-purple-50 text-purple-700', label: '函轉' },
                SELF: { color: 'bg-teal-50 text-teal-700', label: '自辦' },
                OTHER_UNIT: { color: 'bg-blue-50 text-blue-700', label: '其他單位辦理' },
                DIRECTOR: { color: 'bg-red-100 text-red-700', label: '局長案' },
                TEMP: { color: 'bg-orange-100 text-orange-700', label: '臨時交辦' },
                OTHER_SPECIAL: { color: 'bg-stone-100 text-stone-700', label: '其他(特殊)' },
                OTHER: { color: 'bg-slate-200 text-slate-700', label: customName || '其他' },
            }[category] || { color: 'bg-slate-100 text-slate-600', label: '未分類' };
            return <span className={`px-3 py-1.5 rounded-full text-xs font-bold tracking-wide ${config.color} whitespace-nowrap`}>{config.label}</span>;
        };

        const WarningBadge = ({ caseData }) => {
            if (caseData.status === 'CLOSED' || caseData.status === 'MERGED') return <span className="text-slate-400 font-bold text-xs bg-slate-100 px-2 py-1 rounded-md border border-slate-200">無</span>;
            const status = getDeadlineStatus(caseData);
            if (status === 'OVERDUE') {
                return <span className="bg-rose-100 text-rose-700 px-2 py-1 rounded-md font-bold text-xs shadow-sm flex items-center w-fit gap-1 whitespace-nowrap border border-rose-200"><Icons.Alert /> 已逾期</span>;
            } else if (status === 'WARNING') {
                const today = new Date(); today.setHours(0,0,0,0);
                const deadline = new Date(caseData.extData.completionDeadline); deadline.setHours(0,0,0,0);
                const diffDays = Math.ceil((deadline.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
                return <span className="bg-amber-100 text-amber-700 px-2 py-1 rounded-md font-bold text-xs shadow-sm flex items-center w-fit gap-1 whitespace-nowrap border border-amber-200"><Icons.Clock /> 剩 {diffDays} 天</span>;
            }
            return <span className="bg-emerald-50 text-emerald-600 px-2 py-1 rounded-md font-bold text-xs border border-emerald-100 w-fit whitespace-nowrap flex items-center gap-1">安全期</span>;
        };

        const getRowStatusClass = (c) => {
            if (c.status === 'CLOSED' || c.status === 'MERGED') return 'hover:bg-slate-50/80 transition-colors';
            const status = getDeadlineStatus(c);
            if (status === 'OVERDUE') return 'urgent-row hover:bg-rose-50';
            if (status === 'WARNING') return 'warning-row';
            return 'hover:bg-slate-50/80 transition-colors';
        };

        const getDeadlineColor = (c) => {
            if (c.status === 'CLOSED' || c.status === 'MERGED') return 'text-slate-500';
            const status = getDeadlineStatus(c);
            if (status === 'OVERDUE') return 'text-red-600 font-bold';
            if (status === 'WARNING') return 'text-amber-600 font-bold';
            return 'text-slate-600';
        };

        const LocationPicker = ({ lat, lng, onChange, readOnly = false, defaultHeight = 320 }) => {
            const mapRef = useRef(null);
            const mapInstanceRef = useRef(null);
            const markerRef = useRef(null);
            const [boxHeight, setBoxHeight] = useState(defaultHeight);
            const [isDraggingResize, setIsDraggingResize] = useState(false);

            useEffect(() => {
                if (!mapRef.current) return;
                if (!mapInstanceRef.current) {
                    const map = L.map(mapRef.current).setView([lat, lng], 16);
                    L.tileLayer('https://mt1.google.com/vt/lyrs=m&hl=zh-TW&x={x}&y={y}&z={z}', { maxZoom: 20, attribution: '&copy; Google Maps' }).addTo(map);
                    const iconHtml = `<div style="width: 24px; height: 24px; background-color: #ef4444; border-radius: 50%; border: 4px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.4);"></div>`;
                    const icon = L.divIcon({ html: iconHtml, className: '', iconSize: [24, 24], iconAnchor: [12, 12] });
                    const marker = L.marker([lat, lng], { draggable: !readOnly, icon }).addTo(map);
                    marker.on('dragend', () => {
                        if (onChange) {
                            const pos = marker.getLatLng();
                            onChange(pos.lat, pos.lng);
                        }
                    });
                    mapInstanceRef.current = map;
                    markerRef.current = marker;
                    setTimeout(() => map.invalidateSize(), 300);
                } else {
                    mapInstanceRef.current.setView([lat, lng], mapInstanceRef.current.getZoom() || 16);
                    markerRef.current.setLatLng([lat, lng]);
                    if (markerRef.current.dragging) {
                        if (readOnly) markerRef.current.dragging.disable();
                        else markerRef.current.dragging.enable();
                    }
                }
            }, [lat, lng, readOnly]);

            // 監聽容器高度變化與視窗拉伸，自動刷新地圖圖磚範圍
            useEffect(() => {
                if (!mapRef.current || !mapInstanceRef.current) return;
                mapInstanceRef.current.invalidateSize();
                if (typeof ResizeObserver !== 'undefined') {
                    const observer = new ResizeObserver(() => {
                        if (mapInstanceRef.current) {
                            mapInstanceRef.current.invalidateSize();
                        }
                    });
                    observer.observe(mapRef.current);
                    return () => observer.disconnect();
                }
            }, [boxHeight]);

            // 處理底部拖曳拉桿上下拉伸
            const startResizeDrag = (e) => {
                e.preventDefault();
                e.stopPropagation();
                const startY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
                const startHeight = mapRef.current ? mapRef.current.offsetHeight : boxHeight;
                setIsDraggingResize(true);

                const onMove = (moveEvent) => {
                    const currentY = moveEvent.type.includes('touch') ? moveEvent.touches[0].clientY : moveEvent.clientY;
                    const deltaY = currentY - startY;
                    const nextHeight = Math.min(750, Math.max(180, startHeight + deltaY));
                    setBoxHeight(nextHeight);
                };

                const onUp = () => {
                    setIsDraggingResize(false);
                    window.removeEventListener('mousemove', onMove);
                    window.removeEventListener('mouseup', onUp);
                    window.removeEventListener('touchmove', onMove);
                    window.removeEventListener('touchend', onUp);
                };

                window.addEventListener('mousemove', onMove);
                window.addEventListener('mouseup', onUp);
                window.addEventListener('touchmove', onMove, { passive: false });
                window.addEventListener('touchend', onUp);
            };

            return (
                <div className="w-full flex flex-col select-none">
                    <div
                        ref={mapRef}
                        style={{ height: `${boxHeight}px`, minHeight: '180px', maxHeight: '750px', resize: 'vertical' }}
                        className="w-full z-0 overflow-hidden"
                    ></div>
                    <div
                        onMouseDown={startResizeDrag}
                        onTouchStart={startResizeDrag}
                        className={`w-full py-1.5 px-3 bg-slate-100 hover:bg-indigo-50 border-t border-slate-200 flex items-center justify-between cursor-ns-resize transition-colors ${isDraggingResize ? 'bg-indigo-100 text-primary' : 'text-slate-500'}`}
                        title="上下拖曳可自由調整地圖檢視高度"
                    >
                        <span className="text-[11px] font-bold flex items-center gap-1.5">
                            <span className="tracking-widest font-black">↕</span> 上下拖曳拉伸地圖範圍 ({Math.round(boxHeight)}px)
                        </span>
                        <div className="flex items-center gap-1" onMouseDown={e => e.stopPropagation()} onTouchStart={e => e.stopPropagation()}>
                            <button type="button" onClick={() => setBoxHeight(240)} className={`px-2 py-0.5 rounded text-[10px] font-bold transition-colors ${boxHeight <= 250 ? 'bg-primary text-white' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}`}>標準</button>
                            <button type="button" onClick={() => setBoxHeight(400)} className={`px-2 py-0.5 rounded text-[10px] font-bold transition-colors ${boxHeight > 250 && boxHeight <= 450 ? 'bg-primary text-white' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}`}>加大</button>
                            <button type="button" onClick={() => setBoxHeight(580)} className={`px-2 py-0.5 rounded text-[10px] font-bold transition-colors ${boxHeight > 450 ? 'bg-primary text-white' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}`}>特大</button>
                        </div>
                    </div>
                </div>
            );
        };

        const CaseMap = ({ cases, onSelectCase }) => {
            const mapRef = useRef(null);
            const mapInstanceRef = useRef(null);
            const markersLayerRef = useRef(null);
            const searchMarkerRef = useRef(null);
            const [searchInput, setSearchInput] = useState('');
            const [isSearching, setIsSearching] = useState(false);
            const [searchError, setSearchError] = useState('');

            const activeCases = useMemo(() => {
                return cases.filter(c => c.caseType !== 'SPECIAL').map(c => {
                    if (!c.location?.lat || !c.location?.lng) {
                        const fallback = DISTRICT_COORDS[c.location?.district];
                        if (fallback) {
                            let hash = 0; const idStr = c.id || '';
                            for (let i = 0; i < idStr.length; i++) hash = idStr.charCodeAt(i) + ((hash << 5) - hash);
                            const offsetLat = (Math.abs(Math.sin(hash)) - 0.5) * 0.025;
                            const offsetLng = (Math.abs(Math.cos(hash)) - 0.5) * 0.025;
                            return { ...c, location: { ...c.location, lat: fallback.lat + offsetLat, lng: fallback.lng + offsetLng, isFallback: true } };
                        }
                    }
                    return c;
                }).filter(c => c.location?.lat && c.location?.lng);
            }, [cases]);

            useEffect(() => {
                if (!mapRef.current) return;
                if (!mapInstanceRef.current) {
                    const map = L.map(mapRef.current).setView([24.9631, 121.2238], 12);
                    L.tileLayer('https://mt1.google.com/vt/lyrs=m&hl=zh-TW&x={x}&y={y}&z={z}', { maxZoom: 20, attribution: '&copy; Google Maps' }).addTo(map);
                    mapInstanceRef.current = map;
                    markersLayerRef.current = L.markerClusterGroup({
                        maxClusterRadius: 40, spiderfyOnMaxZoom: true, disableClusteringAtZoom: 15,
                        iconCreateFunction: function(cluster) {
                            return L.divIcon({
                                html: `<div style="background: linear-gradient(135deg, #6366f1, #4f46e5); color: white; font-weight: 900; border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(99,102,241,0.4); border: 3px solid white; font-size: 16px;">${cluster.getChildCount()}</div>`,
                                className: 'custom-cluster-icon', iconSize: [44, 44]
                            });
                        }
                    }).addTo(map);
                }

                markersLayerRef.current.clearLayers();
                const newMarkers = [];

                activeCases.forEach(c => {
                    let color = '#6366f1';
                    if (c.status === 'CLOSED' || c.status === 'MERGED') color = '#94a3b8';
                    else if (c.category === 'A1') color = '#ef4444';
                    else if (c.category === 'REPLY') color = '#06b6d4';
                    else if (c.category === 'TEMP') color = '#f97316';
                    else if (c.category === 'OTHER_UNIT') color = '#3b82f6';

                    const markerHtml = `<div style="width: 24px; height: 24px; background: ${color}; border-radius: 50%; border: 3px solid white; box-shadow: 0 4px 8px rgba(0,0,0,0.3);"></div>`;
                    const icon = L.divIcon({ html: markerHtml, className: '', iconSize: [24, 24], iconAnchor: [12, 12] });
                    const marker = L.marker([c.location.lat, c.location.lng], { icon });
                    const isClosed = c.status === 'CLOSED' || c.status === 'MERGED';
                    const tooltipContent = `
                        <div style="min-width: 200px;">
                            <div style="font-size: 11px; font-weight: 900; color: ${color}; margin-bottom: 4px;">
                                ${isClosed ? '[已結案] ' : ''}${c.category === 'SURVEY' ? '會勘' : c.category === 'A1' ? 'A1事故' : '一般案件'}
                            </div>
                            <div style="font-size: 15px; font-weight: 800; color: #1e293b; margin-bottom: 6px;">${c.location.address}</div>
                            <div style="font-size: 13px; color: #64748b; max-width: 240px; white-space: normal;">${c.content}</div>
                        </div>
                    `;
                    marker.bindTooltip(tooltipContent, { direction: 'top', offset: [0, -12], opacity: 1, className: 'custom-tooltip shadow-float border-0 rounded-xl' });
                    marker.on('click', () => onSelectCase(c));
                    newMarkers.push(marker);
                });
                
                markersLayerRef.current.addLayers(newMarkers);
                setTimeout(() => mapInstanceRef.current.invalidateSize(), 300);
            }, [activeCases, onSelectCase]);

            const handleSearch = async (e) => {
                if (e) e.preventDefault();
                if (!searchInput.trim()) return;
                setIsSearching(true); setSearchError('');
                try {
                    const query = searchInput.includes('桃園') ? searchInput : `桃園市${searchInput}`;
                    const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`;
                    const response = await fetch(url, { headers: { 'Accept-Language': 'zh-TW' } });
                    const data = await response.json();
                    if (data && data.length > 0) {
                        const lat = parseFloat(data[0].lat); const lng = parseFloat(data[0].lon);
                        if (mapInstanceRef.current) {
                            mapInstanceRef.current.flyTo([lat, lng], 17, { duration: 1.5 });
                            if (searchMarkerRef.current) mapInstanceRef.current.removeLayer(searchMarkerRef.current);
                            const iconHtml = `<div style="width: 28px; height: 28px; background: #10b981; border-radius: 50%; border: 3px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.3);"></div>`;
                            const searchIcon = L.divIcon({ html: iconHtml, className: '', iconSize: [28, 28], iconAnchor: [14, 14] });
                            const newMarker = L.marker([lat, lng], { icon: searchIcon }).addTo(mapInstanceRef.current);
                            newMarker.bindTooltip(`📍 ${searchInput}`, { direction: 'top', offset: [0, -15] }).openTooltip();
                            searchMarkerRef.current = newMarker;
                        }
                    } else {
                        setSearchError('找不到該地址，請嘗試加上行政區或完整路段名。');
                        setTimeout(() => setSearchError(''), 3500);
                    }
                } catch (err) {
                    setSearchError('定位服務暫時無法使用。'); setTimeout(() => setSearchError(''), 3500);
                } finally { setIsSearching(false); }
            };

            return (
                <div className="h-full flex flex-col animate-fade-in bg-white rounded-3xl shadow-soft p-4 md:p-6 border border-slate-100">
                    <div className="flex flex-col xl:flex-row justify-between items-start xl:items-center mb-4 pl-2 gap-4">
                        <div>
                            <h3 className="text-xl font-black text-slate-800 flex items-center gap-2"><Icons.MapIcon /> 案件空間分布</h3>
                            <p className="text-sm text-slate-400 mt-1 font-medium">包含已結案歷史案件 (灰色標記)</p>
                        </div>
                        <div className="flex flex-col sm:flex-row items-center gap-3 w-full xl:w-auto">
                            <form onSubmit={handleSearch} className="relative w-full sm:w-72 xl:w-80">
                                <div className="absolute inset-y-0 left-3 flex items-center pointer-events-none text-slate-400"><Icons.Search /></div>
                                <input type="text" placeholder="在地圖上搜尋地址或路口..." className="w-full pl-10 pr-16 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-700" value={searchInput} onChange={(e) => setSearchInput(e.target.value)} />
                                <button type="submit" disabled={isSearching} className="absolute inset-y-1.5 right-1.5 px-3 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 border border-indigo-200 text-xs font-bold rounded-lg">{isSearching ? '尋找中' : '定位'}</button>
                                {searchError && <div className="absolute top-full left-0 mt-2 bg-rose-50 text-rose-600 text-xs font-bold px-3 py-2 rounded-lg border border-rose-200 shadow-sm z-10">{searchError}</div>}
                            </form>
                            <span className="text-sm bg-indigo-50 text-indigo-600 px-4 py-2.5 rounded-xl font-bold border border-indigo-100 whitespace-nowrap hidden sm:block">地圖案件數：{activeCases.length}</span>
                        </div>
                    </div>
                    <div ref={mapRef} className="w-full flex-1 rounded-2xl overflow-hidden shadow-inner border border-slate-200 z-0 relative"></div>
                </div>
            );
        };

        const CalendarView = ({ cases, onSelectCase }) => {
            const [currentDate, setCurrentDate] = useState(new Date());
            const [viewMode, setViewMode] = useState('WEEK');

            const surveyCases = useMemo(() => {
                return cases.filter(c => c.status !== 'MERGED' && c.caseType !== 'SPECIAL' && ['SURVEY', 'A1', 'SELF', 'OTHER_UNIT'].includes(c.category) && c.extData?.surveyDate);
            }, [cases]);

            const handlePrev = () => {
                const d = new Date(currentDate);
                if (viewMode === 'MONTH') d.setMonth(d.getMonth() - 1);
                else if (viewMode === 'WEEK') d.setDate(d.getDate() - 7);
                else d.setDate(d.getDate() - 1);
                setCurrentDate(d);
            };

            const handleNext = () => {
                const d = new Date(currentDate);
                if (viewMode === 'MONTH') d.setMonth(d.getMonth() + 1);
                else if (viewMode === 'WEEK') d.setDate(d.getDate() + 7);
                else d.setDate(d.getDate() + 1);
                setCurrentDate(d);
            };

            const getDisplayTitle = () => {
                if (viewMode === 'MONTH') return `${currentDate.getFullYear()}年 ${currentDate.getMonth() + 1}月`;
                if (viewMode === 'WEEK') {
                    const start = new Date(currentDate); start.setDate(currentDate.getDate() - currentDate.getDay());
                    const end = new Date(start); end.setDate(start.getDate() + 6);
                    return `${start.getMonth() + 1}/${start.getDate()} - ${end.getMonth() + 1}/${end.getDate()}`;
                }
                return `${currentDate.getFullYear()}年 ${currentDate.getMonth() + 1}月 ${currentDate.getDate()}日`;
            };

            const renderTimeline = () => {
                let days = [];
                if (viewMode === 'DAY') {
                    days = [new Date(currentDate)];
                } else {
                    const start = new Date(currentDate); start.setDate(currentDate.getDate() - currentDate.getDay());
                    for (let i = 0; i < 7; i++) {
                        const d = new Date(start); d.setDate(start.getDate() + i); days.push(d);
                    }
                }

                const dayCases = days.map(day => {
                    const dateStr = getLocalISODate(day);
                    return {
                        date: day,
                        cases: surveyCases.filter(c => c.extData.surveyDate.startsWith(dateStr)).sort((a,b) => {
                            const timeA = a.extData.surveyDate.includes('T') ? a.extData.surveyDate.split('T')[1] : '00:00';
                            const timeB = b.extData.surveyDate.includes('T') ? b.extData.surveyDate.split('T')[1] : '00:00';
                            return timeA.localeCompare(timeB);
                        })
                    };
                });

                const HOURS = Array.from({length: 12}, (_, i) => i + 8);
                const MIN_HOUR = 8;
                const PIXELS_PER_HOUR = 120;

                const getPositionStyle = (timeStr, concurrentIndex = 0, totalConcurrent = 1) => {
                    if(!timeStr.includes('T') && !timeStr.includes(' ')) return { top: 0, height: 40, position: 'relative' };
                    const timePart = timeStr.includes('T') ? timeStr.split('T')[1] : timeStr.split(' ')[1];
                    const [hh, mm] = timePart.split(':').map(Number);
                    const hourDiff = hh - MIN_HOUR;
                    const topPixels = (hourDiff * PIXELS_PER_HOUR) + ((mm / 60) * PIXELS_PER_HOUR);
                    const width = `calc(${100 / totalConcurrent}% - 4px)`;
                    const left = `calc(${100 / totalConcurrent * concurrentIndex}%)`;
                    return { position: 'absolute', top: `${topPixels}px`, height: `${PIXELS_PER_HOUR - 10}px`, width, left, zIndex: 10 + concurrentIndex };
                };

                return (
                    <div className="flex-1 flex flex-col bg-slate-50 rounded-2xl border border-slate-200 overflow-hidden relative">
                        <div className="flex bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
                            <div className="w-16 shrink-0 border-r border-slate-200 flex items-center justify-center bg-slate-50"><Icons.Clock /></div>
                            {dayCases.map((dc, i) => {
                                const isToday = getLocalISODate(dc.date) === getLocalISODate(new Date());
                                return (
                                    <div key={i} className={`flex-1 text-center py-3 border-r border-slate-100 ${isToday ? 'bg-indigo-50/50' : ''}`}>
                                        <div className={`text-xs font-bold mb-1 ${isToday ? 'text-indigo-500' : 'text-slate-400'}`}>{['日','一','二','三','四','五','六'][dc.date.getDay()]}</div>
                                        <div className={`text-lg font-black ${isToday ? 'text-indigo-700 bg-indigo-100 w-8 h-8 rounded-full flex items-center justify-center mx-auto' : 'text-slate-700'}`}>{dc.date.getDate()}</div>
                                    </div>
                                );
                            })}
                        </div>
                        <div className="flex-1 overflow-y-auto relative bg-white">
                            <div className="flex relative" style={{ height: `${HOURS.length * PIXELS_PER_HOUR}px` }}>
                                <div className="w-16 shrink-0 border-r border-slate-200 bg-slate-50 sticky left-0 z-20">
                                    {HOURS.map(h => (
                                        <div key={h} className="text-xs font-bold text-slate-400 text-center relative" style={{ height: `${PIXELS_PER_HOUR}px` }}>
                                            <span className="absolute top-0 left-0 w-full -mt-2 bg-slate-50">{String(h).padStart(2, '0')}:00</span>
                                        </div>
                                    ))}
                                </div>
                                {dayCases.map((dc, colIndex) => {
                                    const timedCases = dc.cases.filter(c => c.extData.surveyDate.includes('T') || c.extData.surveyDate.includes(' '));
                                    const grouped = {};
                                    timedCases.forEach(c => {
                                        const t = c.extData.surveyDate;
                                        if(!grouped[t]) grouped[t] = [];
                                        grouped[t].push(c);
                                    });
                                    return (
                                        <div key={colIndex} className="flex-1 border-r border-slate-100 relative">
                                            {HOURS.map(h => (
                                                <Fragment key={`grid-${h}`}>
                                                    <div className="absolute w-full border-t border-slate-200" style={{ top: `${(h - MIN_HOUR) * PIXELS_PER_HOUR}px` }}></div>
                                                    <div className="absolute w-full border-t border-slate-100 border-dashed" style={{ top: `${(h - MIN_HOUR + 0.5) * PIXELS_PER_HOUR}px` }}></div>
                                                </Fragment>
                                            ))}
                                            {Object.entries(grouped).map(([timeStr, groupCases]) =>
                                                groupCases.map((c, index) => {
                                                    const style = getPositionStyle(timeStr, index, groupCases.length);
                                                    const isClosed = c.status === 'CLOSED';
                                                    return (
                                                        <div key={c.id} onClick={() => onSelectCase(c)} style={style} className={`absolute m-[2px] p-2 rounded-lg cursor-pointer transition-all hover:scale-[1.02] hover:z-30 shadow-sm border overflow-hidden ${isClosed ? 'bg-slate-100 border-slate-300' : 'bg-white border-indigo-300'}`}>
                                                            <div className={`w-1 h-full absolute left-0 top-0 ${isClosed ? 'bg-slate-400' : 'bg-primary'}`}></div>
                                                            <div className={`text-xs font-bold mb-0.5 flex items-center gap-1 ${isClosed ? 'text-slate-500' : 'text-indigo-600'}`}>
                                                                {timeStr.includes('T') ? timeStr.split('T')[1] : timeStr.split(' ')[1]}
                                                            </div>
                                                            <div className="font-black text-sm mb-1 leading-tight line-clamp-2 text-slate-800">{c.location?.address}</div>
                                                            <div className="text-xs text-slate-500 line-clamp-1">{c.extData?.assignee || '未指派'}</div>
                                                        </div>
                                                    );
                                                })
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                );
            };

            const renderMonth = () => {
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();
                const firstDay = new Date(year, month, 1);
                const lastDay = new Date(year, month + 1, 0);
                const startOffset = firstDay.getDay();
                const totalDays = lastDay.getDate();
                const days = [];
                for(let i=0; i<startOffset; i++) days.push(null);
                for(let i=1; i<=totalDays; i++) days.push(new Date(year, month, i));

                return (
                    <div className="flex-1 flex flex-col bg-white rounded-2xl border border-slate-200 overflow-hidden">
                        <div className="grid grid-cols-7 border-b border-slate-200 bg-slate-50">
                            {['日','一','二','三','四','五','六'].map(d => <div key={d} className="py-2 text-center text-xs font-bold text-slate-500">{d}</div>)}
                        </div>
                        <div className="flex-1 grid grid-cols-7 auto-rows-fr">
                            {days.map((date, idx) => {
                                if(!date) return <div key={idx} className="border-b border-r border-slate-100 bg-slate-50/50 p-1"></div>;
                                const dateStr = getLocalISODate(date);
                                const dayCases = surveyCases.filter(c => c.extData.surveyDate.startsWith(dateStr));
                                const isToday = dateStr === getLocalISODate(new Date());
                                return (
                                    <div key={idx} className={`border-b border-r border-slate-100 p-1 md:p-2 hover:bg-slate-50 flex flex-col min-h-[100px] ${isToday ? 'bg-indigo-50/20' : ''}`}>
                                        <div className={`text-xs font-bold w-6 h-6 flex items-center justify-center rounded-full mb-1 ${isToday ? 'bg-primary text-white' : 'text-slate-600'}`}>{date.getDate()}</div>
                                        <div className="flex-1 overflow-y-auto space-y-1 pr-1">
                                            {dayCases.map(c => {
                                                const time = formatDateTime(c.extData.surveyDate).split(' ')[1] || '';
                                                return (
                                                    <div key={c.id} onClick={() => onSelectCase(c)} className="text-[10px] md:text-xs p-1 rounded truncate cursor-pointer border bg-indigo-50 text-indigo-700 border-indigo-100 font-bold">
                                                        {time && <span className="mr-1 opacity-70">{time}</span>}{c.location?.district} {c.location?.address}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            };

            return (
                <div className="h-full flex flex-col animate-fade-in bg-white rounded-3xl shadow-soft p-4 border border-slate-100">
                    <div className="flex flex-col sm:flex-row justify-between items-center mb-4 gap-4 px-2">
                        <div className="flex items-center gap-4">
                            <h3 className="text-xl font-black text-slate-800 flex items-center gap-2"><Icons.Calendar /> 會勘行事曆</h3>
                            <div className="flex bg-slate-100 p-1 rounded-xl">
                                {['MONTH', 'WEEK', 'DAY'].map(mode => (
                                    <button key={mode} onClick={() => setViewMode(mode)} className={`px-4 py-1.5 text-xs font-bold rounded-lg transition-all ${viewMode === mode ? 'bg-white text-primary shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>
                                        {mode === 'MONTH' ? '月' : mode === 'WEEK' ? '周' : '日'}
                                    </button>
                                ))}
                            </div>
                        </div>
                        <div className="flex items-center gap-3 bg-slate-50 px-2 py-1 rounded-xl border border-slate-200">
                            <button onClick={handlePrev} className="p-2 hover:bg-white rounded-lg text-slate-500"><Icons.ChevronLeft /></button>
                            <span className="font-bold text-slate-700 min-w-[120px] text-center">{getDisplayTitle()}</span>
                            <button onClick={handleNext} className="p-2 hover:bg-white rounded-lg text-slate-500"><Icons.ChevronRight /></button>
                            <button onClick={() => setCurrentDate(new Date())} className="px-3 py-1.5 text-xs font-bold text-primary hover:bg-indigo-50 rounded-lg ml-2">今天</button>
                        </div>
                    </div>
                    {viewMode === 'MONTH' ? renderMonth() : renderTimeline()}
                </div>
            );
        };

        const CaseList = ({ cases, onSelectCase, activeTab, onTabChange, config, isSpecialMode }) => {
            const [filter, setFilter] = useState('');
            const [subTab, setSubTab] = useState('ALL');

            const modeFilteredCases = cases.filter(c => isSpecialMode ? c.caseType === 'SPECIAL' : c.caseType !== 'SPECIAL');
            
            const counts = {
                PROCESSING: modeFilteredCases.filter(c => c.status !== 'CLOSED' && c.status !== 'MERGED').length,
                CLOSED: modeFilteredCases.filter(c => c.status === 'CLOSED' || c.status === 'MERGED').length,
