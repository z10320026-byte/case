                                        <div className="flex flex-wrap items-baseline justify-between mb-1.5">
                                            <div className="flex gap-x-3 items-baseline"><span className="font-bold text-slate-700">{item.author}</span><span className="text-xs font-medium text-slate-400">{item.date}</span></div>
                                            {caseData.status !== 'CLOSED' && caseData.status !== 'MERGED' && editingHistoryIdx !== idx && (<button onClick={() => { setEditingHistoryIdx(idx); setEditingHistoryContent(item.content); }} className="text-primary opacity-0 group-hover:opacity-100 transition-opacity text-xs flex items-center gap-1 hover:underline bg-indigo-50 px-2 py-1 rounded"><Icons.Edit /> 修改</button>)}
                                        </div>
                                        {editingHistoryIdx === idx ? (
                                            <div className="bg-slate-50 p-4 rounded-2xl w-full border border-indigo-200 shadow-inner mt-2"><textarea className="w-full rounded-xl px-3 py-2 border border-slate-200 focus:ring-4 focus:ring-indigo-500/20 bg-white text-slate-700 leading-relaxed min-h-[80px] text-sm" value={editingHistoryContent} onChange={(e) => setEditingHistoryContent(e.target.value)} /><div className="flex gap-2 justify-end mt-3"><button onClick={() => setEditingHistoryIdx(null)} className="px-4 py-1.5 text-xs font-bold bg-slate-200 text-slate-600 rounded-lg hover:bg-slate-300 transition-colors">取消</button><button onClick={() => { onEditHistory(caseData.id, idx, editingHistoryContent); setEditingHistoryIdx(null); }} className="px-4 py-1.5 text-xs font-bold bg-primary text-white rounded-lg hover:bg-indigo-600 shadow-sm transition-colors">儲存修改</button></div></div>
                                        ) : (
                                            <div className="bg-slate-50 p-4 rounded-2xl text-sm text-slate-600 leading-relaxed inline-block min-w-[200px] w-full break-words whitespace-pre-wrap mt-2">{item.content}</div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const CaseManagementSystem = () => {
            const [view, setView] = useState('LIST'); 
            const [cases, setCases] = useState([]);
            const [selectedCase, setSelectedCase] = useState(null);
            const [showNotifications, setShowNotifications] = useState(false);
            const [showSettings, setShowSettings] = useState(false);
            const [showFbModal, setShowFbModal] = useState(false);
            const [showThemeModal, setShowThemeModal] = useState(false);
            const [syncStatus, setSyncStatus] = useState('CONNECTING');
            const [sysModal, setSysModal] = useState({ isOpen: false });

            // 讀取並管理主題風格與自訂顏色設定
            const [themeConfig, setThemeConfig] = useState(() => {
                try {
                    const saved = localStorage.getItem('user_theme_config');
                    if (saved) return JSON.parse(saved);
                } catch (e) {}
                return THEME_PRESETS[0];
            });

            useEffect(() => {
                const root = document.documentElement;
                root.style.setProperty('--color-primary', themeConfig.primary || '#6366f1');
                root.style.setProperty('--color-surface', themeConfig.surface || '#f8fafc');
                root.style.setProperty('--color-sidebar', themeConfig.sidebar || '#ffffff');
                root.style.setProperty('--color-card', themeConfig.card || '#ffffff');
                root.style.setProperty('--color-text', themeConfig.text || '#1e293b');
                root.style.setProperty('--color-input', themeConfig.input || '#f1f5f9');
                try { localStorage.setItem('user_theme_config', JSON.stringify(themeConfig)); } catch (e) {}
            }, [themeConfig]);
            
            // 讀取使用者儲存於 localStorage 的 Firebase 設定，若無則使用程式碼頂端的 DEFAULT_FIREBASE_CONFIG
            const [fbConfig, setFbConfig] = useState(() => {
                try {
                    const saved = localStorage.getItem('user_firebase_config');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        if (parsed && parsed.apiKey) return parsed;
                    }
                } catch (e) {}
                return DEFAULT_FIREBASE_CONFIG;
            });

            const collectionName = fbConfig?.collectionName || 'my_cases';
            const fileInputRef = useRef(null);

            useEffect(() => {
                let unsubscribe = null;
                const loadLocalBackup = () => {
                    try {
                        const localData = localStorage.getItem('cases_backup');
                        if (localData) setCases(sortCases(JSON.parse(localData)));
                    } catch (err) {}
                };

                // 若未設定 API Key 或 Project ID，直接進入單機模式
                if (!fbConfig || !fbConfig.apiKey || !fbConfig.projectId) {
                    window.fbStandaloneDb = null;
                    setSyncStatus('LOCAL_ONLY');
                    loadLocalBackup();
                    return;
                }

                setSyncStatus('CONNECTING');
                const initStandaloneFirebase = async () => {
                    const { initializeApp, initializeFirestore, persistentLocalCache, collection, onSnapshot, getAuth, signInAnonymously } = window.FirebaseModules;
                    try {
                        const appInstance = initializeApp({
                            apiKey: fbConfig.apiKey,
                            authDomain: fbConfig.authDomain || `${fbConfig.projectId}.firebaseapp.com`,
                            projectId: fbConfig.projectId
                        }, "App_" + Date.now());
                        
                        const db = initializeFirestore(appInstance, { localCache: persistentLocalCache() });
                        const auth = getAuth(appInstance);
                        
                        window.fbStandaloneApp = appInstance;
                        window.fbStandaloneDb = db;
                        window.fbAuth = auth;

                        try { await signInAnonymously(auth); } catch (e) { console.warn("匿名登入警告:", e); }
                        
                        unsubscribe = onSnapshot(collection(db, collectionName), (snapshot) => {
                            const loadedCases = [];
                            snapshot.forEach(d => loadedCases.push({ id: d.id, ...d.data() }));
                            setCases(sortCases(loadedCases));
                            setSyncStatus('SYNCED');
                        }, (e) => {
                            console.error("Firestore 同步失敗:", e);
                            setSyncStatus('ERROR');
                            loadLocalBackup();
                        });
                    } catch(e) {
                        console.error("Firebase 初始化失敗:", e);
                        setSyncStatus('ERROR');
                        window.fbStandaloneDb = null;
                        loadLocalBackup();
                    }
                };

                const checkFirebase = setInterval(() => {
                    if (window.FirebaseModules) {
                        clearInterval(checkFirebase);
                        initStandaloneFirebase();
                    }
                }, 50);

                return () => {
                    clearInterval(checkFirebase);
                    if (unsubscribe) unsubscribe();
                };
            }, [fbConfig, collectionName]);

            useEffect(() => { try { localStorage.setItem('cases_backup', JSON.stringify(cases)); } catch(e) {} }, [cases]);

            const handleSaveFbConfig = (newCfg) => {
                localStorage.setItem('user_firebase_config', JSON.stringify(newCfg));
                setFbConfig(newCfg);
                setShowFbModal(false);
            };

            const handleClearFbConfig = () => {
                localStorage.removeItem('user_firebase_config');
                setFbConfig({ apiKey: "", authDomain: "", projectId: "", collectionName: "my_cases" });
                setShowFbModal(false);
            };

            const config = useMemo(() => ({
                tabs: [
                    { id: 'PROCESSING', label: '辦理中', icon: Icons.List },
                    { id: 'CLOSED', label: '已結案', icon: Icons.Archive },
                    { id: 'CALENDAR', label: '行事曆', icon: Icons.Calendar }
                ]
            }), []);
            
            const [activeListTab, setActiveListTab] = useState(config.tabs[0].id);
            const handleSelectCase = (c) => { setSelectedCase(c); setView('DETAIL'); };

            const overdueCases = useMemo(() => {
                const today = new Date(); today.setHours(0, 0, 0, 0);
                return cases.filter(c => {
                    if (c.extData?.dismissedRecordNotice) return false;
                    if (!['SURVEY', 'A1'].includes(c.category)) return false;
                    if (c.status === 'CLOSED' || c.status === 'MERGED' || !c.extData?.recordDeadline || c.extData.recordActualDate) return false; 
                    const deadline = new Date(c.extData.recordDeadline); deadline.setHours(0, 0, 0, 0); 
                    return today >= deadline; 
                }).map(c => {
                    const deadline = new Date(c.extData.recordDeadline); deadline.setHours(0, 0, 0, 0);
                    return { ...c, isToday: today.getTime() === deadline.getTime() };
                });
            }, [cases]);

            const closingNotices = useMemo(() => {
                const today = new Date(); today.setHours(0, 0, 0, 0);
                return cases.filter(c => {
                    if (c.status === 'CLOSED' || c.status === 'MERGED' || !c.extData?.completionDeadline) return false;
                    if (c.extData?.dismissedClosingNotice) return false;
                    
                    const deadline = new Date(c.extData.completionDeadline); deadline.setHours(0, 0, 0, 0);
                    const diffDays = Math.ceil((deadline.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
                    if (diffDays <= 15) { c.daysLeft = diffDays; return true; }
                    return false;
                });
            }, [cases]);

            const dismissNotice = async (e, id, type) => {
                e.stopPropagation();
                const caseToUpdate = cases.find(c => c.id === id);
                if (!caseToUpdate) return;
                const fieldName = type === 'RECORD' ? 'dismissedRecordNotice' : 'dismissedClosingNotice';
                const updatedCase = { ...caseToUpdate, extData: { ...caseToUpdate.extData, [fieldName]: true } };
                const cleanCase = JSON.parse(JSON.stringify(updatedCase)); 
                setCases(prev => prev.map(c => c.id === id ? cleanCase : c));
                if (window.fbStandaloneDb) { try { const { setDoc, doc } = window.FirebaseModules; await setDoc(doc(window.fbStandaloneDb, collectionName, id), cleanCase); } catch (err) {} }
            };

            const handleCreateCase = async (newCase) => {
                const caseId = "CASE" + Date.now().toString() + Math.random().toString(36).substring(2, 6);
                const caseRecord = {
                    id: caseId, caseNumber: newCase.caseNumber || caseId, category: newCase.category || 'OTHER', caseType: newCase.caseType || 'NORMAL',
                    petitioner: { name: newCase.name || '' }, location: { district: newCase.location?.district || '', address: newCase.location?.address || '', lat: newCase.location?.lat, lng: newCase.location?.lng, isFallback: newCase.location?.isFallback },
                    content: newCase.content || '', status: newCase.status || 'PENDING', createdAt: getLocalISODate(),
                    history: [{ date: getLocalISODate(), author: `系統`, content: '案件建立', type: 'USER' }], extData: newCase.extData || {}
                };
                if(caseRecord.status === 'CLOSED') caseRecord.history.push({ date: getLocalISODate(), author: `系統`, content: '案件自動結案 (函轉)', type: 'SYS' });
                const cleanRecord = JSON.parse(JSON.stringify(caseRecord)); 
                setCases(prev => sortCases([cleanRecord, ...prev]));
                setView(newCase.caseType === 'SPECIAL' ? 'SPECIAL_LIST' : 'LIST'); 
                setActiveListTab(caseRecord.status === 'CLOSED' ? 'CLOSED' : 'PROCESSING'); 
                if (window.fbStandaloneDb) { try { const { setDoc, doc } = window.FirebaseModules; await setDoc(doc(window.fbStandaloneDb, collectionName, caseId), cleanRecord); } catch (err) {} }
            };

            const handleUpdateBasicInfo = async (id, updates) => {
                const caseToUpdate = cases.find(c => c.id === id);
                if (!caseToUpdate) return;
                const updatedCase = { ...caseToUpdate, ...updates };
                const cleanCase = JSON.parse(JSON.stringify(updatedCase)); 
                setCases(prevCases => sortCases(prevCases.map(c => c.id === id ? cleanCase : c))); setSelectedCase(cleanCase);
                if (window.fbStandaloneDb) { try { const { setDoc, doc } = window.FirebaseModules; await setDoc(doc(window.fbStandaloneDb, collectionName, id), cleanCase); } catch (err) {} }
            };

            const handleUpdateStatus = async (id, newStatus, replyText, newExtData) => {
                const caseToUpdate = cases.find(c => c.id === id);
                if (!caseToUpdate) return;
                let updatedHistory = caseToUpdate.history;
                if (replyText) updatedHistory = [...caseToUpdate.history, { date: getLocalISODate(), author: '承辦人員', content: replyText, type: 'STAFF' }];
                const updatedCase = { ...caseToUpdate, status: newStatus, history: updatedHistory, extData: newExtData ? { ...caseToUpdate.extData, ...newExtData } : caseToUpdate.extData };
                const cleanCase = JSON.parse(JSON.stringify(updatedCase)); 
                setCases(prevCases => sortCases(prevCases.map(c => c.id === id ? cleanCase : c))); setSelectedCase(cleanCase);
                if (window.fbStandaloneDb) { try { const { setDoc, doc } = window.FirebaseModules; await setDoc(doc(window.fbStandaloneDb, collectionName, id), cleanCase); } catch (err) {} }
            };

            const handleEditHistory = async (id, historyIdx, newContent) => {
                const caseToUpdate = cases.find(c => c.id === id);
                if (!caseToUpdate) return;
                let updatedHistory = [...caseToUpdate.history];
                updatedHistory[historyIdx] = { ...updatedHistory[historyIdx], content: newContent };
                const updatedCase = { ...caseToUpdate, history: updatedHistory };
                const cleanCase = JSON.parse(JSON.stringify(updatedCase));
                setCases(prevCases => sortCases(prevCases.map(c => c.id === id ? cleanCase : c))); setSelectedCase(cleanCase);
                if (window.fbStandaloneDb) { try { const { setDoc, doc } = window.FirebaseModules; await setDoc(doc(window.fbStandaloneDb, collectionName, id), cleanCase); } catch (err) {} }
            };

            const handleDeleteCase = async (id) => {
                const deletedCase = cases.find(c => c.id === id);
                const returnView = deletedCase?.caseType === 'SPECIAL' ? 'SPECIAL_LIST' : 'LIST';
                setCases(prevCases => prevCases.filter(c => c.id !== id && c.mergedInto !== id)); setSelectedCase(null); setView(returnView);
                if (window.fbStandaloneDb) { try { const { deleteDoc, doc } = window.FirebaseModules; await deleteDoc(doc(window.fbStandaloneDb, collectionName, id)); } catch (err) {} }
            };
            
            const handleMergeCase = async (childId, parentId) => {
                const childCase = cases.find(c => c.id === childId);
                const parentCase = cases.find(c => c.id === parentId);
                if (!childCase || !parentCase) return;
                const updatedChild = { ...childCase, status: 'MERGED', mergedInto: parentId, history: [...childCase.history, { date: getLocalISODate(), author: `系統`, content: `案件已併入主案件`, type: 'SYS' }] };
                const updatedParent = { ...parentCase, history: [...parentCase.history, { date: getLocalISODate(), author: `系統`, content: `已併入關聯案件 (${childCase.location?.address || childCase.content?.substring(0,10)})`, type: 'SYS' }] };
                const cleanChild = JSON.parse(JSON.stringify(updatedChild));
                const cleanParent = JSON.parse(JSON.stringify(updatedParent));
                setCases(prev => prev.map(c => c.id === childId ? cleanChild : c.id === parentId ? cleanParent : c)); setSelectedCase(cleanChild);
                if (window.fbStandaloneDb) { try { const { setDoc, doc } = window.FirebaseModules; await setDoc(doc(window.fbStandaloneDb, collectionName, childId), cleanChild); await setDoc(doc(window.fbStandaloneDb, collectionName, parentId), cleanParent); } catch (err) {} }
            };

            const handleUnmergeCase = async (childId, parentId) => {
                const childCase = cases.find(c => c.id === childId);
                if (!childCase) return;
                const updatedChild = { ...childCase, status: 'PENDING', mergedInto: null, history: [...childCase.history, { date: getLocalISODate(), author: `系統`, content: `解除併案，恢復獨立辦理`, type: 'SYS' }] };
                const cleanChild = JSON.parse(JSON.stringify(updatedChild));
                setCases(prev => prev.map(c => c.id === childId ? cleanChild : c));
                if(selectedCase && selectedCase.id === parentId) setSelectedCase({...selectedCase});
                if (window.fbStandaloneDb) { try { const { setDoc, doc } = window.FirebaseModules; await setDoc(doc(window.fbStandaloneDb, collectionName, childId), cleanChild); } catch (err) {} }
            };

            const totalNotices = overdueCases.length + closingNotices.length;

            const handleExportExcel = () => {
                const ws = XLSX.utils.json_to_sheet(cases.map(c => ({
                    '案件編號': c.id, '案件類型': c.caseType === 'SPECIAL' ? '特殊交辦' : '一般案件',
                    '案件類別': c.category === 'OTHER' ? c.extData?.customCategory || '其他' : c.category,
                    '狀態': c.status === 'CLOSED' ? '已結案' : c.status === 'MERGED' ? '已併案' : '辦理中',
                    '行政區': c.location?.district || '', '詳細地點': c.location?.address || '',
                    '陳情人/主政單位': c.petitioner?.name || '', '案件內容': c.content || '',
                    '收文/收件日期': c.extData?.receiveDate || '', '會勘時間': formatDateTime(c.extData?.surveyDate),
                    '派工日期': c.extData?.dispatchDate || '', '實際結案日期': c.extData?.completionDate || '',
                    '結案期限': c.extData?.completionDeadline || '', '承辦人': c.extData?.assignee || '', '備註': c.extData?.note || ''
                })));
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "案件清單");
                XLSX.writeFile(wb, `案件列管清單_${getLocalISODate()}.xlsx`);
                setShowSettings(false);
            };

            const handleExportJSON = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(cases, null, 2));
                const a = document.createElement('a'); a.href = dataStr; a.download = `案件備份_${getLocalISODate()}.json`;
                document.body.appendChild(a); a.click(); a.remove(); setShowSettings(false);
            };

            const handleImportJSON = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (event) => {
                    try {
                        const importedCases = JSON.parse(event.target.result);
                        if (Array.isArray(importedCases)) {
                            const sortedCases = sortCases(importedCases); setCases(sortedCases);
                            if (window.fbStandaloneDb) {
                                const { setDoc, doc } = window.FirebaseModules;
                                for (const c of sortedCases) { await setDoc(doc(window.fbStandaloneDb, collectionName, c.id), c); }
                            }
                            setSysModal({
                                isOpen: true, title: '匯入成功', content: `已成功匯入還原 ${sortedCases.length} 筆案件資料${window.fbStandaloneDb ? '，並已同步至雲端' : ' (目前為單機儲存模式)'}。`,
                                actions: <button onClick={() => setSysModal({ isOpen: false })} className="w-full px-4 py-3 bg-primary text-white rounded-xl font-bold">確認</button>
                            });
                        }
                    } catch (err) {
                        setSysModal({
                            isOpen: true, title: '匯入失敗', content: `檔案格式錯誤，無法正確解析備份檔。`,
                            actions: <button onClick={() => setSysModal({ isOpen: false })} className="w-full px-4 py-3 bg-red-500 text-white rounded-xl font-bold">確認</button>
                        });
                    }
                };
                reader.readAsText(file); setShowSettings(false); e.target.value = null;
            };

            return (
                <div className="theme-app h-[100dvh] w-screen overflow-hidden flex flex-col md:flex-row bg-surface">
                    <Modal {...sysModal} />
                    <ThemeSettingsModal
                        isOpen={showThemeModal}
                        onClose={() => setShowThemeModal(false)}
                        themeConfig={themeConfig}
                        onUpdateTheme={setThemeConfig}
                        onResetTheme={() => setThemeConfig(THEME_PRESETS[0])}
                    />
                    <FirebaseConfigModal 
                        isOpen={showFbModal} 
                        onClose={() => setShowFbModal(false)} 
                        currentConfig={fbConfig} 
                        onSave={handleSaveFbConfig} 
                        onClear={handleClearFbConfig} 
                    />
                    <aside className="theme-sidebar hidden md:flex w-72 bg-white border-r border-slate-100 flex-col shrink-0 z-20">
                        <div className="p-8 pb-4">
                            <div className="w-12 h-12 bg-primary text-white rounded-2xl flex items-center justify-center mb-6 shadow-float"><Icons.Folder /></div>
                            <h1 className="text-2xl font-black tracking-tight text-slate-800">列管案件管理</h1>
                        </div>
                        <nav className="flex-1 p-5 space-y-3 mt-2">
                            <button onClick={() => setView('LIST')} className={`w-full flex items-center gap-3 px-5 py-4 rounded-2xl transition-all font-bold text-sm ${view === 'LIST' ? 'bg-indigo-50 text-primary shadow-sm' : 'text-slate-500 hover:bg-slate-50 hover:text-slate-800'}`}><Icons.List /> 案件清單</button>
                            <button onClick={() => setView('MAP')} className={`w-full flex items-center gap-3 px-5 py-4 rounded-2xl transition-all font-bold text-sm ${view === 'MAP' ? 'bg-indigo-50 text-primary shadow-sm' : 'text-slate-500 hover:bg-slate-50 hover:text-slate-800'}`}><Icons.MapIcon /> 地圖檢視</button>
                            <button onClick={() => setView('SPECIAL_LIST')} className={`w-full flex items-center gap-3 px-5 py-4 rounded-2xl transition-all font-bold text-sm ${view === 'SPECIAL_LIST' ? 'bg-red-500 text-white shadow-md' : 'bg-red-50 text-red-600 hover:bg-red-100'}`}><Icons.Alert /> 特殊交辦案件</button>
                        </nav>
                        <div className="p-6 pb-8 space-y-3">
                             <button onClick={() => setView('CREATE')} className="w-full flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-900 text-white py-4 rounded-2xl font-bold shadow-float"><Icons.Plus /> 新增一般案件</button>
                            <button onClick={() => setView('CREATE_SPECIAL')} className="w-full flex items-center justify-center gap-2 bg-red-600 hover:bg-red-700 text-white py-4 rounded-2xl font-bold shadow-float"><Icons.Star /> 新增特殊交辦</button>
                        </div>
                    </aside>
                    
                    <main className="flex-1 flex flex-col min-w-0 mb-16 md:mb-0 h-full overflow-hidden relative">
                        <header className="bg-transparent px-6 md:px-10 py-6 flex justify-between items-center z-[60] shrink-0">
                            <h2 className="text-2xl font-black text-slate-800 tracking-tight">{view === 'LIST' && '案件清單總覽'}{view === 'SPECIAL_LIST' && '特殊交辦清單'}{view === 'CREATE' && '建立一般案件'}{view === 'CREATE_SPECIAL' && '建立特殊交辦'}{view === 'DETAIL' && '案件處理進度'}{view === 'MAP' && '案件空間分布'}</h2>
                            <div className="flex items-center gap-2 md:gap-3">
                                <button 
                                    onClick={() => setShowFbModal(true)} 
                                    title="點擊設定雲端資料庫 (Firebase)"
                                    className="hidden md:flex items-center gap-2 px-3.5 py-2 rounded-full bg-white hover:bg-slate-50 shadow-soft text-xs font-bold border border-slate-100 transition-all cursor-pointer"
                                >
                                    {syncStatus === 'CONNECTING' && <><span className="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span><span className="text-slate-500">雲端連線中...</span></>}
                                    {syncStatus === 'SYNCED' && <><span className="w-2 h-2 rounded-full bg-emerald-500"></span><span className="text-emerald-700">雲端已同步</span></>}
                                    {syncStatus === 'LOCAL_ONLY' && <><span className="w-2 h-2 rounded-full bg-slate-400"></span><span className="text-slate-600">單機模式 (點擊設定雲端)</span></>}
                                    {syncStatus === 'ERROR' && <><span className="w-2 h-2 rounded-full bg-rose-500"></span><span className="text-rose-600">連線失敗 (點擊重設)</span></>}
                                </button>

                                <button 
                                    onClick={() => { setShowThemeModal(true); setShowNotifications(false); setShowSettings(false); }} 
                                    title="面板風格與配色設定"
                                    className="p-3 rounded-2xl bg-white text-slate-500 shadow-soft hover:text-primary hover:bg-indigo-50 transition-all flex items-center gap-1.5"
                                >
                                    <Icons.Palette />
                                    <span className="hidden lg:inline text-xs font-bold">風格切換</span>
                                </button>
                                
                                <div className="relative">
                                    <button onClick={() => { setShowNotifications(!showNotifications); setShowSettings(false); }} className={`relative p-3 rounded-2xl transition-all ${showNotifications ? 'bg-indigo-100 text-primary shadow-inner' : 'bg-white text-slate-400 shadow-soft hover:text-primary hover:bg-indigo-50'}`}><Icons.Bell />{totalNotices > 0 && (<span className="absolute -top-1 -right-1 w-5 h-5 bg-red-500 text-white text-[10px] font-black rounded-full flex items-center justify-center border-2 border-white shadow-sm">{totalNotices}</span>)}</button>
                                    {showNotifications && (
                                        <>
                                            <div className="fixed inset-0 z-40" onClick={() => setShowNotifications(false)}></div>
                                            <div className="absolute right-0 mt-3 w-[calc(100vw-3rem)] md:w-96 bg-white rounded-3xl shadow-float border border-slate-100 overflow-hidden z-50 animate-fade-in origin-top-right flex flex-col max-h-[80vh]">
                                                <div className="overflow-y-auto flex-1 w-full">
                                                    {overdueCases.length > 0 && (
                                                        <div>
                                                            <div className="bg-rose-50/90 backdrop-blur-md px-5 py-4 border-b border-rose-100 sticky top-0 z-10 shadow-sm"><h3 className="font-black text-rose-700 text-sm flex items-center gap-2"><Icons.Alert /> 取號逾期 / 今日到期 ({overdueCases.length})</h3></div>
                                                            <div className="divide-y divide-slate-50 bg-white">
                                                                {overdueCases.map(c => (
                                                                    <div key={c.id} onClick={() => { handleSelectCase(c); setShowNotifications(false); }} className="p-5 hover:bg-rose-50/30 cursor-pointer transition-colors group relative">
                                                                        <button onClick={(e) => dismissNotice(e, c.id, 'RECORD')} className="absolute top-4 right-4 text-rose-300 hover:text-rose-600 hover:bg-rose-100 rounded-full w-7 h-7 flex items-center justify-center font-bold transition-colors z-20" title="取消提醒">✕</button>
                                                                        <div className="font-bold text-slate-800 text-sm group-hover:text-rose-600 transition-colors pr-8 mb-2 leading-snug line-clamp-2">{c.caseType === 'SPECIAL' ? c.content : `${c.location?.district || ''} - ${c.location?.address || ''}`}</div><div className="text-xs flex justify-between items-center"><span className="bg-slate-100 text-slate-500 px-2 py-1 rounded-md font-medium">期限: {c.extData.recordDeadline}</span><span className={`${c.isToday ? 'text-amber-500' : 'text-rose-500'} font-bold flex items-center gap-1`}>{c.isToday ? '今日到期' : '已逾期'}</span></div>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    )}
                                                    {closingNotices.length > 0 && (
                                                        <div className={overdueCases.length > 0 ? "border-t-4 border-slate-100" : ""}>
                                                            <div className="bg-amber-50/90 backdrop-blur-md px-5 py-4 border-b border-amber-100 sticky top-0 z-10 shadow-sm"><h3 className="font-black text-amber-700 text-sm flex items-center gap-2"><Icons.Clock /> 結案即將到期 ({closingNotices.length})</h3></div>
                                                            <div className="divide-y divide-slate-50 bg-white">
                                                                {closingNotices.map(c => (
                                                                    <div key={c.id} onClick={() => { handleSelectCase(c); setShowNotifications(false); }} className="p-5 hover:bg-amber-50/30 cursor-pointer transition-colors group relative">
                                                                        <button onClick={(e) => dismissNotice(e, c.id, 'CLOSING')} className="absolute top-4 right-4 text-slate-300 hover:text-amber-600 hover:bg-amber-100 rounded-full w-7 h-7 flex items-center justify-center font-bold transition-colors z-20" title="取消提醒">✕</button>
                                                                        <div className="font-bold text-slate-800 text-sm group-hover:text-amber-600 transition-colors pr-8 mb-2 leading-snug line-clamp-2">{c.caseType === 'SPECIAL' ? c.content : `${c.location?.district || ''} - ${c.location?.address || ''}`}</div><div className="text-xs flex justify-between items-center"><span className="bg-slate-100 text-slate-500 px-2 py-1 rounded-md font-medium">期限: {c.extData.completionDeadline}</span><span className={`${c.daysLeft < 0 ? 'text-rose-500' : 'text-amber-500'} font-bold flex items-center gap-1`}>{c.daysLeft < 0 ? '已逾期' : `剩餘 ${c.daysLeft} 天`}</span></div>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    )}
                                                    {totalNotices === 0 && (<div className="p-10 text-center flex flex-col items-center gap-3"><div className="w-12 h-12 bg-emerald-50 text-emerald-500 rounded-full flex items-center justify-center"><Icons.Check /></div><span className="text-sm text-slate-400 font-bold">目前無任何待辦通知 🎉</span></div>)}
                                                </div>
                                            </div>
                                        </>
                                    )}
                                </div>
                                
                                <div className="relative">
                                    <button onClick={() => { setShowSettings(!showSettings); setShowNotifications(false); }} className={`relative p-3 rounded-2xl transition-all ${showSettings ? 'bg-slate-100 text-slate-700 shadow-inner' : 'bg-white text-slate-400 shadow-soft hover:text-slate-700 hover:bg-slate-50'}`}>
                                        <Icons.Menu />
                                    </button>
                                    {showSettings && (
                                        <>
                                            <div className="fixed inset-0 z-40" onClick={() => setShowSettings(false)}></div>
                                            <div className="absolute right-0 mt-3 w-56 bg-white rounded-2xl shadow-float border border-slate-100 overflow-hidden z-50 animate-fade-in origin-top-right flex flex-col p-2 gap-1">
                                                <button onClick={() => { setShowThemeModal(true); setShowSettings(false); }} className="flex items-center gap-2 px-3 py-2.5 text-sm text-primary font-bold hover:bg-indigo-50 rounded-xl transition-colors">
                                                    <Icons.Palette /> 面板風格與配色
                                                </button>
                                                <button onClick={() => { setShowFbModal(true); setShowSettings(false); }} className="flex items-center gap-2 px-3 py-2.5 text-sm text-indigo-600 font-bold hover:bg-indigo-50 rounded-xl transition-colors">
                                                    <Icons.Cloud /> 雲端設定 (Firebase)
                                                </button>
                                                <div className="h-px bg-slate-100 my-1 mx-2"></div>
                                                <button onClick={handleExportExcel} className="flex items-center gap-2 px-3 py-2.5 text-sm text-slate-700 font-bold hover:bg-emerald-50 hover:text-emerald-600 rounded-xl transition-colors"><Icons.FileText /> 匯出清單 (Excel)</button>
                                                <div className="h-px bg-slate-100 my-1 mx-2"></div>
                                                <button onClick={handleExportJSON} className="flex items-center gap-2 px-3 py-2.5 text-sm text-slate-700 font-bold hover:bg-blue-50 hover:text-blue-600 rounded-xl transition-colors"><Icons.Download /> 下載備份 (JSON)</button>
                                                <button onClick={() => fileInputRef.current.click()} className="flex items-center gap-2 px-3 py-2.5 text-sm text-slate-700 font-bold hover:bg-amber-50 hover:text-amber-600 rounded-xl transition-colors"><Icons.Upload /> 匯入還原 (JSON)</button>
                                                <input type="file" accept=".json" className="hidden" ref={fileInputRef} onChange={handleImportJSON} />
                                            </div>
                                        </>
                                    )}
                                </div>
                            </div>
                        </header>
                        
                        <div className="flex-1 px-4 md:px-10 pb-4 md:pb-10 overflow-hidden flex flex-col">
                            {view === 'MAP' && <CaseMap cases={cases} onSelectCase={handleSelectCase} />}
                            {view === 'LIST' && <CaseList cases={cases} onSelectCase={handleSelectCase} activeTab={activeListTab} onTabChange={setActiveListTab} config={config} isSpecialMode={false} />}
                            {view === 'SPECIAL_LIST' && <CaseList cases={cases} onSelectCase={handleSelectCase} activeTab={activeListTab} onTabChange={setActiveListTab} config={config} isSpecialMode={true} />}
                            {view === 'CREATE' && <CaseForm onSubmit={handleCreateCase} onCancel={() => setView('LIST')} isSpecialMode={false} />}
                            {view === 'CREATE_SPECIAL' && <CaseForm onSubmit={handleCreateCase} onCancel={() => setView('SPECIAL_LIST')} isSpecialMode={true} />}
                            {view === 'DETAIL' && selectedCase && <CaseDetail caseData={selectedCase} allCases={cases} onBack={() => setView(selectedCase.caseType === 'SPECIAL' ? 'SPECIAL_LIST' : 'LIST')} onSelectCase={handleSelectCase} onUpdateStatus={handleUpdateStatus} onDelete={handleDeleteCase} onEditHistory={handleEditHistory} onUpdateBasicInfo={handleUpdateBasicInfo} onMergeCase={handleMergeCase} onUnmergeCase={handleUnmergeCase} />}
                        </div>
                    </main>
                    
                    <nav className="md:hidden fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-slate-100 flex justify-around p-2 z-[60] shadow-[0_-10px_40px_rgba(0,0,0,0.05)]">
                         <button onClick={() => setView('LIST')} className={`flex flex-col items-center p-2 rounded-xl transition-colors ${view === 'LIST' ? 'text-primary' : 'text-slate-400'}`}><Icons.List /><span className="text-[10px] font-bold mt-1">一般案件</span></button>
                         <button onClick={() => setView('MAP')} className={`flex flex-col items-center p-2 rounded-xl transition-colors ${view === 'MAP' ? 'text-primary' : 'text-slate-400'}`}><Icons.MapIcon /><span className="text-[10px] font-bold mt-1">地圖</span></button>
                         <button onClick={() => setView('CREATE')} className="flex flex-col items-center p-2 rounded-xl transition-colors text-slate-400 active:text-primary"><div className="w-10 h-10 -mt-6 bg-slate-800 text-white rounded-full flex items-center justify-center shadow-float border-4 border-white"><Icons.Plus /></div><span className="text-[10px] font-bold mt-1">新增案件</span></button>
                         <button onClick={() => setView('SPECIAL_LIST')} className={`flex flex-col items-center p-2 rounded-xl transition-colors ${view === 'SPECIAL_LIST' ? 'text-red-500' : 'text-slate-400'}`}><Icons.Alert /><span className="text-[10px] font-bold mt-1">特殊交辦</span></button>
                    </nav>
                </div>
            );
        };

        const App = () => { return <CaseManagementSystem />; };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
