                                                <label className="text-sm font-medium text-slate-600 px-1">行政區</label>
                                                <select className="w-full rounded-2xl px-4 py-3.5" value={formData.district} onChange={e => { setFormData({...formData, district: e.target.value}); setUserDragged(false); }}>
                                                    {TAOYUAN_DISTRICTS.map(d => <option key={d} value={d}>{d}</option>)}
                                                </select>
                                            </div>
                                            <div className="md:col-span-2 space-y-1.5">
                                                <label className="text-sm font-medium text-slate-600 px-1">詳細地點 (路口/地址)</label>
                                                <input required type="text" className="w-full rounded-2xl px-4 py-3.5" placeholder="例如：中正路與力行路口" value={formData.address} onChange={e => { setFormData({...formData, address: e.target.value}); setUserDragged(false); }} />
                                                <div className="mt-3 relative rounded-2xl overflow-hidden border border-slate-200 w-full shadow-inner">
                                                    <div className="absolute top-2 left-2 z-10 bg-white/95 px-3 py-1.5 rounded-lg text-xs font-bold shadow-sm text-slate-600 pointer-events-none">
                                                        {isLocating ? <span className="animate-pulse text-indigo-500">自動定位中...</span> : '📍 可直接拖曳紅點微調位置（底部可上下拉伸高度）'}
                                                    </div>
                                                    <LocationPicker lat={coords.lat} lng={coords.lng} onChange={(lat,lng) => { setCoords({lat,lng}); setUserDragged(true); }} defaultHeight={340} />
                                                </div>
                                            </div>
                                            {/* A1事故：無陳情內容(會勘事由)欄位 */}
                                            {formData.category !== 'A1' && (
                                                <div className="md:col-span-2 space-y-1.5">
                                                    <label className="text-sm font-medium text-slate-600 px-1">陳情內容 (會勘事由)</label>
                                                    <textarea required rows="3" className="w-full rounded-3xl px-4 py-4" placeholder="簡述案件狀況..." value={formData.content} onChange={e => setFormData({...formData, content: e.target.value})}></textarea>
                                                </div>
                                            )}
                                        </>
                                    )}
                                    <div className="md:col-span-2 space-y-1.5"><label className="text-sm font-medium text-slate-600 px-1">備註 (選填)</label><textarea rows="2" className="w-full rounded-2xl px-4 py-3" placeholder="其他補充事項..." value={formData.extData.note} onChange={e => handleExtData('note', e.target.value)}></textarea></div>
                                </div>
                            </section>

                            {/* 依類別呈現對應的下方區塊 */}
                            {!isSpecialMode && formData.category === 'REPLY' ? (
                                <section>
                                    <h3 className="text-sm font-bold text-cyan-600 uppercase tracking-wider mb-5 px-1">回復與承辦資訊</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-5 bg-cyan-50/50 p-6 rounded-3xl border border-cyan-100">
                                        <div className="space-y-1.5">
                                            <label className="text-sm font-medium text-slate-600 px-1">承辦人</label>
                                            <input type="text" className="w-full rounded-2xl px-4 py-3.5 bg-white border-slate-200" placeholder="承辦人員姓名" value={formData.extData.assignee} onChange={e => handleExtData('assignee', e.target.value)} />
                                        </div>
                                        <div className="space-y-1.5">
                                            <label className="text-sm font-medium text-slate-600 px-1">回復文號</label>
                                            <input type="text" className="w-full rounded-2xl px-4 py-3.5 bg-white border-slate-200" placeholder="輸入回復文號" value={formData.extData.surveyDocNo} onChange={e => { handleExtData('surveyDocNo', e.target.value); handleExtData('replyDocNo', e.target.value); }} />
                                        </div>
                                        <div className="space-y-1.5">
                                            <label className="text-sm font-medium text-slate-600 px-1">回復日期 (選填)</label>
                                            <input type="date" className="w-full rounded-2xl px-4 py-3.5 bg-white border-slate-200" value={formData.extData.replyDate} onChange={e => { const val = e.target.value; handleExtData('replyDate', val); if (val) handleExtData('completionDeadline', calculateMonthsDeadline(val, 2)); }} />
                                        </div>
                                        <div className="space-y-1.5">
                                            <label className="text-xs font-bold text-cyan-700 px-1 block">結案期限 (+2個月)</label>
                                            <input type="date" className="w-full rounded-2xl px-4 py-3.5 bg-white border border-cyan-200 text-cyan-700" value={formData.extData.completionDeadline} onChange={e => handleExtData('completionDeadline', e.target.value)} />
                                        </div>
                                    </div>
                                </section>
                            ) : !isSpecialMode && formData.category === 'FORWARD' ? (
                                <section>
                                    <h3 className="text-sm font-bold text-purple-600 uppercase tracking-wider mb-5 px-1">函轉資訊 (建立即直接結案)</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-5 bg-purple-50/50 p-6 rounded-3xl border border-purple-100">
                                        <div className="space-y-1.5">
                                            <label className="text-sm font-medium text-slate-600 px-1">承辦人</label>
                                            <input type="text" className="w-full rounded-2xl px-4 py-3.5 bg-white border-slate-200" placeholder="承辦人員姓名" value={formData.extData.assignee} onChange={e => handleExtData('assignee', e.target.value)} />
                                        </div>
                                        <div className="space-y-1.5">
                                            <label className="text-sm font-medium text-slate-600 px-1">函轉單位</label>
                                            <input type="text" className="w-full rounded-2xl px-4 py-3.5 bg-white border-slate-200" placeholder="輸入轉往之權責單位" value={formData.extData.forwardUnit || ''} onChange={e => handleExtData('forwardUnit', e.target.value)} />
                                        </div>
                                        <div className="space-y-1.5 md:col-span-2">
                                            <label className="text-sm font-medium text-slate-600 px-1">函轉文號</label>
                                            <input type="text" className="w-full rounded-2xl px-4 py-3.5 bg-white border-slate-200" placeholder="輸入函轉文號" value={formData.extData.surveyDocNo} onChange={e => handleExtData('surveyDocNo', e.target.value)} />
                                        </div>
                                    </div>
                                </section>
                            ) : !isSpecialMode ? (
                                <section>
                                    <h3 className="text-sm font-bold text-primary uppercase tracking-wider mb-5 px-1">會勘與承辦資訊</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-5 bg-indigo-50/50 p-6 rounded-3xl border border-indigo-100">
                                        <div className="space-y-1.5">
                                            <label className="text-sm font-medium text-slate-600 px-1">承辦人</label>
                                            <input type="text" className="w-full rounded-2xl px-4 py-3.5 bg-white border-slate-200" placeholder="承辦人員姓名" value={formData.extData.assignee} onChange={e => handleExtData('assignee', e.target.value)} />
                                        </div>
                                        <div className="space-y-1.5">
                                            <label className="text-sm font-medium text-slate-600 px-1">{formData.category === 'A1' ? '會勘通知文號 (分局來文)' : '會勘通知文號'}</label>
                                            <input type="text" className="w-full rounded-2xl px-4 py-3.5 bg-white border-slate-200" placeholder="例如：桃交工字第1150077774號" value={formData.extData.surveyDocNo} onChange={e => handleExtData('surveyDocNo', e.target.value)} />
                                        </div>
                                        <div className="space-y-1.5 md:col-span-2">
                                            <label className="text-sm font-medium text-slate-600 px-1">會勘時間</label>
                                            <input type="datetime-local" className="w-full rounded-2xl px-4 py-3.5 bg-white border-slate-200" value={getDatetimeLocal(formData.extData.surveyDate)} onChange={e => {
                                                const val = e.target.value;
                                                handleExtData('surveyDate', val);
                                                if (!['A1', 'OTHER_UNIT'].includes(formData.category)) {
                                                    handleExtData('recordDeadline', calculateWorkingDays(val, 3));
                                                } else {
                                                    handleExtData('recordDeadline', '');
                                                }
                                                handleExtData('completionDeadline', calculateMonthsDeadline(val, formData.category === 'A1' ? 1 : 2));
                                            }} />
                                        </div>
                                        {!['A1', 'OTHER_UNIT'].includes(formData.category) && (
                                            <div className="space-y-1.5">
                                                <label className="text-xs font-bold text-indigo-600 px-1">紀錄取號期限 (+3工作日)</label>
                                                <input type="date" className="w-full rounded-xl px-3 py-2.5 bg-white border border-indigo-200" value={formData.extData.recordDeadline} onChange={e => handleExtData('recordDeadline', e.target.value)} />
                                            </div>
                                        )}
                                        <div className={`space-y-1.5 ${['A1', 'OTHER_UNIT'].includes(formData.category) ? 'md:col-span-2' : ''}`}>
                                            <label className="text-xs font-bold text-indigo-600 px-1">結案期限 (+{formData.category === 'A1' ? '1' : '2'}個月)</label>
                                            <input type="date" className="w-full rounded-xl px-3 py-2.5 bg-white border border-indigo-200" value={formData.extData.completionDeadline} onChange={e => handleExtData('completionDeadline', e.target.value)} />
                                        </div>
                                    </div>
                                </section>
                            ) : null}

                            <div className="flex gap-4 pt-4 border-t border-slate-100 mt-8">
                                <button type="submit" disabled={isSubmitting} className={`flex-1 text-white py-4 rounded-2xl font-bold text-lg shadow-float transition-all ${isSubmitting ? 'bg-slate-300' : themeBtn}`}>
                                    {isSubmitting ? '處理中...' : (formData.category === 'FORWARD' ? '立案並直接結案' : '確認立案')}
                                </button>
                                <button type="button" onClick={onCancel} className="flex-1 bg-white border-2 border-slate-200 text-slate-500 hover:text-slate-800 hover:bg-slate-50 py-4 rounded-2xl font-bold text-lg transition-all">取消返回</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        const CH_NUMS = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
        const getDefaultStageName = (idx) => idx < 10 ? `第${CH_NUMS[idx]}階段` : `第${idx + 1}階段`;

        const CaseDetail = ({ caseData, allCases, onBack, onUpdateStatus, onDelete, onEditHistory, onUpdateBasicInfo, onMergeCase, onUnmergeCase, onSelectCase }) => {
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [modalConfig, setModalConfig] = useState({ isOpen: false });
            const isSpecialMode = caseData.caseType === 'SPECIAL';
            const isReplyMode = !isSpecialMode && caseData.category === 'REPLY';
            const isForwardMode = !isSpecialMode && caseData.category === 'FORWARD';
            const isA1Mode = !isSpecialMode && caseData.category === 'A1';
            const isOtherUnitMode = !isSpecialMode && caseData.category === 'OTHER_UNIT';
            const [editingHistoryIdx, setEditingHistoryIdx] = useState(null);
            const [editingHistoryContent, setEditingHistoryContent] = useState('');

            // 多階段管理狀態
            const [activeStageIdx, setActiveStageIdx] = useState(0);
            const [editingStageNameIdx, setEditingStageNameIdx] = useState(null);
            const [editingStageNameVal, setEditingStageNameVal] = useState('');

            // 正規化階段陣列（若舊案件無 stages 則自動將第一階段包裝生成）
            const stages = useMemo(() => {
                if (Array.isArray(caseData.stages) && caseData.stages.length > 0) {
                    return caseData.stages.map((s, idx) => ({
                        ...s,
                        name: s.name || getDefaultStageName(idx),
                        content: s.content !== undefined ? s.content : (idx === 0 ? (caseData.content || '') : ''),
                        petitionerName: s.petitionerName !== undefined ? s.petitionerName : (idx === 0 ? (caseData.petitioner?.name || '') : ''),
                        extData: { ...(s.extData || (idx === 0 ? caseData.extData : {}) || {}) }
                    }));
                }
                return [{
                    id: 'STAGE_1',
                    name: '第一階段',
                    createdAt: caseData.createdAt || getLocalISODate(),
                    content: caseData.content || '',
                    petitionerName: caseData.petitioner?.name || '',
                    extData: { ...(caseData.extData || {}) }
                }];
            }, [caseData]);

            const safeStageIdx = activeStageIdx < stages.length ? activeStageIdx : 0;
            const currentStage = stages[safeStageIdx] || stages[0];

            const [isEditingAddress, setEditingAddress] = useState(false);
            const [editedAddress, setEditedAddress] = useState('');
            const [editedDistrict, setEditedDistrict] = useState('');
            const [editCoords, setEditCoords] = useState({ lat: 24.9936, lng: 121.3009 });
            const [userDragged, setUserDragged] = useState(false);
            const [isLocating, setIsLocating] = useState(false);

            const [isEditingContent, setEditingContent] = useState(false);
            const [editedContent, setEditedContent] = useState('');

            const [isEditingBasicInfo, setEditingBasicInfo] = useState(false);
            const [editBasicInfoData, setEditBasicInfoData] = useState({ receiveDate: '', assignee: '', surveyDocNo: '', petitionerName: '', hostUnit: '', forwardUnit: '' });
            
            const [showMergePanel, setShowMergePanel] = useState(false);
            const [mergeSearchText, setMergeSearchText] = useState('');

            const [editExtData, setEditExtData] = useState({
                receiveDate: '', surveyDate: '', recordDeadline: '', recordActualDate: '', recordDocNo: '', surveyResolution: '', dispatchDate: '', completionDate: '', completionDeadline: '', noDispatchRequired: false,
                assignDate: '', handlingStatus: '', assignee: '', replyDate: '', replyDocNo: '', replyContent: '', note: '', forwardUnit: '', hostUnit: '', customCategory: ''
            });

            // 切換案件時預設顯示最新階段
            useEffect(() => {
                const count = Array.isArray(caseData.stages) && caseData.stages.length > 0 ? caseData.stages.length : 1;
                setActiveStageIdx(count - 1);
                setEditingStageNameIdx(null);
            }, [caseData.id]);

            // 當切換階段或案件資料更新時，載入該階段對應欄位
            useEffect(() => {
                setEditedAddress(caseData.location?.address || '');
                setEditedDistrict(caseData.location?.district || '桃園區');
                setEditCoords({ lat: caseData.location?.lat || DISTRICT_COORDS[caseData.location?.district]?.lat || 24.9936, lng: caseData.location?.lng || DISTRICT_COORDS[caseData.location?.district]?.lng || 121.2238 });
                setUserDragged(false);

                const stExt = currentStage?.extData || {};
                const stContent = currentStage?.content !== undefined ? currentStage.content : (safeStageIdx === 0 ? (caseData.content || '') : '');
                const stPetitioner = currentStage?.petitionerName !== undefined ? currentStage.petitionerName : (safeStageIdx === 0 ? (caseData.petitioner?.name || '') : '');

                setEditedContent(stContent);
                setEditBasicInfoData({
                    receiveDate: stExt.receiveDate || '',
                    assignee: stExt.assignee || '',
                    surveyDocNo: stExt.surveyDocNo || stExt.replyDocNo || '',
                    petitionerName: stPetitioner,
                    hostUnit: stExt.hostUnit || '',
                    forwardUnit: stExt.forwardUnit || ''
                });
                setEditExtData({
                    receiveDate: stExt.receiveDate || '',
                    surveyDate: stExt.surveyDate || '',
                    recordDeadline: stExt.recordDeadline || '',
                    recordActualDate: stExt.recordActualDate || '',
                    recordDocNo: stExt.recordDocNo || '',
                    surveyResolution: stExt.surveyResolution || '',
                    dispatchDate: stExt.dispatchDate || '',
                    completionDate: stExt.completionDate || '',
                    completionDeadline: stExt.completionDeadline || '',
                    noDispatchRequired: stExt.noDispatchRequired || false,
                    assignDate: stExt.assignDate || '',
                    handlingStatus: stExt.handlingStatus || '',
                    assignee: stExt.assignee || '',
                    replyDate: stExt.replyDate || '',
                    replyDocNo: stExt.replyDocNo || stExt.surveyDocNo || '',
                    replyContent: stExt.replyContent || '',
                    note: stExt.note || '',
                    forwardUnit: stExt.forwardUnit || '',
                    hostUnit: stExt.hostUnit || '',
                    customCategory: stExt.customCategory || caseData.extData?.customCategory || ''
                });
                setEditingBasicInfo(false);
                setEditingContent(false);
            }, [caseData.id, caseData, safeStageIdx]);

            useEffect(() => {
                if (!isEditingAddress || !editedAddress || userDragged) return;
                const timer = setTimeout(async () => {
                    setIsLocating(true);
                    const newCoords = await advancedGeocode(editedDistrict, editedAddress);
                    if (newCoords) setEditCoords(newCoords); else if (!userDragged) setEditCoords(DISTRICT_COORDS[editedDistrict] || DISTRICT_COORDS['桃園區']);
                    setIsLocating(false);
                }, 800);
                return () => clearTimeout(timer);
            }, [editedAddress, editedDistrict, isEditingAddress, userDragged]);

            const closeM = () => setModalConfig({ isOpen: false });

            // 整合各階段資料以同步回主案件 (保留第一階段基本資料，並將最新階段有填寫的進度同步至外層列表)
            const buildRootExtFromStages = (updatedStages) => {
                const baseExt = { ...(caseData.extData || {}), ...(updatedStages[0]?.extData || {}) };
                for (let i = 1; i < updatedStages.length; i++) {
                    const sExt = updatedStages[i]?.extData || {};
                    Object.keys(sExt).forEach(k => {
                        if (sExt[k] !== '' && sExt[k] !== null && sExt[k] !== undefined) {
                            baseExt[k] = sExt[k];
                        }
                    });
                }
                return baseExt;
            };

            // 開設下一階段
            const handleAddNextStage = async () => {
                const nextIdx = stages.length;
                const newStageName = getDefaultStageName(nextIdx);
                const newStage = {
                    id: 'STAGE_' + Date.now() + '_' + nextIdx,
                    name: newStageName,
                    createdAt: getLocalISODate(),
                    content: '',
                    petitionerName: '',
                    extData: {
                        receiveDate: '',
                        surveyDate: '',
                        surveyDocNo: '',
                        assignee: '',
                        recordDeadline: '',
                        recordActualDate: '',
                        recordDocNo: '',
                        surveyResolution: '',
                        dispatchDate: '',
                        completionDate: '',
                        completionDeadline: '',
                        noDispatchRequired: false,
                        assignDate: '',
                        handlingStatus: '',
                        replyDate: '',
                        replyDocNo: '',
                        replyContent: '',
                        note: '',
                        forwardUnit: '',
                        hostUnit: '',
                        customCategory: caseData.extData?.customCategory || ''
                    }
                };
                const updatedStages = [...stages, newStage];
                const updatedHistory = [
                    ...(caseData.history || []),
                    { date: getLocalISODate(), author: '承辦人員', content: `開設「${newStageName}」`, type: 'STAFF' }
                ];
                await onUpdateBasicInfo(caseData.id, {
                    stages: updatedStages,
                    history: updatedHistory
                });
                setActiveStageIdx(nextIdx);
            };

            // 修改階段名稱
            const handleSaveStageName = async (idx) => {
                const trimmed = editingStageNameVal.trim() || getDefaultStageName(idx);
                const updatedStages = stages.map((s, i) => i === idx ? { ...s, name: trimmed } : s);
                await onUpdateBasicInfo(caseData.id, { stages: updatedStages });
                setEditingStageNameIdx(null);
            };

            // 刪除階段 (僅限第2階段以上)
            const handleDeleteStage = (idx) => {
                if (stages.length <= 1) return;
                const targetStage = stages[idx];
                setModalConfig({
                    isOpen: true,
                    title: `確認刪除「${targetStage?.name || getDefaultStageName(idx)}」`,
                    content: '刪除後該階段填寫的紀錄將移除，確定要刪除此階段嗎？',
                    actions: (
                        <div className="flex gap-3 mt-4">
                            <button onClick={closeM} className="flex-1 px-4 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold">取消</button>
                            <button onClick={async () => {
                                closeM();
                                const updatedStages = stages.filter((_, i) => i !== idx);
                                const nextRootExt = buildRootExtFromStages(updatedStages);
                                await onUpdateBasicInfo(caseData.id, {
                                    stages: updatedStages,
                                    extData: nextRootExt,
                                    content: updatedStages[0]?.content || caseData.content,
                                    petitioner: { name: updatedStages[0]?.petitionerName || '' }
                                });
                                setActiveStageIdx(Math.max(0, idx - 1));
                            }} className="flex-1 px-4 py-3 bg-red-500 hover:bg-red-600 text-white rounded-xl font-bold shadow-md">確認刪除階段</button>
                        </div>
                    )
                });
            };

            const handleExtDataReply = async (stageStatus) => {
                setIsSubmitting(true);
                try {
                    const stName = currentStage?.name || getDefaultStageName(safeStageIdx);
                    let actionText = stageStatus === 'CLOSED' ? `更新【${stName}】資訊並結案` : `更新【${stName}】處理資訊`;
                    if (stageStatus === 'MERGED') actionText = `更新【${stName}】併案內容進度`;
                    let dataToSave = { ...editExtData };
                    if (isReplyMode) {
                        dataToSave.surveyDocNo = dataToSave.replyDocNo || dataToSave.surveyDocNo;
                    }
                    if (isOtherUnitMode) {
                        dataToSave.recordDeadline = '';
                        dataToSave.recordActualDate = '';
                    }
                    if (isSpecialMode && editExtData.handlingStatus && editExtData.handlingStatus.trim() !== '') {
                        actionText = `【${stName} - 辦理情形】${editExtData.handlingStatus}`;
                        dataToSave.handlingStatus = '';
                    }
                    if (stageStatus === 'CLOSED' && !dataToSave.completionDate) dataToSave.completionDate = getLocalISODate();

                    const updatedStages = stages.map((s, i) => i === safeStageIdx ? {
                        ...s,
                        extData: { ...(s.extData || {}), ...dataToSave }
                    } : s);
                    const mergedRootExt = buildRootExtFromStages(updatedStages);
                    if (stageStatus === 'CLOSED' && !mergedRootExt.completionDate) {
                        mergedRootExt.completionDate = dataToSave.completionDate;
                    }

                    const updatedHistory = [
                        ...(caseData.history || []),
                        { date: getLocalISODate(), author: '承辦人員', content: actionText, type: 'STAFF' }
                    ];

                    await onUpdateBasicInfo(caseData.id, {
                        status: stageStatus,
                        stages: updatedStages,
                        extData: mergedRootExt,
                        history: updatedHistory
                    });
                    if (isSpecialMode) setEditExtData(prev => ({ ...prev, handlingStatus: '' }));
                } catch(e) { console.warn(e); } finally { setIsSubmitting(false); }
            };

            const handleRevert = async () => {
                setIsSubmitting(true);
                try { await onUpdateStatus(caseData.id, 'PENDING', '案件恢復為辦理中', caseData.extData); } catch(e) { console.warn(e); } finally { setIsSubmitting(false); }
            };

            const delClick = () => {
                setModalConfig({
                    isOpen: true, title: '確認刪除案件', content: '此動作無法復原，您確定要刪除這筆案件紀錄嗎？',
                    actions: (
                        <div className="flex gap-3 mt-4">
                            <button onClick={closeM} className="flex-1 px-4 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold">取消</button>
                            <button onClick={async () => { closeM(); await onDelete(caseData.id); }} className="flex-1 px-4 py-3 bg-red-500 hover:bg-red-600 text-white rounded-xl font-bold shadow-md">確認刪除</button>
                        </div>
                    )
                });
            };

            const handleSaveAddress = () => {
                onUpdateBasicInfo(caseData.id, { location: { ...caseData.location, address: editedAddress, district: editedDistrict, lat: editCoords.lat, lng: editCoords.lng, isFallback: false } });
                setEditingAddress(false);
            };
            const handleSaveContent = () => {
                const updatedStages = stages.map((s, i) => i === safeStageIdx ? { ...s, content: editedContent } : s);
                const updates = { stages: updatedStages };
                if (safeStageIdx === 0) updates.content = editedContent;
                onUpdateBasicInfo(caseData.id, updates);
                setEditingContent(false);
            };
            const handleSaveBasicInfo = () => {
                const updatedStageExt = {
                    ...(currentStage?.extData || {}),
                    receiveDate: editBasicInfoData.receiveDate,
                    assignee: editBasicInfoData.assignee,
                    surveyDocNo: editBasicInfoData.surveyDocNo,
                    replyDocNo: isReplyMode ? editBasicInfoData.surveyDocNo : (currentStage?.extData?.replyDocNo || ''),
                    hostUnit: editBasicInfoData.hostUnit,
                    forwardUnit: editBasicInfoData.forwardUnit
                };
                const updatedStages = stages.map((s, i) => i === safeStageIdx ? {
                    ...s,
                    petitionerName: editBasicInfoData.petitionerName,
                    extData: updatedStageExt
                } : s);
                const nextRootExt = buildRootExtFromStages(updatedStages);
                const updates = {
                    stages: updatedStages,
                    extData: nextRootExt
                };
                if (safeStageIdx === 0 || editBasicInfoData.petitionerName) {
                    updates.petitioner = { ...caseData.petitioner, name: updatedStages[0]?.petitionerName || editBasicInfoData.petitionerName };
                }
                onUpdateBasicInfo(caseData.id, updates);
                setEditingBasicInfo(false);
            };

            const docNoLabel = isReplyMode ? '回復文號' : isForwardMode ? '函轉文號' : '會勘通知文號';

            const performMerge = (targetCaseId) => {
                setModalConfig({
                    isOpen: true, title: '確認併案', content: '併案後，目前這筆案件將會標示為「已併案」狀態，確定要將它併入所選的案件嗎？',
                    actions: (
                        <div className="flex gap-3 mt-4">
                            <button onClick={closeM} className="flex-1 px-4 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold">取消</button>
                            <button onClick={async () => { closeM(); await onMergeCase(caseData.id, targetCaseId); setShowMergePanel(false); }} className="flex-1 px-4 py-3 bg-primary text-white rounded-xl font-bold shadow-md">確認併入</button>
                        </div>
                    )
                });
            };

            const handleUnmerge = (childId) => {
                setModalConfig({
                    isOpen: true, title: '解除併案', content: '解除後，該案件將恢復為獨立案件 (辦理中)。',
                    actions: (
                        <div className="flex gap-3 mt-4">
                            <button onClick={closeM} className="flex-1 px-4 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold">取消</button>
                            <button onClick={async () => { closeM(); await onUnmergeCase(childId, caseData.id); }} className="flex-1 px-4 py-3 bg-orange-500 text-white rounded-xl font-bold shadow-md">解除併案</button>
                        </div>
                    )
                });
            };

            const themeColor = isSpecialMode ? 'text-red-500' : 'text-primary';
            const themeBtn = isSpecialMode ? 'bg-red-500 hover:bg-red-600' : 'bg-primary hover:bg-indigo-600';
            const childCases = allCases.filter(c => c.mergedInto === caseData.id);
            const mergeCandidates = allCases.filter(c => c.id !== caseData.id && c.status !== 'MERGED' && c.caseType === caseData.caseType && (!mergeSearchText || c.location?.address?.includes(mergeSearchText) || c.content?.includes(mergeSearchText))).slice(0, 5);

            return (
                <div className="h-full flex flex-col xl:flex-row gap-6 overflow-hidden animate-fade-in pb-20 md:pb-0">
                    <Modal {...modalConfig} />
                    
                    <div className="w-full xl:w-5/12 flex flex-col gap-6 overflow-y-auto pr-2 text-sm">
                        <div className="bg-white p-8 rounded-3xl shadow-soft shrink-0 border border-slate-100">
                            <div className="flex justify-between items-center mb-6">
                                <button onClick={onBack} className={`hover:${themeColor} text-slate-400 flex items-center gap-2 text-sm font-bold w-fit px-1`}><Icons.ArrowLeft /> 返回列表</button>
                                <button onClick={delClick} className="text-red-400 hover:text-red-600 hover:bg-red-50 p-2 rounded-xl flex items-center gap-1 text-sm font-bold"><Icons.Trash /> 刪除</button>
                            </div>
                            <div className="flex flex-wrap items-center gap-3 mb-6">
                                <StatusBadge status={caseData.status} />
                                <CategoryBadge category={caseData.category} customName={caseData.extData?.customCategory} />
                                {!isSpecialMode && caseData.location?.district && <span className="bg-slate-100 text-slate-600 px-3 py-1.5 rounded-full text-xs font-bold border border-slate-200">{caseData.location.district}</span>}
                            </div>
                            
                            {isSpecialMode ? (
                                <h2 className="text-2xl font-black text-slate-800 leading-snug mb-2">特殊交辦案件</h2>
                            ) : (
                                <>
                                    <div className="group relative flex flex-col mb-4">
                                        {isEditingAddress ? (
                                            <div className="flex-1 flex flex-col gap-3 animate-fade-in w-full">
                                                <div className="flex flex-col md:flex-row gap-2 items-start md:items-center w-full">
                                                    <select className="w-full md:w-32 rounded-xl px-3 py-2 border border-slate-300 font-bold text-slate-700 bg-white" value={editedDistrict} onChange={e => { setEditedDistrict(e.target.value); setUserDragged(false); }}>{TAOYUAN_DISTRICTS.map(d => <option key={d} value={d}>{d}</option>)}</select>
                                                    <input type="text" className="w-full flex-1 rounded-xl px-3 py-2 border border-slate-300 text-lg font-black text-slate-800" value={editedAddress} onChange={e => { setEditedAddress(e.target.value); setUserDragged(false); }} autoFocus />
                                                    <div className="flex gap-1 shrink-0">
                                                        <button onClick={() => setEditingAddress(false)} className="p-2 text-slate-400 hover:bg-slate-100 rounded-lg" title="取消"><Icons.Undo /></button>
                                                        <button onClick={handleSaveAddress} className="p-2 text-primary hover:bg-indigo-50 rounded-lg" title="儲存定位"><Icons.Check /></button>
                                                    </div>
                                                </div>
                                                <div className="w-full relative rounded-2xl overflow-hidden border border-indigo-200 shadow-inner">
                                                    <div className="absolute top-2 left-2 z-10 bg-white/95 px-2.5 py-1 rounded-lg text-xs font-bold shadow-sm text-primary pointer-events-none">
                                                        {isLocating ? <span className="animate-pulse">自動定位中...</span> : '📍 拖曳紅點可微調座標，完成請點右上角勾選儲存'}
                                                    </div>
                                                    <LocationPicker lat={editCoords.lat} lng={editCoords.lng} onChange={(lat, lng) => { setEditCoords({lat, lng}); setUserDragged(true); }} defaultHeight={320} />
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="flex-1 space-y-3">
                                                <div className="flex items-start justify-between gap-2">
                                                    <h2 className="text-2xl font-black text-slate-800 leading-snug break-all">{caseData.location?.address}</h2>
                                                    {caseData.status !== 'CLOSED' && (
                                                        <button onClick={() => setEditingAddress(true)} className="shrink-0 text-primary bg-indigo-50 hover:bg-indigo-100 px-3 py-1.5 rounded-xl flex items-center gap-1 text-xs font-bold transition-colors"><Icons.Edit /> 修改定位</button>
                                                    )}
                                                </div>
                                                <div className="w-full relative rounded-2xl overflow-hidden border border-slate-200 shadow-inner">
                                                    <div className="absolute top-2 left-2 z-10 bg-white/95 px-2.5 py-1 rounded-lg text-[11px] font-bold shadow-sm text-slate-600 pointer-events-none">
                                                        📍 案件位置檢視（底部拉桿可上下拉伸高度）
                                                    </div>
                                                    <LocationPicker lat={editCoords.lat} lng={editCoords.lng} readOnly={true} defaultHeight={260} />
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                    <div className="text-slate-500 font-medium mb-6 space-y-1">
                                        {caseData.category === 'SELF' ? (
                                            <p className="text-slate-400">自辦案件 (無陳情人)</p>
                                        ) : isA1Mode ? (
                                            <p className="font-bold text-rose-700">主政單位：{currentStage?.extData?.hostUnit || caseData.extData?.hostUnit || '-'}</p>
                                        ) : isOtherUnitMode ? (
                                            <>
                                                <p>陳情人：<span className="font-bold text-slate-700">{currentStage?.petitionerName || caseData.petitioner?.name || '-'}</span></p>
                                                <p>主政單位：<span className="font-bold text-blue-700">{currentStage?.extData?.hostUnit || caseData.extData?.hostUnit || '-'}</span></p>
                                            </>
                                        ) : (
                                            <p>陳情人：<span className="font-bold text-slate-700">{currentStage?.petitionerName || caseData.petitioner?.name || '-'}</span></p>
                                        )}
                                    </div>
                                </>
                            )}

                            {/* 各階段內容閱覽與管理區 (左側欄位) */}
                            <div className="bg-indigo-50/40 p-5 rounded-3xl mb-6 border border-indigo-100">
                                <div className="flex flex-wrap justify-between items-center gap-2 mb-4">
                                    <div>
                                        <span className="text-xs font-black text-primary uppercase tracking-wider flex items-center gap-1.5">
                                            <Icons.List /> 各階段內容閱覽 ({stages.length} 階段)
                                        </span>
                                        <p className="text-[11px] text-slate-400 mt-0.5">點擊階段卡片可切換檢視與編輯，第二階段後欄位均為選填</p>
                                    </div>
                                    {caseData.status !== 'CLOSED' && (
                                        <button
                                            type="button"
                                            onClick={handleAddNextStage}
                                            className="px-3 py-1.5 bg-primary text-white rounded-xl text-xs font-bold shadow-sm hover:opacity-95 transition-all flex items-center gap-1"
                                        >
                                            <Icons.Plus /> 開設下一階段
                                        </button>
                                    )}
                                </div>

                                <div className="space-y-3">
                                    {stages.map((st, idx) => {
                                        const isCurrent = idx === safeStageIdx;
                                        const stExt = st.extData || {};
                                        const stDocNo = stExt.surveyDocNo || stExt.replyDocNo || '';
                                        const stTime = ['REPLY', 'FORWARD'].includes(caseData.category) ? (stExt.replyDate || '') : formatDateTime(stExt.surveyDate);
                                        const stResolution = stExt.surveyResolution || stExt.replyContent || stExt.handlingStatus || '';
                                        return (
                                            <div
                                                key={st.id || idx}
                                                onClick={() => setActiveStageIdx(idx)}
                                                className={`p-4 rounded-2xl border transition-all cursor-pointer ${isCurrent ? 'bg-white border-primary ring-2 ring-primary/20 shadow-sm' : 'bg-white/70 border-slate-200 hover:border-slate-300'}`}
                                            >
                                                <div className="flex justify-between items-center gap-2 mb-2">
                                                    {editingStageNameIdx === idx ? (
                                                        <div className="flex items-center gap-1.5 flex-1" onClick={e => e.stopPropagation()}>
                                                            <input
                                                                type="text"
                                                                value={editingStageNameVal}
                                                                onChange={e => setEditingStageNameVal(e.target.value)}
                                                                placeholder={getDefaultStageName(idx)}
                                                                className="flex-1 rounded-lg px-2.5 py-1 text-xs font-bold bg-white border border-indigo-300"
                                                                autoFocus
                                                            />
                                                            <button type="button" onClick={() => handleSaveStageName(idx)} className="px-2.5 py-1 bg-primary text-white rounded-lg text-xs font-bold">儲存</button>
                                                            <button type="button" onClick={() => setEditingStageNameIdx(null)} className="px-2 py-1 bg-slate-200 text-slate-600 rounded-lg text-xs font-bold">取消</button>
                                                        </div>
                                                    ) : (
                                                        <div className="flex items-center gap-2 flex-wrap">
                                                            <span className={`px-2.5 py-0.5 rounded-full text-xs font-black ${isCurrent ? 'bg-primary text-white' : 'bg-slate-200 text-slate-700'}`}>
                                                                {st.name || getDefaultStageName(idx)}
                                                            </span>
                                                            {isCurrent && <span className="text-[11px] font-bold text-primary">● 檢視/編輯中</span>}
                                                        </div>
                                                    )}

                                                    {editingStageNameIdx !== idx && (
                                                        <div className="flex items-center gap-1" onClick={e => e.stopPropagation()}>
                                                            <button
                                                                type="button"
                                                                onClick={() => { setEditingStageNameIdx(idx); setEditingStageNameVal(st.name || getDefaultStageName(idx)); }}
                                                                className="text-slate-400 hover:text-primary p-1 rounded-lg text-xs flex items-center gap-0.5 font-bold"
                                                                title="重新命名階段"
                                                            >
                                                                <Icons.Edit /> 命名
                                                            </button>
                                                            {stages.length > 1 && idx > 0 && caseData.status !== 'CLOSED' && (
                                                                <button
                                                                    type="button"
                                                                    onClick={() => handleDeleteStage(idx)}
                                                                    className="text-rose-400 hover:text-rose-600 p-1 rounded-lg text-xs font-bold"
                                                                    title="刪除此階段"
                                                                >
                                                                    ✕
                                                                </button>
                                                            )}
                                                        </div>
                                                    )}
                                                </div>

                                                {/* 階段內容摘要閱覽 */}
                                                <div className="grid grid-cols-2 gap-x-3 gap-y-1 text-xs text-slate-600 mt-2 pt-2 border-t border-slate-100">
                                                    <div><span className="text-slate-400">收文/收件：</span><span className="font-bold">{stExt.receiveDate || '-'}</span></div>
                                                    <div><span className="text-slate-400">承辦人：</span><span className="font-bold">{stExt.assignee || '-'}</span></div>
                                                    {!isSpecialMode && (
                                                        <div className="col-span-2 truncate"><span className="text-slate-400">{docNoLabel}：</span><span className="font-bold">{stDocNo || '-'}</span></div>
                                                    )}
                                                    {!isSpecialMode && !['REPLY', 'FORWARD'].includes(caseData.category) && (
                                                        <div className="col-span-2"><span className="text-slate-400">會勘時間：</span><span className="font-bold">{stTime && stTime !== '-' ? stTime : '-'}</span></div>
                                                    )}
                                                    {!isSpecialMode && isReplyMode && (
                                                        <div className="col-span-2"><span className="text-slate-400">回復日期：</span><span className="font-bold">{stExt.replyDate || '-'}</span></div>
                                                    )}
                                                    {st.content && !isA1Mode && (
                                                        <div className="col-span-2 text-slate-600 bg-slate-50 p-2 rounded-xl mt-1 line-clamp-2">
                                                            <span className="text-slate-400 font-bold">{isSpecialMode ? '交辦內容：' : '陳情內容：'}</span>{st.content}
                                                        </div>
                                                    )}
                                                    {stResolution && (
                                                        <div className="col-span-2 text-slate-600 bg-indigo-50/40 p-2 rounded-xl mt-1 line-clamp-2">
                                                            <span className="text-primary font-bold">決議/辦理：</span>{stResolution}
                                                        </div>
                                                    )}
                                                    {(stExt.dispatchDate || stExt.completionDate) && (
                                                        <div className="col-span-2 flex gap-3 pt-1 text-[11px] text-slate-500">
                                                            {stExt.dispatchDate && <span>派工：{stExt.dispatchDate}</span>}
                                                            {stExt.completionDate && <span>完工/結案：{stExt.completionDate}</span>}
                                                        </div>
                                                    )}
                                                    {stExt.note && (
                                                        <div className="col-span-2 text-amber-700 bg-amber-50/70 px-2 py-1 rounded-lg mt-1 truncate">
                                                            備註：{stExt.note}
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            <div className="bg-slate-50/70 p-6 rounded-3xl mb-6 group relative border border-slate-100">
                                <div className="flex justify-between items-center mb-3">
                                    <span className="text-xs font-bold text-slate-400 uppercase tracking-wider block">
                                        {currentStage?.name || getDefaultStageName(safeStageIdx)} — 基本資訊 {safeStageIdx > 0 && <span className="text-[11px] text-primary font-normal">(選填)</span>}
                                    </span>
                                    {caseData.status !== 'CLOSED' && !isEditingBasicInfo && (
                                        <button onClick={() => setEditingBasicInfo(true)} className="opacity-0 group-hover:opacity-100 transition-opacity text-primary hover:bg-indigo-50 p-1 rounded flex items-center gap-1 text-xs font-bold"><Icons.Edit /> 修改</button>
                                    )}
                                </div>
                                {isEditingBasicInfo ? (
                                    <div className="flex flex-col gap-3 animate-fade-in">
                                        <div><label className="text-xs font-bold text-slate-500 block mb-1">收文 / 收件日期 (選填)</label><input type="date" className="w-full rounded-xl px-3 py-2 border border-slate-300 bg-white" value={editBasicInfoData.receiveDate} onChange={e => setEditBasicInfoData({...editBasicInfoData, receiveDate: e.target.value})} /></div>
                                        <div><label className="text-xs font-bold text-slate-500 block mb-1">承辦人 (選填)</label><input type="text" className="w-full rounded-xl px-3 py-2 border border-slate-300 bg-white" value={editBasicInfoData.assignee} onChange={e => setEditBasicInfoData({...editBasicInfoData, assignee: e.target.value})} /></div>
                                        {!isSpecialMode && !['SELF', 'A1'].includes(caseData.category) && (
                                            <div><label className="text-xs font-bold text-slate-500 block mb-1">陳情人 (選填)</label><input type="text" className="w-full rounded-xl px-3 py-2 border border-slate-300 bg-white" value={editBasicInfoData.petitionerName} onChange={e => setEditBasicInfoData({...editBasicInfoData, petitionerName: e.target.value})} /></div>
                                        )}
                                        {!isSpecialMode && (isA1Mode || isOtherUnitMode) && (
                                            <div><label className="text-xs font-bold text-slate-500 block mb-1">主政單位 (選填)</label><input type="text" className="w-full rounded-xl px-3 py-2 border border-slate-300 bg-white" value={editBasicInfoData.hostUnit} onChange={e => setEditBasicInfoData({...editBasicInfoData, hostUnit: e.target.value})} /></div>
                                        )}
                                        {!isSpecialMode && isForwardMode && (
                                            <div><label className="text-xs font-bold text-slate-500 block mb-1">函轉單位 (選填)</label><input type="text" className="w-full rounded-xl px-3 py-2 border border-slate-300 bg-white" value={editBasicInfoData.forwardUnit} onChange={e => setEditBasicInfoData({...editBasicInfoData, forwardUnit: e.target.value})} /></div>
                                        )}
                                        {!isSpecialMode && (
                                            <div><label className="text-xs font-bold text-slate-500 block mb-1">{docNoLabel} (選填)</label><input type="text" className="w-full rounded-xl px-3 py-2 border border-slate-300 bg-white" value={editBasicInfoData.surveyDocNo} onChange={e => setEditBasicInfoData({...editBasicInfoData, surveyDocNo: e.target.value})} /></div>
                                        )}
                                        <div className="flex justify-end gap-2 mt-2">
                                            <button onClick={() => setEditingBasicInfo(false)} className="px-4 py-1.5 text-xs font-bold bg-slate-200 text-slate-600 rounded-lg">取消</button>
                                            <button onClick={handleSaveBasicInfo} className="px-4 py-1.5 text-xs font-bold bg-primary text-white rounded-lg">儲存修改</button>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-2 gap-y-4 gap-x-2 text-sm">

                                        <div className="md:col-span-2 space-y-1.5"><label className="text-sm font-medium text-slate-600 px-1">會勘決議事項</label><textarea rows="2" disabled={caseData.status==='CLOSED'} className="w-full rounded-3xl px-4 py-4 border border-slate-200" value={editExtData.surveyResolution || ''} onChange={e => setEditExtData({...editExtData, surveyResolution: e.target.value})}></textarea></div>

                                        <div className="flex items-center justify-start md:mt-6"><label className="flex items-center cursor-pointer"><input type="checkbox" disabled={caseData.status==='CLOSED'} checked={editExtData.noDispatchRequired || false} onChange={e => setEditExtData({...editExtData, noDispatchRequired: e.target.checked})} className="w-5 h-5 text-primary border-slate-300 rounded" /><span className="ml-3 text-sm font-bold text-slate-600">不需派工施作 (可直接結案)</span></label></div>
                                        {!editExtData.noDispatchRequired && (
                                            <>
                                                <div className="space-y-1.5"><label className="text-sm font-medium text-slate-600 px-1">派工日期</label><input type="date" disabled={caseData.status==='CLOSED'} className="w-full rounded-2xl px-4 py-3.5 border border-slate-200" value={editExtData.dispatchDate || ''} onChange={e => setEditExtData({...editExtData, dispatchDate: e.target.value})} /></div>
                                                <div className="space-y-1.5"><label className="text-sm font-medium text-slate-600 px-1">完工日期 (實際結案日)</label><input type="date" disabled={caseData.status==='CLOSED'} className="w-full rounded-2xl px-4 py-3.5 border border-slate-200" value={editExtData.completionDate || ''} onChange={e => setEditExtData({...editExtData, completionDate: e.target.value})} /></div>

                                    </>
                                ) : (
                                    <div className="flex gap-4 flex-col md:flex-row w-full">
                                        <button disabled={isSubmitting} onClick={() => handleExtDataReply('CLOSED')} className="flex-1 py-4 bg-emerald-50 text-emerald-600 border border-emerald-200 rounded-2xl font-bold text-base">儲存備註變更</button>

                        <div className="bg-white p-8 rounded-3xl shadow-soft shrink-0 border border-slate-100">

                                {(caseData.history || []).map((item, idx) => (
                                    <div key={idx} className="relative pl-8 group">
                                        <div className="absolute -left-[9px] top-1 w-4 h-4 rounded-full bg-slate-200 border-4 border-white"></div>

                                        {editingHistoryIdx === idx ? (

                                                    <button onClick={() => setEditingHistoryIdx(null)} className="px-4 py-1.5 text-xs font-bold bg-slate-200 text-slate-600 rounded-lg">取消</button>
