                        <div className="flex items-center gap-4 mb-8 pb-6 border-b border-slate-100">
                            <div className={`w-12 h-12 rounded-2xl flex items-center justify-center ${themeBg} ${themeColor}`}>{isSpecialMode ? <Icons.Star /> : <Icons.Plus />}</div>
                            <div>
                                <h2 className="text-2xl font-black text-slate-800 tracking-wide">{isSpecialMode ? '新增特殊交辦案件' : '新增案件資料'}</h2>
                                <p className="text-sm text-slate-400 mt-1">{isSpecialMode ? '記錄長官交辦或特殊列管之案件' : '請填寫完整的案件資訊'}</p>
                            </div>
                        </div>
                        
                        <form onSubmit={handleSubmit} className="space-y-10">
                            <section>
                                <h3 className={`text-sm font-bold uppercase tracking-wider mb-5 px-1 ${themeColor}`}>基本資料</h3>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                    <div className="space-y-1.5 md:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-5">
                                        <div className="space-y-1.5">
                                            <label className="text-sm font-medium text-slate-600 px-1">案件類別</label>
                                            <select className={`w-full rounded-2xl px-4 py-3.5 focus:ring-4 ${themeRing}`} value={formData.category} onChange={e => {
                                                const newCategory = e.target.value;
                                                const baseDate = formData.extData.surveyDate || formData.extData.replyDate || formData.extData.receiveDate;
                                                let newDeadline = '';
                                                if (newCategory === 'A1') newDeadline = calculateMonthsDeadline(baseDate, 1);
                                                else if (['SURVEY', 'REPLY', 'OTHER_UNIT', 'OTHER', 'SELF'].includes(newCategory)) newDeadline = calculateMonthsDeadline(baseDate, 2);
                                                setFormData(prev => ({...prev, category: newCategory, extData: { ...prev.extData, completionDeadline: newDeadline }}));
                                            }}>
                                                {isSpecialMode ? (
                                                    <><option value="DIRECTOR">局長案</option><option value="TEMP">臨時交辦案件</option><option value="OTHER_SPECIAL">其他(特殊)</option></>
                                                ) : (
                                                    <><option value="SURVEY">會勘</option><option value="REPLY">回復</option><option value="A1">A1事故</option><option value="FORWARD">函轉</option><option value="SELF">自辦</option><option value="OTHER_UNIT">其他單位辦理</option><option value="OTHER">其他</option></>
                                                )}
                                            </select>
                                        </div>
                                        {!isSpecialMode && formData.category === 'OTHER' && (
                                            <div className="space-y-1.5 animate-fade-in">
                                                <label className="text-sm font-medium text-slate-600 px-1">自訂類別名稱</label>
                                                <input required type="text" className={`w-full rounded-2xl px-4 py-3.5 focus:ring-4 ${themeRing}`} placeholder="請輸入類別名稱" value={formData.extData.customCategory} onChange={e => handleExtData('customCategory', e.target.value)} />
                                            </div>
                                        )}
                                    </div>

                                    <div className="space-y-1.5">
                                        <label className="text-sm font-medium text-slate-600 px-1">收文 / 收件日期</label>
                                        <input required type="date" className={`w-full rounded-2xl px-4 py-3.5 focus:ring-4 ${themeRing}`} value={formData.extData.receiveDate} onChange={e => {
                                            const val = e.target.value; handleExtData('receiveDate', val);
                                            if (['FORWARD', 'OTHER_UNIT', 'OTHER', 'REPLY', 'SELF'].includes(formData.category)) handleExtData('completionDeadline', calculateMonthsDeadline(val, 2));
                                        }} />
                                    </div>
                                    
                                    {isSpecialMode ? (
                                        <>
                                            <div className="space-y-1.5"><label className="text-sm font-medium text-slate-600 px-1">交辦時間</label><input required type="date" className={`w-full rounded-2xl px-4 py-3.5 focus:ring-4 ${themeRing}`} value={formData.extData.assignDate} onChange={e => handleExtData('assignDate', e.target.value)} /></div>
                                            <div className="space-y-1.5"><label className="text-sm font-medium text-slate-600 px-1">預定結案時間</label><input required type="date" className={`w-full rounded-2xl px-4 py-3.5 focus:ring-4 ${themeRing}`} value={formData.extData.completionDeadline} onChange={e => handleExtData('completionDeadline', e.target.value)} /></div>
                                            <div className="space-y-1.5 md:col-span-2"><label className="text-sm font-medium text-slate-600 px-1">承辦人</label><input required type="text" className={`w-full rounded-2xl px-4 py-3.5 focus:ring-4 ${themeRing}`} placeholder="負責人員姓名" value={formData.extData.assignee} onChange={e => handleExtData('assignee', e.target.value)} /></div>
                                            <div className="md:col-span-2 space-y-1.5"><label className="text-sm font-medium text-slate-600 px-1">交辦內容</label><textarea required rows="4" className={`w-full rounded-3xl px-4 py-4 leading-relaxed focus:ring-4 ${themeRing}`} placeholder="詳細敘述交辦事項..." value={formData.content} onChange={e => setFormData({...formData, content: e.target.value})}></textarea></div>
                                        </>
                                    ) : (
                                        <>
                                            {formData.category !== 'SELF' && (
                                                <div className="space-y-1.5">
                                                    <label className="text-sm font-medium text-slate-600 px-1">{formData.category === 'OTHER_UNIT' ? '主政單位' : '陳情人'}</label>
                                                    <input required type="text" className={`w-full rounded-2xl px-4 py-3.5 focus:ring-4 ${themeRing}`} value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} placeholder={formData.category === 'OTHER_UNIT' ? '輸入主政單位名稱' : '陳情人姓名'} />
                                                </div>
                                            )}
                                            {formData.category === 'OTHER_UNIT' && (
                                                <div className="space-y-1.5">
                                                    <label className="text-sm font-medium text-slate-600 px-1">陳情單位</label>
                                                    <input required type="text" className={`w-full rounded-2xl px-4 py-3.5 focus:ring-4 ${themeRing}`} value={formData.extData.forwardUnit || ''} onChange={e => handleExtData('forwardUnit', e.target.value)} placeholder="輸入陳情單位" />
                                                </div>
                                            )}
                                            <div className="space-y-1.5">
                                                <label className="text-sm font-medium text-slate-600 px-1">行政區</label>
                                                <select className={`w-full rounded-2xl px-4 py-3.5 focus:ring-4 ${themeRing}`} value={formData.district} onChange={e => { setFormData({...formData, district: e.target.value}); setUserDragged(false); }}>
                                                    {TAOYUAN_DISTRICTS.map(d => <option key={d} value={d}>{d}</option>)}
                                                </select>
                                            </div>
                                            <div className="md:col-span-2 space-y-1.5">
                                                <label className="text-sm font-medium text-slate-600 px-1">詳細地點 (路口/地址)</label>
                                                <input required type="text" className={`w-full rounded-2xl px-4 py-3.5 focus:ring-4 ${themeRing}`} placeholder="例如：中正路與力行路口" value={formData.address} onChange={e => { setFormData({...formData, address: e.target.value}); setUserDragged(false); }} />
                                                
                                                <div className="mt-3 relative rounded-2xl overflow-hidden border border-slate-200 h-48 w-full shadow-inner">
                                                    <div className="absolute top-2 left-2 z-10 bg-white/95 backdrop-blur px-3 py-1.5 rounded-lg text-xs font-bold shadow-sm text-slate-600 flex items-center gap-2">
                                                        {isLocating ? <span className="animate-pulse text-indigo-500">自動定位中...</span> : '📍 若定位不準，可直接拖曳紅點微調位置'}
                                                    </div>
                                                    <LocationPicker lat={coords.lat} lng={coords.lng} onChange={(lat,lng) => { setCoords({lat,lng}); setUserDragged(true); }} />
                                                </div>
                                            </div>
                                            <div className="md:col-span-2 space-y-1.5"><label className="text-sm font-medium text-slate-600 px-1">陳情內容</label><textarea required rows="4" className={`w-full rounded-3xl px-4 py-4 leading-relaxed focus:ring-4 ${themeRing}`} placeholder="簡述案件狀況..." value={formData.content} onChange={e => setFormData({...formData, content: e.target.value})}></textarea></div>
                                        </>
                                    )}
                                    <div className="md:col-span-2 space-y-1.5"><label className="text-sm font-medium text-slate-600 px-1">備註 (選填)</label><textarea rows="2" className={`w-full rounded-2xl px-4 py-3 leading-relaxed focus:ring-4 ${themeRing}`} placeholder="其他補充事項..." value={formData.extData.note} onChange={e => handleExtData('note', e.target.value)}></textarea></div>
                                </div>
                            </section>

                            {!isSpecialMode && (formData.category === 'REPLY' || formData.category === 'OTHER') ? (
                                <section>
                                    <h3 className="text-sm font-bold text-cyan-600 uppercase tracking-wider mb-5 px-1">{formData.category === 'OTHER' ? '處理資訊' : '回復預定資訊'}</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-5 bg-cyan-50/50 p-6 rounded-3xl border border-cyan-100">
                                        <div className="space-y-1.5"><label className="text-sm font-medium text-slate-600 px-1">承辦人</label><input type="text" className="w-full rounded-2xl px-4 py-3.5 bg-white border-slate-200" placeholder="承辦人員姓名" value={formData.extData.assignee} onChange={e => handleExtData('assignee', e.target.value)} /></div>
                                        <div className="space-y-1.5"><label className="text-sm font-medium text-slate-600 px-1">處理/回復日期</label><input type="date" className="w-full rounded-2xl px-4 py-3.5 bg-white border-slate-200" value={formData.extData.replyDate} onChange={e => { const val = e.target.value; handleExtData('replyDate', val); handleExtData('completionDeadline', calculateMonthsDeadline(val, 2)); }} /></div>
                                        <div className="space-y-1.5 md:col-span-2"><label className="text-sm font-medium text-slate-600 px-1">相關文號</label><input type="text" className="w-full rounded-2xl px-4 py-3.5 bg-white border-slate-200" placeholder="輸入相關文號" value={formData.extData.replyDocNo} onChange={e => handleExtData('replyDocNo', e.target.value)} /></div>
                                        <div className="md:col-span-2 bg-cyan-100/50 p-4 rounded-2xl border border-cyan-200 mt-2">
                                            <label className="text-sm font-bold text-cyan-700 mb-2 flex items-center gap-1"><Icons.Clock /> 期限設定 (自動推算)</label>
                                            <div><span className="text-xs font-bold text-cyan-600 mb-1 block">結案期限 (+2個月)</span><input type="date" className="w-full rounded-xl px-3 py-2.5 bg-white text-cyan-700 border border-cyan-200" value={formData.extData.completionDeadline} onChange={e => handleExtData('completionDeadline', e.target.value)} /></div>
                                        </div>
                                    </div>
                                </section>
                            ) : !isSpecialMode && formData.category === 'FORWARD' ? (
                                <section>
                                    <h3 className="text-sm font-bold text-purple-600 uppercase tracking-wider mb-5 px-1">函轉資訊 (建立即結案)</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-5 bg-purple-50/50 p-6 rounded-3xl border border-purple-100">
                                        <div className="space-y-1.5"><label className="text-sm font-medium text-slate-600 px-1">承辦人</label><input type="text" className="w-full rounded-2xl px-4 py-3.5 bg-white border-slate-200" placeholder="承辦人員姓名" value={formData.extData.assignee} onChange={e => handleExtData('assignee', e.target.value)} /></div>
                                        <div className="space-y-1.5"><label className="text-sm font-medium text-slate-600 px-1">函轉單位</label><input type="text" className="w-full rounded-2xl px-4 py-3.5 bg-white border-slate-200" placeholder="轉往哪個單位" value={formData.extData.forwardUnit || ''} onChange={e => handleExtData('forwardUnit', e.target.value)} /></div>
                                        <div className="space-y-1.5 md:col-span-2"><label className="text-sm font-medium text-slate-600 px-1">發文文號</label><input type="text" className="w-full rounded-2xl px-4 py-3.5 bg-white border-slate-200" placeholder="輸入發文文號" value={formData.extData.surveyDocNo} onChange={e => handleExtData('surveyDocNo', e.target.value)} /></div>
                                    </div>
                                </section>
                            ) : !isSpecialMode && formData.category === 'OTHER_UNIT' ? (
                                <section>
                                    <h3 className="text-sm font-bold text-blue-600 uppercase tracking-wider mb-5 px-1">其他單位辦理資訊</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-5 bg-blue-50/50 p-6 rounded-3xl border border-blue-100">
                                        <div className="space-y-1.5"><label className="text-sm font-medium text-slate-600 px-1">承辦人</label><input type="text" className="w-full rounded-2xl px-4 py-3.5 bg-white border-slate-200" placeholder="承辦人員姓名" value={formData.extData.assignee} onChange={e => handleExtData('assignee', e.target.value)} /></div>
                                        <div className="space-y-1.5"><label className="text-sm font-medium text-slate-600 px-1">會勘通知文號</label><input type="text" className="w-full rounded-2xl px-4 py-3.5 bg-white border-slate-200" placeholder="輸入文號" value={formData.extData.surveyDocNo} onChange={e => handleExtData('surveyDocNo', e.target.value)} /></div>
                                        <div className="space-y-1.5"><label className="text-sm font-medium text-slate-600 px-1">會勘時間</label><input type="datetime-local" className="w-full rounded-2xl px-4 py-3.5 bg-white border-slate-200" value={getDatetimeLocal(formData.extData.surveyDate)} onChange={e => { const val = e.target.value; handleExtData('surveyDate', val); handleExtData('completionDeadline', calculateMonthsDeadline(val, 2)); }} /></div>
                                        <div className="space-y-1.5"><label className="text-sm font-medium text-slate-600 px-1">會勘紀錄文號</label><input type="text" className="w-full rounded-2xl px-4 py-3.5 bg-white border-slate-200" placeholder="輸入紀錄文號" value={formData.extData.recordDocNo || ''} onChange={e => handleExtData('recordDocNo', e.target.value)} /></div>
                                        <div className="md:col-span-2 bg-blue-100/50 p-4 rounded-2xl border border-blue-200 mt-2">
                                            <label className="text-sm font-bold text-blue-700 mb-2 flex items-center gap-1"><Icons.Clock /> 期限設定 (自動推算)</label>
                                            <div><span className="text-xs font-bold text-blue-600 mb-1 block">結案期限 (+2個月)</span><input type="date" className="w-full rounded-xl px-3 py-2.5 bg-white text-blue-700 border border-blue-200" value={formData.extData.completionDeadline} onChange={e => handleExtData('completionDeadline', e.target.value)} /></div>
                                        </div>
                                    </div>
                                </section>
                            ) : !isSpecialMode ? (
                                <section>
                                    <h3 className="text-sm font-bold text-primary uppercase tracking-wider mb-5 px-1">會勘預定資訊</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-5 bg-indigo-50/50 p-6 rounded-3xl border border-indigo-100">
                                        <div className="space-y-1.5"><label className="text-sm font-medium text-slate-600 px-1">承辦人</label><input type="text" className="w-full rounded-2xl px-4 py-3.5 bg-white border-slate-200" placeholder="承辦人員姓名" value={formData.extData.assignee} onChange={e => handleExtData('assignee', e.target.value)} /></div>
                                        <div className="space-y-1.5"><label className="text-sm font-medium text-slate-600 px-1">{formData.category === 'A1' ? '會勘通知文號(分局來文)' : '會勘通知文號'}</label><input type="text" className="w-full rounded-2xl px-4 py-3.5 bg-white border-slate-200" placeholder="輸入文號" value={formData.extData.surveyDocNo} onChange={e => handleExtData('surveyDocNo', e.target.value)} /></div>
                                        <div className="space-y-1.5 md:col-span-2"><label className="text-sm font-medium text-slate-600 px-1">會勘時間</label><input type="datetime-local" className="w-full rounded-2xl px-4 py-3.5 bg-white border-slate-200" value={getDatetimeLocal(formData.extData.surveyDate)} onChange={e => { const val = e.target.value; handleExtData('surveyDate', val); handleExtData('recordDeadline', calculateWorkingDays(val, 3)); handleExtData('completionDeadline', calculateMonthsDeadline(val, formData.category === 'A1' ? 1 : 2)); }} /></div>
                                        <div className="md:col-span-2 bg-indigo-100/50 p-4 rounded-2xl border border-indigo-200 mt-2">
                                            <label className="text-sm font-bold text-indigo-700 mb-3 flex items-center gap-1"><Icons.Clock /> 期限設定 (依會勘日期自動推算)</label>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                <div><span className="text-xs font-bold text-indigo-600 mb-1 block">紀錄取號期限 (+3工作日)</span><input type="date" className="w-full rounded-xl px-3 py-2.5 bg-white text-indigo-700 border border-indigo-200" value={formData.extData.recordDeadline} onChange={e => handleExtData('recordDeadline', e.target.value)} /></div>
                                                <div><span className="text-xs font-bold text-indigo-600 mb-1 block">結案期限 (+{formData.category === 'A1' ? '1' : '2'}個月)</span><input type="date" className="w-full rounded-xl px-3 py-2.5 bg-white text-indigo-700 border border-indigo-200" value={formData.extData.completionDeadline} onChange={e => handleExtData('completionDeadline', e.target.value)} /></div>
                                            </div>
                                        </div>
                                    </div>
                                </section>
                            ) : null}

                            <div className="flex gap-4 pt-4 border-t border-slate-100 mt-8">
                                <button type="submit" disabled={isSubmitting} className={`flex-1 text-white py-4 rounded-2xl font-bold text-lg shadow-float transition-all active:scale-[0.98] ${isSubmitting ? 'bg-slate-300' : themeBtn}`}>
                                    {isSubmitting ? '處理中...' : (formData.category === 'FORWARD' ? '立案並結案' : '確認立案')}
                                </button>
                                <button type="button" onClick={onCancel} className="flex-1 bg-white border-2 border-slate-200 text-slate-500 hover:text-slate-800 hover:bg-slate-50 py-4 rounded-2xl font-bold text-lg transition-all active:scale-[0.98]">取消返回</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        const CaseDetail = ({ caseData, allCases, onBack, onUpdateStatus, onDelete, onEditHistory, onUpdateBasicInfo, onMergeCase, onUnmergeCase, onSelectCase }) => {
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [modalConfig, setModalConfig] = useState({ isOpen: false });
            const isSpecialMode = caseData.caseType === 'SPECIAL';
            const isReplyMode = !isSpecialMode && (caseData.category === 'REPLY' || caseData.category === 'OTHER');
            const isForwardMode = !isSpecialMode && caseData.category === 'FORWARD';
            const [editingHistoryIdx, setEditingHistoryIdx] = useState(null);
            const [editingHistoryContent, setEditingHistoryContent] = useState('');

            // Edit basic states
            const [isEditingAddress, setEditingAddress] = useState(false);
            const [editedAddress, setEditedAddress] = useState('');
            const [editedDistrict, setEditedDistrict] = useState('');
            const [editCoords, setEditCoords] = useState({ lat: 24.9936, lng: 121.3009 });
            const [userDragged, setUserDragged] = useState(false);
            const [isLocating, setIsLocating] = useState(false);

            const [isEditingContent, setEditingContent] = useState(false);
            const [editedContent, setEditedContent] = useState('');

            const [isEditingBasicInfo, setEditingBasicInfo] = useState(false);
            const [editBasicInfoData, setEditBasicInfoData] = useState({ receiveDate: '', assignee: '', surveyDocNo: '' });
            
            const [showMergePanel, setShowMergePanel] = useState(false);
            const [mergeSearchText, setMergeSearchText] = useState('');

            const [editExtData, setEditExtData] = useState({
                receiveDate: '', surveyDate: '', recordDeadline: '', recordActualDate: '', recordDocNo: '', surveyResolution: '', dispatchDate: '', completionDate: '', completionDeadline: '', noDispatchRequired: false,
                assignDate: '', handlingStatus: '', assignee: '', replyDate: '', replyDocNo: '', replyContent: '', note: '', forwardUnit: '', customCategory: ''
            });

            useEffect(() => {
                setEditedAddress(caseData.location?.address || '');
                setEditedDistrict(caseData.location?.district || '桃園區');
                setEditCoords({ lat: caseData.location?.lat || DISTRICT_COORDS[caseData.location?.district]?.lat || 24.9936, lng: caseData.location?.lng || DISTRICT_COORDS[caseData.location?.district]?.lng || 121.2238 });
                setUserDragged(false);

                setEditedContent(caseData.content || '');
                setEditBasicInfoData({ receiveDate: caseData.extData?.receiveDate || '', assignee: caseData.extData?.assignee || '', surveyDocNo: caseData.extData?.surveyDocNo || '' });
                
                setEditExtData({
                    receiveDate: caseData.extData?.receiveDate || '', surveyDate: caseData.extData?.surveyDate || '', recordDeadline: caseData.extData?.recordDeadline || '', recordActualDate: caseData.extData?.recordActualDate || '', recordDocNo: caseData.extData?.recordDocNo || '', surveyResolution: caseData.extData?.surveyResolution || '', dispatchDate: caseData.extData?.dispatchDate || '', completionDate: caseData.extData?.completionDate || '', completionDeadline: caseData.extData?.completionDeadline || '', noDispatchRequired: caseData.extData?.noDispatchRequired || false, assignDate: caseData.extData?.assignDate || '', handlingStatus: caseData.extData?.handlingStatus || '', assignee: caseData.extData?.assignee || '', replyDate: caseData.extData?.replyDate || '', replyDocNo: caseData.extData?.replyDocNo || '', replyContent: caseData.extData?.replyContent || '', note: caseData.extData?.note || '', forwardUnit: caseData.extData?.forwardUnit || '', customCategory: caseData.extData?.customCategory || ''
                });
            }, [caseData.id, caseData]); 

            useEffect(() => {
                if (!isEditingAddress || !editedAddress) return;
                if (userDragged) return;
                const timer = setTimeout(async () => {
                    setIsLocating(true);
                    const newCoords = await advancedGeocode(editedDistrict, editedAddress);
                    if (newCoords) setEditCoords(newCoords); else if (!userDragged) setEditCoords(DISTRICT_COORDS[editedDistrict] || DISTRICT_COORDS['桃園區']);
                    setIsLocating(false);
                }, 800);
                return () => clearTimeout(timer);
            }, [editedAddress, editedDistrict, isEditingAddress, userDragged]);

            const closeM = () => setModalConfig({ isOpen: false });

            const handleExtDataReply = async (stage) => {
                setIsSubmitting(true);
                try {
                    let actionText = stage === 'CLOSED' ? '更新案件資訊並結案' : '更新案件處理資訊';
                    if (stage === 'MERGED') actionText = '更新併案內容進度';
                    
                    let dataToSave = { ...editExtData };
                    if (isSpecialMode && editExtData.handlingStatus && editExtData.handlingStatus.trim() !== '') {
                        actionText = `【辦理情形】${editExtData.handlingStatus}`; dataToSave.handlingStatus = ''; 
                    }
                    if (stage === 'CLOSED' && !dataToSave.completionDate) dataToSave.completionDate = getLocalISODate();
                    await onUpdateStatus(caseData.id, stage, actionText, dataToSave);
                    if (isSpecialMode) setEditExtData(prev => ({ ...prev, handlingStatus: '' }));
                } catch(e) { console.warn(e); } finally { setIsSubmitting(false); }
            };

            const handleRevert = async () => {
                setIsSubmitting(true);
                try { await onUpdateStatus(caseData.id, 'PENDING', '案件恢復為辦理中', editExtData); } catch(e) { console.warn(e); } finally { setIsSubmitting(false); }
            };

            const delClick = () => {
                setModalConfig({
                    isOpen: true, title: '確認刪除案件', content: '此動作無法復原，您確定要刪除這筆案件紀錄嗎？',
                    actions: (
                        <div className="flex gap-3 mt-4">
                            <button onClick={closeM} className="flex-1 px-4 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold transition-colors">取消</button>
                            <button onClick={async () => { closeM(); await onDelete(caseData.id); }} className="flex-1 px-4 py-3 bg-red-500 hover:bg-red-600 text-white rounded-xl font-bold shadow-md transition-colors">確認刪除</button>
                        </div>
                    )
                });
            };

            const handleSaveAddress = () => { 
                onUpdateBasicInfo(caseData.id, { location: { ...caseData.location, address: editedAddress, district: editedDistrict, lat: editCoords.lat, lng: editCoords.lng, isFallback: false } }); 
                setEditingAddress(false); 
            };
            const handleSaveContent = () => { onUpdateBasicInfo(caseData.id, { content: editedContent }); setEditingContent(false); };
            const handleSaveBasicInfo = () => {
                 onUpdateBasicInfo(caseData.id, { extData: { ...caseData.extData, ...editBasicInfoData } });
                 setEditingBasicInfo(false);
            };
            
            const performMerge = (targetCaseId) => {
                setModalConfig({
                    isOpen: true, title: '確認併案', content: '併案後，目前這筆案件將會標示為「已併案」狀態，確定要將它併入所選的案件嗎？',
                    actions: (
                        <div className="flex gap-3 mt-4">
                            <button onClick={closeM} className="flex-1 px-4 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold transition-colors">取消</button>
                            <button onClick={async () => { closeM(); await onMergeCase(caseData.id, targetCaseId); setShowMergePanel(false); }} className="flex-1 px-4 py-3 bg-primary hover:bg-indigo-600 text-white rounded-xl font-bold shadow-md transition-colors">確認併入</button>
                        </div>
                    )
                });
            }
            
            const handleUnmerge = (childId) => {
                 setModalConfig({
                    isOpen: true, title: '解除併案', content: '解除後，該案件將恢復為獨立案件 (辦理中)。',
                    actions: (
                        <div className="flex gap-3 mt-4">
                            <button onClick={closeM} className="flex-1 px-4 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold transition-colors">取消</button>
                            <button onClick={async () => { closeM(); await onUnmergeCase(childId, caseData.id); }} className="flex-1 px-4 py-3 bg-orange-500 hover:bg-orange-600 text-white rounded-xl font-bold shadow-md transition-colors">解除併案</button>
                        </div>
                    )
                });
            };

            const themeColor = isSpecialMode ? 'text-red-500' : 'text-primary';
            const themeBtn = isSpecialMode ? 'bg-red-500 hover:bg-red-600' : 'bg-primary hover:bg-indigo-600';
            const themeRing = isSpecialMode ? 'focus:ring-red-500/20' : 'focus:ring-indigo-500/20';
            const childCases = allCases.filter(c => c.mergedInto === caseData.id);
            const mergeCandidates = allCases.filter(c => c.id !== caseData.id && c.status !== 'MERGED' && c.caseType === caseData.caseType && (!mergeSearchText || c.location?.address?.includes(mergeSearchText) || c.content?.includes(mergeSearchText))).slice(0, 5);

            return (
                <div className="h-full flex flex-col xl:flex-row gap-6 overflow-hidden animate-fade-in pb-20 md:pb-0">
                    <Modal {...modalConfig} />
                    
                    {/* Left Column */}
                    <div className="w-full xl:w-5/12 flex flex-col gap-6 overflow-y-auto pr-2 text-sm">
                        <div className="bg-white p-8 rounded-3xl shadow-soft shrink-0 border border-slate-100">
                            <div className="flex justify-between items-center mb-6">
                                <button onClick={onBack} className={`hover:${themeColor} text-slate-400 flex items-center gap-2 text-sm font-bold transition-colors w-fit px-1`}><Icons.ArrowLeft /> 返回列表</button>
                                <button onClick={delClick} className="text-red-400 hover:text-red-600 hover:bg-red-50 p-2 rounded-xl transition-colors flex items-center gap-1 text-sm font-bold"><Icons.Trash /> 刪除</button>
                            </div>
                            <div className="flex flex-wrap items-center gap-3 mb-6">
                                <StatusBadge status={caseData.status} />
                                <CategoryBadge category={caseData.category} customName={caseData.extData?.customCategory} />
                                {!isSpecialMode && caseData.location?.district && <span className="bg-slate-100 text-slate-600 px-3 py-1.5 rounded-full text-xs font-bold tracking-wide border border-slate-200">{caseData.location.district}</span>}
                            </div>
                            
                            {isSpecialMode ? (
                                <>
                                    <h2 className="text-2xl font-black text-slate-800 leading-snug mb-2">特殊交辦案件</h2>
                                </>
                            ) : (
                                <>
                                    <div className="group relative flex items-start justify-between mb-4 min-h-[3rem]">
                                        {isEditingAddress ? (
                                            <div className="flex-1 flex flex-col gap-3 mr-2 animate-fade-in w-full">
                                                <div className="flex flex-col md:flex-row gap-2 items-start md:items-center w-full">
                                                    <select className="w-full md:w-32 rounded-xl px-3 py-2 border border-slate-300 font-bold text-slate-700 bg-white" value={editedDistrict} onChange={e => { setEditedDistrict(e.target.value); setUserDragged(false); }}>{TAOYUAN_DISTRICTS.map(d => <option key={d} value={d}>{d}</option>)}</select>
                                                    <input type="text" className="w-full flex-1 rounded-xl px-3 py-2 border border-slate-300 text-lg md:text-xl font-black text-slate-800" value={editedAddress} onChange={e => { setEditedAddress(e.target.value); setUserDragged(false); }} autoFocus />
                                                    <div className="flex gap-1 shrink-0 mt-2 md:mt-0 self-end md:self-auto"><button onClick={() => { setEditingAddress(false); setEditedAddress(caseData.location?.address || ''); setEditedDistrict(caseData.location?.district || '桃園區'); }} className="p-2 text-slate-400 hover:bg-slate-100 rounded-lg"><Icons.Undo /></button><button onClick={handleSaveAddress} className="p-2 text-primary hover:bg-indigo-50 rounded-lg"><Icons.Check /></button></div>
                                                </div>
                                                <div className="w-full relative h-40 rounded-xl overflow-hidden border border-slate-200 shadow-inner">
                                                    <div className="absolute top-2 left-2 z-10 bg-white/95 px-2 py-1 rounded-md text-xs font-bold text-slate-600 shadow-sm flex items-center gap-2">
                                                        {isLocating ? <span className="animate-pulse text-indigo-500">自動定位中...</span> : '📍 拖曳紅點微調精準位置'}
                                                    </div>
                                                    <LocationPicker lat={editCoords.lat} lng={editCoords.lng} onChange={(lat, lng) => { setEditCoords({lat, lng}); setUserDragged(true); }} />
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="flex-1">
                                                <h2 className="text-2xl font-black text-slate-800 leading-snug pr-8 break-all">{caseData.location?.address}</h2>
                                                {caseData.location?.isFallback && <span className="inline-block mt-2 text-xs bg-amber-50 text-amber-600 border border-amber-200 px-2 py-1 rounded-md font-bold">概略位置，點擊修改進行精準定位</span>}
                                                {caseData.status !== 'CLOSED' && (<button onClick={() => setEditingAddress(true)} className="absolute right-0 top-1 opacity-0 group-hover:opacity-100 transition-opacity text-primary hover:bg-indigo-50 p-1.5 rounded-lg flex items-center gap-1 text-xs font-bold"><Icons.Edit /> 修改定位</button>)}
                                            </div>
                                        )}
                                    </div>
                                    <p className="text-slate-400 font-medium mb-8">
                                        {caseData.category === 'SELF' ? '自辦案件 (無陳情人)' : caseData.category === 'OTHER_UNIT' ? `主政單位：${caseData.petitioner?.name || '-'}` : `陳情人：${caseData.petitioner?.name || '-'}`}
                                    </p>
                                </>
                            )}

                            {/* Basic Info Block */}
                            <div className="bg-slate-50/70 p-6 rounded-3xl mb-6 group relative border border-slate-100">
                                <div className="flex justify-between items-center mb-3">
                                    <span className="text-xs font-bold text-slate-400 uppercase tracking-wider block">案件基本資訊</span>
                                    {caseData.status !== 'CLOSED' && !isEditingBasicInfo && (<button onClick={() => setEditingBasicInfo(true)} className="opacity-0 group-hover:opacity-100 transition-opacity text-primary hover:bg-indigo-50 p-1 rounded flex items-center gap-1 text-xs font-bold"><Icons.Edit /> 修改</button>)}
                                </div>
                                {isEditingBasicInfo ? (
                                    <div className="flex flex-col gap-3 animate-fade-in">
                                        <div><label className="text-xs font-bold text-slate-500 block mb-1">收文 / 收件日期</label><input type="date" className="w-full rounded-xl px-3 py-2 border border-slate-300 bg-white" value={editBasicInfoData.receiveDate} onChange={e => setEditBasicInfoData({...editBasicInfoData, receiveDate: e.target.value})} /></div>
                                        <div><label className="text-xs font-bold text-slate-500 block mb-1">承辦人</label><input type="text" className="w-full rounded-xl px-3 py-2 border border-slate-300 bg-white" value={editBasicInfoData.assignee} onChange={e => setEditBasicInfoData({...editBasicInfoData, assignee: e.target.value})} /></div>
                                        <div><label className="text-xs font-bold text-slate-500 block mb-1">通知文號</label><input type="text" className="w-full rounded-xl px-3 py-2 border border-slate-300 bg-white" value={editBasicInfoData.surveyDocNo} onChange={e => setEditBasicInfoData({...editBasicInfoData, surveyDocNo: e.target.value})} /></div>
                                        <div className="flex justify-end gap-2 mt-2"><button onClick={() => { setEditingBasicInfo(false); setEditBasicInfoData({receiveDate: caseData.extData?.receiveDate||'', assignee: caseData.extData?.assignee||'', surveyDocNo: caseData.extData?.surveyDocNo||''}); }} className="px-4 py-1.5 text-xs font-bold bg-slate-200 text-slate-600 rounded-lg hover:bg-slate-300 transition-colors">取消</button><button onClick={handleSaveBasicInfo} className="px-4 py-1.5 text-xs font-bold bg-primary text-white rounded-lg hover:bg-indigo-600 shadow-sm transition-colors">儲存修改</button></div>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-2 gap-y-4 gap-x-2 text-sm">
                                        <div><span className="block text-xs font-bold text-slate-400 mb-0.5">收文/收件日期</span><span className="font-bold text-slate-700">{caseData.extData?.receiveDate || '-'}</span></div>
                                        <div><span className="block text-xs font-bold text-slate-400 mb-0.5">承辦人</span><span className="font-bold text-slate-700">{caseData.extData?.assignee || '未指派'}</span></div>
                                        <div className="col-span-2"><span className="block text-xs font-bold text-slate-400 mb-0.5">通知文號</span><span className="font-bold text-slate-700">{caseData.extData?.surveyDocNo || '-'}</span></div>
                                    </div>
                                )}
                            </div>

                            {/* Content Block */}
                            <div className="bg-slate-50/70 p-6 rounded-3xl mb-6 group relative border border-slate-100">
                                <div className="flex justify-between items-center mb-3">

                                        <div className="md:col-span-2 my-2 border-b border-slate-100"></div>
                                        <div className="space-y-1.5"><label className="text-sm font-medium text-slate-600 px-1">結案期限</label><input type="date" disabled={caseData.status==='CLOSED'} className="w-full rounded-2xl px-4 py-3.5 text-orange-600 bg-orange-50 border border-orange-200" value={editExtData.completionDeadline || ''} onChange={e => setEditExtData({...editExtData, completionDeadline: e.target.value})} /></div>

                            <div className="mt-8 flex gap-4">
